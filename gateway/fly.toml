# fly.toml app configuration file generated for lantern-gateway on 2026-11-01T09:57:11-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lantern-gateway'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  LANTERN_DAILY_REQUESTS = '120'
  LANTERN_DB = '/home/app/data/lantern_gateway.db'
  LANTERN_FREE_REQUESTS = '300'
  LANTERN_GLOBAL_DAILY_USD = '10'

[[mounts]]
  source = 'lantern_data'
  destination = '/home/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
