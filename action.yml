name: Lantern report
description: >-
  Check this repository with Lantern and leave the report on it: a comment on each pull request with Passed, Blocked
  or Incomplete and with what the pull request changes (new routes, login checks, broken links, findings), a pull
  request that saves the report in .lantern/report, and the badge for the front page.
author: LittleHenderson
branding:
  icon: shield
  color: green

inputs:
  path:
    description: The folder to check, inside the repository.
    default: "."
  comment:
    description: Post the result on each pull request as one comment that is updated on every push (true or false).
    default: "true"
  change:
    description: >-
      On a pull request: also check the code as it was before the pull request, and say what the pull request
      changes: routes and pages added or removed, login checks that changed, links between page and server that
      broke, findings that are new, fixed or reached now, and the release decision before and after (true or false).
    default: "true"
  code-scanning:
    description: >-
      Hand the findings to GitHub's code scanning as well (true or false). The workflow then needs
      'security-events: write' under permissions, and GitHub adds a check of its own to pull requests. The findings
      are in the full report as lantern.sarif either way.
    default: "false"
  save-report:
    description: >-
      On the default branch: open, or bring up to date, one pull request that saves the report in .lantern/report
      (pull-request), or do not (off).
    default: pull-request
  require:
    description: >-
      When this check fails: not-blocked (when the result is Blocked), passed (whenever it is not Passed) or none
      (never; the result is still posted).
    default: not-blocked
  offline:
    description: Skip the look-up of the project's libraries in the advisory databases (true or false).
    default: "false"
  python-version:
    description: The Python that runs Lantern.
    default: "3.12"
  token:
    description: The token that posts the comment and the pull request. The workflow's own token is enough.
    default: ${{ github.token }}

outputs:
  decision:
    description: Passed, Blocked, Incomplete, or none for a report with no decision.
    value: ${{ steps.check.outputs.decision }}
  report-folder:
    description: Where the results of this check are on the runner.
    value: ${{ steps.check.outputs.results }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Every value from outside reaches the scripts below through an environment variable, never written into a
    # script: a branch name or a title cannot become a command.
    - name: Install Lantern
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/lantern-src"
        rm -rf "$src"
        cp -R "$ACTION_PATH" "$src"
        # The exact Lantern commit goes into the report, so an engineer can install the same one to check it.
        sha=""
        if [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
          sha="$ACTION_REF"
        elif [ -n "$ACTION_REPO" ] && [ -n "$ACTION_REF" ]; then
          refs="$(git ls-remote "https://github.com/$ACTION_REPO" "$ACTION_REF" "$ACTION_REF^{}" 2>/dev/null || true)"
          sha="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {print $1; exit}')"
          [ -n "$sha" ] || sha="$(printf '%s\n' "$refs" | awk 'NR==1 {print $1}')"
        else
          sha="$(git -C "$ACTION_PATH" rev-parse HEAD 2>/dev/null || true)"
        fi
        if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          printf 'COMMIT = "%s"\n' "$sha" >> "$src/lantern/_build.py"
        fi
        python -m pip install --quiet --disable-pip-version-check "$src[scan]"
        lantern --version

    - name: Check the repository
      id: check
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        OFFLINE: ${{ inputs.offline }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/lantern-results"
        rm -rf "$out"
        flags=()
        [ "$OFFLINE" = "true" ] && flags+=(--offline)
        lantern analyze "$TARGET" --out "$out" "${flags[@]}"
        code=$?
        if [ ! -f "$out/evidence.json" ]; then
          echo "::error title=Lantern::Lantern could not finish the check (exit $code). The log above says why."
          exit 1
        fi
        decision="$(lantern github summary "$TARGET" --out "$out" --decision-only)"
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
        echo "results=$out" >> "$GITHUB_OUTPUT"
        echo "Lantern's decision: $decision"
        # The findings in the form other tools read (SARIF), kept with the full report.
        lantern export "$TARGET" --out "$out" --sarif "$out/lantern.sarif" >/dev/null \
          || echo "::warning title=Lantern::The findings could not be written as lantern.sarif."

    - name: See what this pull request changes
      id: change
      if: github.event_name == 'pull_request' && inputs.change == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TARGET: ${{ inputs.path }}
        RESULTS: ${{ steps.check.outputs.results }}
        OFFLINE: ${{ inputs.offline }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_NAME: ${{ github.event.pull_request.base.ref }}
      run: |
        set -uo pipefail
        say() {
          echo "::warning title=Lantern::$1"
          printf '\n> **Lantern could not say what this pull request changes.** %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
        }
        # What is checked out for a pull request is GitHub's merge of it into the branch it is for, so the code
        # before the change is that commit's first parent. A workflow that checks out something else is compared
        # with the commit where its branch began, which needs the branch's history.
        parents="$(git -C "$TARGET" cat-file -p HEAD 2>/dev/null | sed -n 's/^parent \([0-9a-f]\{40\}\)$/\1/p')"
        if [ -n "$HEAD_SHA" ] && [ "$(printf '%s\n' "$parents" | sed -n 2p)" = "$HEAD_SHA" ]; then
          base="$(printf '%s\n' "$parents" | sed -n 1p)"
        else
          base="$(git -C "$TARGET" merge-base "$BASE_SHA" HEAD 2>/dev/null || true)"
        fi
        if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
          say "This workflow checks out something other than GitHub's merge of the pull request, without the history that shows where the branch began. Leave 'ref' out of the checkout step, or give that step 'fetch-depth: 0'."
          exit 0
        fi
        if ! git -C "$TARGET" cat-file -e "$base^{commit}" 2>/dev/null; then
          auth=()
          if [ -n "$GH_TOKEN" ] && ! git -C "$TARGET" config --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::$basic"
            auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          git -C "$TARGET" ${auth[@]+"${auth[@]}"} fetch -q --no-tags --depth=1 origin "$base" \
            || { say "The code as it was before this pull request (commit ${base:0:12}) could not be fetched."; exit 0; }
        fi
        flags=()
        [ "$OFFLINE" = "true" ] && flags+=(--offline)
        if lantern diff "$TARGET" "$base" --head-results "$RESULTS" --out "$RESULTS/change" \
             --base-label "$BASE_NAME" --head-label "this pull request" ${flags[@]+"${flags[@]}"}; then
          echo "receipt=$RESULTS/change/change.json" >> "$GITHUB_OUTPUT"
        else
          say "The comparison with the code before this pull request did not finish. This step's log says why."
        fi

    - name: Keep the full report with this run
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: lantern-report
        path: ${{ steps.check.outputs.results }}
        if-no-files-found: error

    - name: Write the result on this run's page
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
        RESULTS: ${{ steps.check.outputs.results }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        RECEIPT: ${{ steps.change.outputs.receipt }}
      run: |
        set -euo pipefail
        # On a pull request the page and the comment begin with what the pull request changes.
        change=()
        [ -n "${RECEIPT:-}" ] && change=(--change "$RECEIPT")
        lantern github summary "$TARGET" --out "$RESULTS" --run-url "$RUN_URL" --report-url "$REPORT_URL" \
          ${change[@]+"${change[@]}"} > "$RUNNER_TEMP/lantern-summary.md"
        lantern github summary "$TARGET" --out "$RESULTS" --short --run-url "$RUN_URL" --report-url "$REPORT_URL" \
          ${change[@]+"${change[@]}"} > "$RUNNER_TEMP/lantern-comment.md"
        cat "$RUNNER_TEMP/lantern-summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        body="$RUNNER_TEMP/lantern-comment.md"
        say() {
          echo "::warning title=Lantern::$1"
          printf '\n> **Lantern could not comment on the pull request.** %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
        }
        if ! command -v gh >/dev/null; then say "GitHub's gh program is not on this runner."; exit 0; fi
        # The one comment this workflow made before: a bot's comment that starts with Lantern's mark.
        id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
               --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- lantern-report -->"))) | .id' \
               2>/dev/null | tail -n 1)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null \
            || say "Updating the earlier comment was refused. A pull request from a fork gets a read-only token."
        else
          gh api "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null \
            || say "Posting was refused. A pull request from a fork gets a read-only token; the result is on this run's page."
        fi

    - name: Hand the findings to GitHub's code scanning
      if: inputs.code-scanning == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        RESULTS: ${{ steps.check.outputs.results }}
      run: |
        set -uo pipefail
        note() {
          echo "$1"
          printf '\n> **Lantern did not hand its findings to code scanning.** %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
        }
        sarif="$RESULTS/lantern.sarif"
        if [ ! -s "$sarif" ]; then note "The file lantern.sarif was not written."; exit 0; fi
        if ! command -v gh >/dev/null; then note "GitHub's gh program is not on this runner."; exit 0; fi
        packed="$RUNNER_TEMP/lantern-sarif.b64"
        gzip -c "$sarif" | base64 | tr -d '\n' > "$packed"
        # GitHub maps each finding to a file through the folder that was checked out.
        if said="$(gh api -X POST "repos/$REPO/code-scanning/sarifs" -f "commit_sha=$GITHUB_SHA" -f "ref=$GITHUB_REF" \
                     -f "checkout_uri=file://$GITHUB_WORKSPACE" -f "tool_name=Lantern" -F "sarif=@$packed" 2>&1)"; then
          echo "Lantern's findings were handed to GitHub's code scanning."
        else
          printf '%s\n' "$said" | head -n 5
          case "$said" in
            *"not accessible by integration"*)
              note "The workflow may not write code-scanning results. Add 'security-events: write' under permissions in the workflow file. A pull request from a fork never may.";;
            *"dvanced Security"*|*"ode scanning is not enabled"*|*"ode Security"*)
              note "Code scanning is not switched on for this repository. GitHub offers it for public repositories, and for private ones with GitHub Code Security.";;
            *)
              note "GitHub did not take them. This step's log has GitHub's answer.";;
          esac
        fi

    - name: Save the report through a pull request
      if: >-
        inputs.save-report == 'pull-request' && github.event_name != 'pull_request'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BASE: ${{ github.event.repository.default_branch }}
        TARGET: ${{ inputs.path }}
        RESULTS: ${{ steps.check.outputs.results }}
        DECISION: ${{ steps.check.outputs.decision }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        set -uo pipefail
        head="lantern/report"
        say() {
          echo "::warning title=Lantern::$1"
          printf '\n> **Lantern could not save the report through a pull request.** %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
        }
        if ! command -v gh >/dev/null; then say "GitHub's gh program is not on this runner."; exit 0; fi
        if git log -1 --format=%s 2>/dev/null | grep -q '^Lantern report for '; then
          echo "This commit is a report Lantern saved; nothing to save."; exit 0
        fi
        short="${GITHUB_SHA:0:7}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -q -C "$head" || { say "The branch $head could not be made."; exit 0; }
        lantern github save "$TARGET" --out "$RESULTS" --run-url "$RUN_URL" --report-url "$REPORT_URL" \
          || { say "The report folder could not be written."; exit 0; }
        git add -f -- "$TARGET/.lantern/report"
        if git diff --cached --quiet; then echo "The saved report is already this one."; exit 0; fi
        git commit -q -m "Lantern report for $short: $DECISION"
        auth=()
        if ! git config --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
        fi
        git "${auth[@]}" push -q -f origin "$head" || { say "Pushing the branch $head was refused. The workflow needs 'contents: write' under permissions."; exit 0; }
        title="Lantern report: $DECISION (commit $short)"
        body="$RUNNER_TEMP/lantern-summary.md"
        pr="$(gh pr list --repo "$REPO" --head "$head" --base "$BASE" --state open --json number --jq '.[0].number' 2>/dev/null)"
        if [ -n "$pr" ]; then
          gh pr edit "$pr" --repo "$REPO" --title "$title" --body-file "$body" >/dev/null \
            || say "The pull request #$pr could not be updated."
        else
          gh pr create --repo "$REPO" --base "$BASE" --head "$head" --title "$title" --body-file "$body" \
            || say "GitHub refused to open the pull request. On GitHub open Settings, then Actions, then General, tick 'Allow GitHub Actions to create and approve pull requests' under Workflow permissions, and Save. The report is on the branch $head meanwhile."
        fi

    - name: Pass or fail this check
      shell: bash
      env:
        REQUIRE: ${{ inputs.require }}
        DECISION: ${{ steps.check.outputs.decision }}
      run: |
        case "$REQUIRE" in
          none) echo "Lantern's decision is $DECISION; this check passes whatever it is (require: none).";;
          passed)
            if [ "$DECISION" != "Passed" ]; then
              echo "::error title=Lantern::The decision is $DECISION, and this check asks for Passed."; exit 1
            fi;;
          not-blocked)
            if [ "$DECISION" = "Blocked" ]; then
              echo "::error title=Lantern::The decision is Blocked. The comment and this run's page say what blocks it."; exit 1
            fi;;
          *) echo "::error title=Lantern::require must be not-blocked, passed or none (it is '$REQUIRE')."; exit 1;;
        esac
        echo "Lantern's decision: $DECISION"
