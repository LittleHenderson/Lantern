name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  # Every test must run here. A test file or a test that is skipped because a library is not installed fails the run
  # and is named (tests/conftest.py). Until 2026-11-10 the test jobs had neither PyJWT nor cryptography, so the 14
  # Connect GitHub tests were skipped as one, in runs that were green. Each pytest line carries -rs, so the log names
  # every skipped test with its reason.
  LANTERN_TESTS_COMPLETE: required
jobs:
  # Every job and every step that runs tests has a time limit, in this order: a test that runs past 15 minutes has
  # every thread say where it waits (pyproject.toml), the no-network runner lists what a run past its deadline still
  # runs and ends it, the step's limit, the job's (tests/test_time_limits.py). On 2026-11-17 a run of the tests printed
  # 89% and then nothing for 2 h 39 min, until it was cancelled by hand: GitHub's six hours were the only limit.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract, so the screenshot-reading tests run (tests/test_ocr.py)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: strace 7.3 with its makers' fix of 2026-11-10, built from its source (it writes down every address a program of the tests tries)
        timeout-minutes: 10
        # tools/netless.py --watch has strace write down every address any program of the tests tries. Every released
        # strace (7.3, of 2026-10-22, and older) can stop at random when a program it follows ends right after a
        # signal: it takes a failed PTRACE_GETSIGINFO for a group-stop, asks PTRACE_LISTEN of a program that is in none,
        # gets an input/output error and ends the record (strace's issue 433). In this job that cut the record of the
        # tests off on 2026-11-14, 2026-11-17 and 2026-11-18 (the runner then says so: result 6). Its makers fixed it
        # after that release, so no packaged strace has the fix yet. This builds the release, checked against its
        # fingerprint, with their commit as it is (tools/strace/3a4f0c7.patch; the owner's choice of 2026-11-20).
        # Three of the commit's eight files are not applied: its news, git's list of files to ignore (not in a
        # release) and the build list the release's build files were made from; the helper the commit adds for its
        # test is built with the rule of its twin, disable_ptrace_getregset. The makers' own test of the fault
        # (getsiginfo-esrch, with and without --seccomp-bpf) must first fail on the release as it is, with the error CI
        # saw, and then pass on the fixed strace once it is installed in /usr/local. No other strace is installed, and
        # the step ends by checking that the strace found on the PATH the recorder is handed under sudo is this one,
        # at 7.3 (tests/test_ci_recorder.py).
        shell: bash
        run: |
          at="$RUNNER_TEMP/strace"
          mkdir -p "$at" && cd "$at"
          log="$at/build.log"   # what configure, make and the makers' tests say; its end is shown when a part fails
          quietly() { "$@" >> "$log" 2>&1 || { tail -n 80 "$log"; echo "::error::Building strace stopped at: $*"; exit 1; }; }
          curl --fail --location --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors --max-time 120 \
            --output strace-7.3.tar.xz https://github.com/strace/strace/releases/download/v7.3/strace-7.3.tar.xz
          echo "529634c40910895a9a1f3c5c1e65da2ca9ed72fb158dfc4bcc89efdf05e39b72  strace-7.3.tar.xz" | sha256sum --check --strict
          tar -xJf strace-7.3.tar.xz
          cd strace-7.3
          fix="$GITHUB_WORKSPACE/tools/strace/3a4f0c7.patch"
          # 1. The release as it is, with the helper and the test the commit adds: the makers' test must fail, with the fault
          git apply --exclude=NEWS --exclude=src/.gitignore --exclude=src/Makefile.am --exclude=src/strace.c "$fix"
          quietly ./configure --enable-mpers=no --enable-stacktrace=no --without-libselinux --disable-dependency-tracking
          quietly make -j"$(nproc)"
          quietly make -C src -f Makefile -f - disable_ptrace_getsiginfo <<'RULE'
          disable_ptrace_getsiginfo$(EXEEXT): disable_ptrace_getsiginfo.$(OBJEXT) $(disable_ptrace_getregset_DEPENDENCIES) ; $(LINK) disable_ptrace_getsiginfo.$(OBJEXT) $(disable_ptrace_getregset_LDADD) $(LIBS)
          RULE
          tests="getsiginfo-esrch.gen.test getsiginfo-esrch--seccomp-bpf.gen.test"
          for t in $tests; do tests/gen_tests.sh tests/gen_tests.in "tests/$t"; done
          makers_test() {   # their test, run by their own harness on the strace named; each test's result is in its .trs file
            STRACE="$1" TIMEOUT_DURATION=120 make -C tests check TESTS="$tests" check_PROGRAMS="run_expect_termsig unblock_reset_raise" >> "$log" 2>&1
          }
          makers_logs() {   # each test's own log: what it compared and what strace said, where its result is not the one it must be
            for t in $tests; do echo "--- tests/${t%.test}.log:"; cat "tests/${t%.test}.log" || true; done
          }
          fault='ptrace\(PTRACE_LISTEN,[^)]*\): Input/output error'
          # Their test expects "<pid> +++ killed by SIGKILL +++" with one space after the number, which is how strace
          # writes a process number of five digits or more; a machine that has not yet started 10,000 programs gives
          # a smaller one two spaces, and the test fails for that alone (this step's first build: process 9103). Short
          # programs are started until the numbers have five digits; the test itself is left as it is.
          until [ "$(sh -c 'echo $$')" -ge 10000 ]; do :; done
          if makers_test "$PWD/src/strace"; then tail -n 25 "$log"; makers_logs; echo "::error::The makers' test of the fault passed on strace 7.3 as released: here it shows nothing"; exit 1; fi
          for t in $tests; do
            b="tests/${t%.test}"
            grep -qx ':test-result: FAIL' "$b.trs" && grep -E "$fault" "$b.log" > "$at/${t%.test}.fault" \
              || { cat "$b.log"; echo "::error::$t did not fail on strace 7.3 as released with the fault CI saw"; exit 1; }
          done
          # 2. Their fix, built and installed: the same test must pass on what was installed
          git apply --include=src/strace.c "$fix"
          quietly make -j"$(nproc)"
          quietly sudo make install
          makers_test /usr/local/bin/strace || { tail -n 25 "$log"; makers_logs; echo "::error::The makers' test of the fault failed on strace 7.3 with their fix"; exit 1; }
          for t in $tests; do
            b="tests/${t%.test}"
            grep -qx ':test-result: PASS' "$b.trs" || { cat "$b.log"; echo "::error::$t did not pass on strace 7.3 with their fix"; exit 1; }
          done
          # 3. The strace the recorder will find: the no-network runner looks it up on the PATH it is handed under sudo
          found=$(sudo env "PATH=$PATH" sh -c 'command -v strace')
          test "$found" = /usr/local/bin/strace || { echo "::error::The strace found under sudo is ${found:-none}, not the one built here"; exit 1; }
          first=$(sudo env "PATH=$PATH" strace -V | sed -n 1p)
          test "$first" = "strace -- version 7.3" || { echo "::error::$found says: $first"; exit 1; }
          echo "$found: strace 7.3 with its makers' fix of 2026-11-10 (commit 3a4f0c7). Their test of the fault passed on it; on 7.3 as released it failed with:"
          cat "$at"/*.fault
      - run: pip install -e ".[scan,dev]" pytest-cov
      - name: Docker answers before the tests start (four sandbox tests need it)
        # Where Docker does not answer, those four tests are skipped and the log names them. In one of the six Linux
        # jobs of 2026-11-10 that happened (`docker info` failed at that moment) and the pass was green without them.
        # This waits for Docker for up to a minute, and says in the run's notices when it never answered.
        run: |
          for i in $(seq 1 30); do docker info --format 'Docker {{.ServerVersion}} answers' 2>/dev/null && exit 0; sleep 2; done
          echo "::warning::Docker did not answer within 60 seconds: the four Docker sandbox tests will be skipped, and the test log names them"
      - name: gitleaks 8.30.1 for the tests of how Lantern starts it, built from its source (Go checks what it downloads against its public record)
        # tests/test_scanners.py runs against the real program where LANTERN_TESTS_GITLEAKS names one (where it
        # names none, those tests are skipped and the log says so). It is not put on PATH: every other test, and
        # Lantern's check of itself below, run as they do on a computer without it.
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks" GOTOOLCHAIN=auto CGO_ENABLED=0 go install -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          program="$RUNNER_TEMP/gitleaks/gitleaks$(go env GOEXE)"
          test "$("$program" version)" = "8.30.1"
          echo "LANTERN_TESTS_GITLEAKS=$program" >> "$GITHUB_ENV"
      - name: TypeScript 6.0.2 and pyright 1.1.414 for the tests of the type-aware pass, from npm, fixed versions, install scripts off
        # tests/test_typecheck.py starts the real checkers where LANTERN_TESTS_TYPECHECK is set, and under `required`
        # a checker that is not found fails its tests. They are installed outside the checkout and kept off PATH,
        # and named by the variables Lantern itself reads, so that Lantern's check of itself runs as on a computer
        # without them. Each version is read back from what was installed before it is named. Nothing comes with
        # them: neither package needs another, and the one pyright would take if it could (a file watcher for macOS,
        # asked for by a range of versions) is left out, so the two fixed versions are all that is installed.
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/checkers" --no-save --ignore-scripts --omit=optional --no-audit --no-fund typescript@6.0.2 pyright@1.1.414
          at="$RUNNER_TEMP/checkers/node_modules"
          test "$(node -p "require(process.argv[1]).version" "$at/typescript/package.json")" = "6.0.2"
          test "$(node -p "require(process.argv[1]).version" "$at/pyright/package.json")" = "1.1.414"
          echo "LANTERN_TYPESCRIPT=$at/typescript" >> "$GITHUB_ENV"
          echo "LANTERN_PYRIGHT=$at/pyright/langserver.index.js" >> "$GITHUB_ENV"
          echo "LANTERN_TESTS_TYPECHECK=required" >> "$GITHUB_ENV"
      - name: Tests, measuring how much of the code they run (coverage; the build fails under 85%)
        timeout-minutes: 110
        # The tests run without a network: tools/netless.py gives the run one that holds nothing but this computer's
        # own address, and has the operating system write down every address any program of the run tries. Anything
        # tried outside this computer fails the step (result 4) even when every test passed. LANTERN_TESTS_NETLESS
        # makes the tests refuse to start anywhere else. Making that network needs root; the tests themselves then
        # run as the ordinary user again.
        # sudo hands a command only what is written on its own line: the sudo of GitHub's machines ignores -E and
        # says so, and until 2026-11-10 neither rule reached the tests of this step wherever that sudo ran. So both
        # rules are written on that line, and the last line looks for them in the run's own words: a rule that did
        # not arrive fails the step. The gitleaks built above is named on that line too, and the run's own words
        # must say that its tests started it, with its version and the way it was handed a project. The same for
        # the two type checkers installed above: their rule and the two places Lantern is told to find them are on
        # that line, the rule is looked for among the run's rules, and the run's own words must name both versions.
        # The runner gives the tests 100 minutes (runs of 2026-11-17 took 48 to 62): past them it lists every process of the run,
        # thread by thread, asks the tests to end (pytest then says where it stood) and ends what is left (result 7).
        env:
          LANTERN_TESTS_NETLESS: required
        run: |
          set -o pipefail   # the run is piped into tee: without this the step would pass whatever the tests did
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "LANTERN_TESTS_COMPLETE=$LANTERN_TESTS_COMPLETE" "LANTERN_TESTS_NETLESS=$LANTERN_TESTS_NETLESS" "LANTERN_TESTS_GITLEAKS=$LANTERN_TESTS_GITLEAKS" \
            "LANTERN_TESTS_TYPECHECK=$LANTERN_TESTS_TYPECHECK" "LANTERN_TYPESCRIPT=$LANTERN_TYPESCRIPT" "LANTERN_PYRIGHT=$LANTERN_PYRIGHT" \
            python tools/netless.py --watch "$RUNNER_TEMP/network.json" --deadline 100 -- \
            python -m pytest -q -rs --cov=lantern --cov=gateway --cov=cloud --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=85 | tee pytest.log
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=required.*LANTERN_TESTS_NETLESS=required.*LANTERN_TESTS_TYPECHECK=required' pytest.log || { echo "::error::The rules this step sets did not reach the tests: the last lines of the run do not name all three"; exit 1; }
          grep '^programs these tests started' pytest.log || true   # which npm the tests met: what npm asks differs by version, and this line is far up in the log
          grep -q '^programs these tests started: .*gitleaks 8\.30\.1 (linked)' pytest.log || { echo "::error::The tests of how Lantern starts gitleaks did not run against the gitleaks built for them"; exit 1; }
          grep -q '^programs these tests started: .*pyright 1\.1\.414 (node at .*typescript 6\.0\.2 (node at ' pytest.log || { echo "::error::The tests of the type-aware pass did not start the two type checkers installed for them"; exit 1; }
      - name: Coverage and the network record, for the summary
        if: always()
        run: |
          { echo "### Coverage (Python ${{ matrix.python }})"; echo '```'; grep -E '^(TOTAL|Required|FAIL|rules of this run|programs these tests started)' pytest.log || true; echo '```'
            echo "### Network during the tests (Python ${{ matrix.python }})"; echo '```'
            python -c "import json, sys; d = json.load(open(sys.argv[1])); print(sum(e['count'] for e in d['outside']), 'attempts to reach outside this computer;', d['connections_on_this_computer'], 'connections stayed on it'); [print(' ', e['count'], 'x', e['kind'], e['address'], e['port'], 'by:', e['program']) for e in d['outside']]; print('the recorder saw the tests to their end:', {True: 'yes', False: 'no', None: 'nothing was recorded'}.get(d.get('command_end_recorded'), '?'), '| past the deadline:', 'yes, ' + str(d.get('ended_at_deadline')) if d.get('past_deadline') else 'no')" "$RUNNER_TEMP/network.json" || echo "no record was written"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The tests of the isolation itself, a second time as root (the pass above skips four of them, and names them)
        timeout-minutes: 20
        # Four tests of tests/test_netguard.py cannot run in the pass above: two need root (there the tests run as the
        # ordinary user again), one starts the no-network runner, which cannot be started inside itself without root,
        # and one needs a way out for the refusal to show, which that pass does not have. Until 2026-11-10 three of
        # them ran nowhere in CI, the fourth only in the audit of the 3.13 job. Here the whole file runs as root with
        # this computer's ordinary network; the guard in tests/conftest.py refuses and records every attempt, as it
        # does everywhere. No test may be skipped in this pass: one that is, whatever the reason, fails it and is
        # named. Nothing is written into the checkout; root's run keeps a copy of the guard's two files in /run, for
        # the programs it starts under another user, who may not enter this checkout. As above, the rule is written
        # on the sudo line and then looked for in the run's own words.
        env:
          LANTERN_TESTS_COMPLETE: no-skips
        run: |
          set -o pipefail   # piped into tee, as above
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "LANTERN_TESTS_COMPLETE=$LANTERN_TESTS_COMPLETE" PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -rs -p no:cacheprovider tests/test_netguard.py | tee "$RUNNER_TEMP/second-pass.log"
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=no-skips' "$RUNNER_TEMP/second-pass.log" || { echo "::error::The rule this step sets did not reach the tests: the last lines of the run do not name it"; exit 1; }
      - name: The tests of a run's own network, a second time where an ordinary user may make one (in the pass above only Docker's container had one)
        timeout-minutes: 20
        # A project's tests get a network of their own in the sandbox (lantern/_jail.py, 2026-11-13). Root makes it
        # directly, an ordinary user through a user namespace, and GitHub's Linux machines refuse an ordinary user
        # that (the first pass of commit 9e6696f said so: "this system does not let the tests have a network of
        # their own (error 13)"). So in the pass above the restricted process fell back to refusing every address,
        # which is what it must do there and what that pass tested, and a test's own server answered only in
        # Docker's container: the launcher's own network was made nowhere in CI. This step takes the machine's rule
        # against user namespaces for ordinary users away and runs the file again, as the ordinary user and with
        # the computer's ordinary network (the guard in tests/conftest.py refuses and records every attempt, as it
        # does everywhere). No test may be skipped: the test that needs the launcher's network is skipped where it
        # cannot be made, which fails this step and names the reason. The rule is put back for the steps after.
        env:
          LANTERN_TESTS_COMPLETE: no-skips
        run: |
          set -o pipefail   # piped into tee, as above
          rule=kernel.apparmor_restrict_unprivileged_userns
          was=$(sysctl -n "$rule" 2>/dev/null || true)
          echo "the machine's rule $rule: ${was:-not there}"
          if [ -n "$was" ]; then sudo sysctl -w "$rule=0"; fi
          python -c "from lantern import sandbox; print('a network of its own for an ordinary user here:', sandbox.own_network() or 'yes')"
          status=0
          python -m pytest -q -rs -p no:cacheprovider tests/test_sandbox_own_network.py | tee "$RUNNER_TEMP/own-network.log" || status=$?
          if [ -n "$was" ]; then sudo sysctl -w "$rule=$was"; fi
          [ "$status" -eq 0 ] || exit "$status"
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=no-skips' "$RUNNER_TEMP/own-network.log" || { echo "::error::The rule this step sets did not reach the tests: the last lines of the run do not name it"; exit 1; }
      - name: The website's tests of each check under a user of its own and of its switcher, a second time as root (the pass above skips them)
        timeout-minutes: 20
        # The cloud service runs each check's steps as a user of that check's own (cloud/lantern_cloud/apart.py,
        # 2026-11-18), which only root can do, so the tests of it need root and the pass above names them as skipped;
        # so do the tests of the switcher, the one part of the website's image that stays root, which starts the
        # service as an ordinary user and each check's steps as the check's user (cloud/lantern_cloud/switcher.py).
        # Here the file runs as root, and no test may be skipped. A check's user is none of this machine's users, and
        # the twins run Lantern's own analysis as that user, which reads Lantern's code from this checkout as it
        # reads it from the website's image: the folders above the checkout are opened for passing through (not for
        # listing) first. As above, the rule is written on the sudo line and then looked for in the run's own words.
        env:
          LANTERN_TESTS_COMPLETE: no-skips
        run: |
          set -o pipefail   # piped into tee, as above
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "LANTERN_TESTS_COMPLETE=$LANTERN_TESTS_COMPLETE" PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -rs -p no:cacheprovider tests/test_cloud_step_user.py tests/test_cloud_switcher.py | tee "$RUNNER_TEMP/step-user.log"
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=no-skips' "$RUNNER_TEMP/step-user.log" || { echo "::error::The rule this step sets did not reach the tests: the last lines of the run do not name it"; exit 1; }
      - name: Lantern audits itself (no critical, high, or medium findings)
        # isolated (tools/netguard): only the three addresses the dependency audit asks can be reached
        run: python tools/netguard/lantern_netguard.py --allow pypi.org,registry.npmjs.org,api.osv.dev -- lantern analyze . --out /tmp/self --fail-on medium
      - name: Lantern passes its own readiness checks (grade A, every check pass or skip except the listed ones)
        run: python tools/self_readiness.py /tmp/self/readiness.json
      - name: Audit package checks (tools/audit.sh)
        if: matrix.python == '3.13'
        timeout-minutes: 100
        run: bash tools/audit.sh

  lint:
    # Mistakes that are not bugs yet (undefined names, unused variables, likely-bug patterns), and every library
    # Lantern ships with has a licence that allows it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install ruff pip-licenses -e ".[scan,dev]"
      - run: ruff check lantern gateway cloud tests tools bench examples
      - name: Licences of Lantern's own libraries (allow-list in tools/licences.py)
        run: python tools/licences.py
      - name: The lock file matches pyproject.toml (every library it names is still declared)
        run: python tools/licences.py --lock-matches

  gateway:
    # The free allowance testers get by default: the live gateway must answer. Prints its health (version and
    # model, no counters) to the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl the live gateway's health check
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 https://lantern-gateway.fly.dev/v1/health | tee health.json
          echo
          python3 - <<'PY'
          import json, os
          d = json.load(open("health.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Live gateway\n```\n$ curl -fsS https://lantern-gateway.fly.dev/v1/health\n" + json.dumps(d) + "\n```\n")
          assert d.get("ok") is True and d.get("configured") is True, d
          if "version" not in d:
              print("::notice::the live gateway predates the version field; deploy gateway/ to add it")
          PY

  cloud-image:
    # Cloud mode's server image (cloud/Dockerfile, built from the repository root) builds, starts as root only in its
    # switcher, which starts the service as an ordinary user of its own and each check's steps as a user of that
    # check's own (cloud/lantern_cloud/switcher.py), keeps each check's steps apart (its health page says "apart" once
    # a step of a check's user could read none of the service's own files: cloud/lantern_cloud/apart.py), and answers
    # its health check with the engine inside.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - run: docker build -f cloud/Dockerfile -t lantern-cloud .
      - name: start it and read /v1/health
        run: |
          docker run -d --name lc -p 8090:8080 lantern-cloud   # its own places, as on the live machine (one disk)
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors --max-time 10 http://127.0.0.1:8090/v1/health | tee health.json \
            || { docker logs lc; exit 1; }
          echo
          # Who runs what, from the system's own table: the first program is the switcher, as root (only root can start
          # a step as a check's user); the service is not root, not nobody and none of the checks' users.
          docker exec -i lc python3 -I - <<'PY'
          import os
          rows = {}
          for pid in os.listdir("/proc"):
              if not pid.isdigit():
                  continue
              try:
                  with open(f"/proc/{pid}/status", encoding="utf-8") as f:
                      uids = [int(x) for x in next(l for l in f if l.startswith("Uid:")).split()[1:]]
                  with open(f"/proc/{pid}/cmdline", "rb") as f:
                      words = f.read().split(b"\0")
              except (OSError, StopIteration, ValueError):
                  continue
              rows[int(pid)] = (uids, [w.decode("utf-8", "replace") for w in words if w])
          for pid, (uids, words) in sorted(rows.items()):
              print(pid, uids, " ".join(words)[:200])
          first_uids, first = rows[1]
          assert first_uids == [0, 0, 0, 0] and first[first.index("-m") + 1] == "lantern_cloud.switcher", rows[1]
          service = [(uids, words) for pid, (uids, words) in rows.items() if pid != 1 and any("uvicorn" in w for w in words)]
          assert service, rows
          for uids, words in service:
              assert not {0, 65534} & set(uids) and not any(300_000 <= u < 800_000 for u in uids), (uids, words)
          print("the switcher is root; the service runs as", sorted({u for uids, _ in service for u in uids}))
          PY
          for i in $(seq 1 30); do   # the service proves it at start-up, in the background
            curl -fsS --max-time 10 http://127.0.0.1:8090/v1/health -o health.json
            grep -q '"steps":"unchecked"' health.json || break
            sleep 1
          done
          cat health.json; echo
          docker exec lc git --version
          docker exec lc npm --version
          test "$(docker exec lc gitleaks version)" = "8.30.1"
          python3 - <<'PY'
          import json, re
          d = json.load(open("health.json"))
          want = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          assert d["ok"] is True and d["service"] == "lantern-cloud" and d["engine"] == want, d
          assert d["steps"] == "apart", d
          assert d["service_user"] == "own", d
          PY
      - name: the website is served, built from the app's own stylesheet, with a nonce policy
        run: |
          curl -fsS -D site.h http://127.0.0.1:8090/ -o site.html
          grep -qi "content-security-policy: .*nonce-" site.h
          grep -q 'class="dropzone"' site.html
          grep -q -- '--accent:#0F7B74' site.html
          curl -fsS http://127.0.0.1:8090/manifest.webmanifest | grep -q '"start_url": "/"'

  windows:
    # Stock Windows settings: the system code page, not UTF-8, and backslash paths.
    runs-on: windows-latest
    timeout-minutes: 130
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan,dev]"
      - name: gitleaks 8.30.1 for the tests of how Lantern starts it, built from its source (Go checks what it downloads against its public record)
        # tests/test_scanners.py runs against the real program where LANTERN_TESTS_GITLEAKS names one (where it
        # names none, those tests are skipped and the log says so). It is not put on PATH: every other test, and
        # Lantern's check of itself below, run as they do on a computer without it.
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks" GOTOOLCHAIN=auto CGO_ENABLED=0 go install -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          program="$RUNNER_TEMP/gitleaks/gitleaks$(go env GOEXE)"
          test "$("$program" version)" = "8.30.1"
          echo "LANTERN_TESTS_GITLEAKS=$program" >> "$GITHUB_ENV"
      - name: TypeScript 6.0.2 and pyright 1.1.414 for the tests of the type-aware pass, from npm, fixed versions, install scripts off
        # tests/test_typecheck.py starts the real checkers where LANTERN_TESTS_TYPECHECK is set, and under `required`
        # a checker that is not found fails its tests. They are installed outside the checkout and kept off PATH,
        # and named by the variables Lantern itself reads, so that Lantern's check of itself runs as on a computer
        # without them. Each version is read back from what was installed before it is named. Nothing comes with
        # them: neither package needs another, and the one pyright would take if it could (a file watcher for macOS,
        # asked for by a range of versions) is left out, so the two fixed versions are all that is installed.
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/checkers" --no-save --ignore-scripts --omit=optional --no-audit --no-fund typescript@6.0.2 pyright@1.1.414
          at="$RUNNER_TEMP/checkers/node_modules"
          test "$(node -p "require(process.argv[1]).version" "$at/typescript/package.json")" = "6.0.2"
          test "$(node -p "require(process.argv[1]).version" "$at/pyright/package.json")" = "1.1.414"
          echo "LANTERN_TYPESCRIPT=$at/typescript" >> "$GITHUB_ENV"
          echo "LANTERN_PYRIGHT=$at/pyright/langserver.index.js" >> "$GITHUB_ENV"
          echo "LANTERN_TESTS_TYPECHECK=required" >> "$GITHUB_ENV"
      - run: python -m pytest -q -rs
        timeout-minutes: 100
      - name: Lantern audits itself (no critical, high, or medium findings)
        # isolated (tools/netguard): only the three addresses the dependency audit asks can be reached
        shell: bash
        run: python tools/netguard/lantern_netguard.py --allow pypi.org,registry.npmjs.org,api.osv.dev -- lantern analyze . --out "$RUNNER_TEMP/self" --fail-on medium
      - name: Next.js sample finds the unprotected route
        shell: python
        run: |
          import json, os, subprocess, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "nx")
          isolated = [sys.executable, "tools/netguard/lantern_netguard.py", "--allow", "pypi.org,registry.npmjs.org,api.osv.dev", "--"]
          subprocess.run([*isolated, "lantern", "analyze", "tests/fixtures/nextapp", "--out", out], check=True)
          rules = {f["rule"] for f in json.load(open(os.path.join(out, "security.json"), encoding="utf-8"))["findings"]}
          assert "LW-AUTH-MISSING" in rules, rules

  windows-box:
    # The sealed box's tests for Windows alone, and the older tests of what it lets a test do on this computer, so
    # that what the box lets a project's tests do here is known minutes in: GitHub hands out a job's log only once
    # the job has ended, and the Windows job above takes about 50 minutes. That job runs these tests again with the
    # whole suite.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan,dev]"
      - run: >-
          python -m pytest -q -rs tests/test_sandbox_windows.py
          tests/test_sandbox.py::test_tests_that_use_an_event_loop_run
          tests/test_sandbox.py::test_an_event_loop_whose_socket_pair_is_made_the_windows_way_starts_on_windows_and_nowhere_else
          tests/test_sandbox.py::test_the_guard_refuses_every_listener_and_every_connection_on_this_computer_too
          tests/test_sandbox_own_network.py::test_tests_that_start_a_server_on_their_own_computer_run
          tests/test_sandbox_own_network.py::test_the_twin_that_reaches_outside_is_still_refused_and_written_down
          tests/test_sandbox_own_network.py::test_the_guard_lets_this_computer_through_only_in_a_network_the_launcher_made
        timeout-minutes: 10

  macos:
    # macOS runs no other test of Lantern's. These are the ones whose answer the system itself gives: a name handed
    # straight to a socket and the question who an address is, under the sandbox's guard and under the guard of
    # Lantern's own tests, each beside its twins; how gitleaks is started, with the real program; and the type-aware
    # pass, with the two real type checkers (tests/test_typecheck.py, the whole file: `-k` takes it by its name).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan,dev]"
      - name: gitleaks 8.30.1 for the tests of how Lantern starts it, built from its source (Go checks what it downloads against its public record)
        # tests/test_scanners.py runs against the real program where LANTERN_TESTS_GITLEAKS names one (where it
        # names none, those tests are skipped and the log says so). It is not put on PATH.
        # GitHub's macOS machines keep Go in their tool cache and put none on PATH (the Linux and Windows ones have
        # one there): the newest one kept is used, and Homebrew's where none is kept. Whichever Go it is builds
        # the same gitleaks: the version is written in the line that builds it, GOTOOLCHAIN=auto has an older Go
        # fetch the one the source asks for, and Go checks what it downloads against its public record.
        shell: bash
        run: |
          if ! command -v go >/dev/null 2>&1; then
            for bin in "$RUNNER_TOOL_CACHE"/go/*/*/bin; do
              if [ -x "$bin/go" ]; then kept="$bin"; fi
            done
            if [ -n "${kept:-}" ]; then export PATH="$kept:$PATH"; else brew install go; fi
          fi
          go version
          GOBIN="$RUNNER_TEMP/gitleaks" GOTOOLCHAIN=auto CGO_ENABLED=0 go install -ldflags "-X github.com/zricethezav/gitleaks/v8/version.Version=8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1
          program="$RUNNER_TEMP/gitleaks/gitleaks$(go env GOEXE)"
          test "$("$program" version)" = "8.30.1"
          echo "LANTERN_TESTS_GITLEAKS=$program" >> "$GITHUB_ENV"
      - name: TypeScript 6.0.2 and pyright 1.1.414 for the tests of the type-aware pass, from npm, fixed versions, install scripts off
        # tests/test_typecheck.py starts the real checkers where LANTERN_TESTS_TYPECHECK is set, and under `required`
        # a checker that is not found fails its tests. They are installed outside the checkout and kept off PATH,
        # and named by the variables Lantern itself reads, so that Lantern's check of itself runs as on a computer
        # without them. Each version is read back from what was installed before it is named. Nothing comes with
        # them: neither package needs another, and the one pyright would take if it could (a file watcher for macOS,
        # asked for by a range of versions) is left out, so the two fixed versions are all that is installed.
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/checkers" --no-save --ignore-scripts --omit=optional --no-audit --no-fund typescript@6.0.2 pyright@1.1.414
          at="$RUNNER_TEMP/checkers/node_modules"
          test "$(node -p "require(process.argv[1]).version" "$at/typescript/package.json")" = "6.0.2"
          test "$(node -p "require(process.argv[1]).version" "$at/pyright/package.json")" = "1.1.414"
          echo "LANTERN_TYPESCRIPT=$at/typescript" >> "$GITHUB_ENV"
          echo "LANTERN_PYRIGHT=$at/pyright/langserver.index.js" >> "$GITHUB_ENV"
          echo "LANTERN_TESTS_TYPECHECK=required" >> "$GITHUB_ENV"
      - name: The guards' tests of a name in an address, the tests of how gitleaks is started, and the tests of the type-aware pass
        timeout-minutes: 20
        run: |
          python -m pytest -q -rs tests/test_sandbox_guards.py tests/test_sandbox.py tests/test_netguard.py tests/test_scanners.py tests/test_typecheck.py -k "name_in_an_address or twins_a_number_this_computer or who_an_address_is or who_this_computer_is or asked_the_older_ways or handed_straight_to_a_socket or socket_class_of_the_tests_own or twins_this_computer_by_name or number_outside_is_still or gitleaks or test_typecheck"

  browser:
    # The viewer in a real browser: no JS errors, and hostile text can't break or hijack the page.
    # Pinned to Ubuntu 24.04: `ubuntu-latest` moved to 26.04 on 2026-11-05 and Playwright 1.48's browser packages
    # (libicu74, libvpx9, libx264-164) are not in it yet; the same image also runs Tesseract several times slower.
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - run: pip install -e ".[scan,dev]"
      - name: Playwright with all three engines (Chromium, Firefox, WebKit = Safari) and axe-core, the accessibility checker
        run: npm i --no-save playwright@1.48.2 axe-core@4.10.2 && npx playwright install --with-deps chromium firefox webkit
      - name: Tesseract, so the live-app smoke can check a screenshot's text is read
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: LANTERN_BROWSERS="firefox webkit" bash tools/audit.sh --browser
        timeout-minutes: 100

  install:
    # What a tester does: one pip command into a clean venv (no extras), then the first three commands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4   # only for tests/fixtures/shop; Lantern itself comes from pip below
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Clean-venv install from GitHub, then version, analyze, serve --check
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -f "$RUNNER_TEMP/v/Scripts/activate" ]; then . "$RUNNER_TEMP/v/Scripts/activate"; else . "$RUNNER_TEMP/v/bin/activate"; fi
          pip install "git+https://github.com/LittleHenderson/Lantern@${SHA}"
          export LANTERN_HOME="$RUNNER_TEMP/lantern-home"
          {
            echo '### Clean install on ${{ matrix.os }}'
            echo '```'
            echo "$ lantern --version"; lantern --version
            echo "$ lantern analyze tests/fixtures/shop --out $RUNNER_TEMP/shop --offline"
            lantern analyze tests/fixtures/shop --out "$RUNNER_TEMP/shop" --offline 2>&1
            echo "$ lantern serve tests/fixtures/shop --check"
            lantern serve tests/fixtures/shop --check 2>&1 | sed 's/token=[A-Za-z0-9_-]*/token=<one-time>/'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(lantern --version)" = "lantern $(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          test -f "$RUNNER_TEMP/shop/report.html"
          lantern serve tests/fixtures/shop --check > /dev/null
