name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  # Every test must run here. A test file or a test that is skipped because a library is not installed fails the run
  # and is named (tests/conftest.py). Until 2026-11-10 the test jobs had neither PyJWT nor cryptography, so the 14
  # Connect GitHub tests were skipped as one, in runs that were green. Each pytest line carries -rs, so the log names
  # every skipped test with its reason.
  LANTERN_TESTS_COMPLETE: required
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tesseract, so the screenshot-reading tests run (tests/test_ocr.py), and strace, which writes down every address a program tries
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr strace
      - run: pip install -e ".[scan,dev]" pytest-cov
      - name: Docker answers before the tests start (four sandbox tests need it)
        # Where Docker does not answer, those four tests are skipped and the log names them. In one of the six Linux
        # jobs of 2026-11-10 that happened (`docker info` failed at that moment) and the pass was green without them.
        # This waits for Docker for up to a minute, and says in the run's notices when it never answered.
        run: |
          for i in $(seq 1 30); do docker info --format 'Docker {{.ServerVersion}} answers' 2>/dev/null && exit 0; sleep 2; done
          echo "::warning::Docker did not answer within 60 seconds: the four Docker sandbox tests will be skipped, and the test log names them"
      - name: Tests, measuring how much of the code they run (coverage; the build fails under 85%)
        # The tests run without a network: tools/netless.py gives the run one that holds nothing but this computer's
        # own address, and has the operating system write down every address any program of the run tries. Anything
        # tried outside this computer fails the step (result 4) even when every test passed. LANTERN_TESTS_NETLESS
        # makes the tests refuse to start anywhere else. Making that network needs root; the tests themselves then
        # run as the ordinary user again.
        # sudo hands a command only what is written on its own line: the sudo of GitHub's machines ignores -E and
        # says so, and until 2026-11-10 neither rule reached the tests of this step wherever that sudo ran. So both
        # rules are written on that line, and the last line looks for them in the run's own words: a rule that did
        # not arrive fails the step.
        env:
          LANTERN_TESTS_NETLESS: required
        run: |
          set -o pipefail   # the run is piped into tee: without this the step would pass whatever the tests did
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "LANTERN_TESTS_COMPLETE=$LANTERN_TESTS_COMPLETE" "LANTERN_TESTS_NETLESS=$LANTERN_TESTS_NETLESS" \
            python tools/netless.py --watch "$RUNNER_TEMP/network.json" -- \
            python -m pytest -q -rs --cov=lantern --cov=gateway --cov=cloud --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=85 | tee pytest.log
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=required.*LANTERN_TESTS_NETLESS=required' pytest.log || { echo "::error::The rules this step sets did not reach the tests: the last lines of the run do not name both"; exit 1; }
          grep '^programs these tests started' pytest.log || true   # which npm the tests met: what npm asks differs by version, and this line is far up in the log
      - name: Coverage and the network record, for the summary
        if: always()
        run: |
          { echo "### Coverage (Python ${{ matrix.python }})"; echo '```'; grep -E '^(TOTAL|Required|FAIL|rules of this run|programs these tests started)' pytest.log || true; echo '```'
            echo "### Network during the tests (Python ${{ matrix.python }})"; echo '```'
            python -c "import json, sys; d = json.load(open(sys.argv[1])); print(sum(e['count'] for e in d['outside']), 'attempts to reach outside this computer;', d['connections_on_this_computer'], 'connections stayed on it'); [print(' ', e['count'], 'x', e['kind'], e['address'], e['port'], 'by:', e['program']) for e in d['outside']]" "$RUNNER_TEMP/network.json" || echo "no record was written"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The tests of the isolation itself, a second time as root (the pass above skips four of them, and names them)
        # Four tests of tests/test_netguard.py cannot run in the pass above: two need root (there the tests run as the
        # ordinary user again), one starts the no-network runner, which cannot be started inside itself without root,
        # and one needs a way out for the refusal to show, which that pass does not have. Until 2026-11-10 three of
        # them ran nowhere in CI, the fourth only in the audit of the 3.13 job. Here the whole file runs as root with
        # this computer's ordinary network; the guard in tests/conftest.py refuses and records every attempt, as it
        # does everywhere. No test may be skipped in this pass: one that is, whatever the reason, fails it and is
        # named. Nothing is written into the checkout; root's run keeps a copy of the guard's two files in /run, for
        # the programs it starts under another user, who may not enter this checkout. As above, the rule is written
        # on the sudo line and then looked for in the run's own words.
        env:
          LANTERN_TESTS_COMPLETE: no-skips
        run: |
          set -o pipefail   # piped into tee, as above
          sudo env "PATH=$PATH" "HOME=$HOME" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "LANTERN_TESTS_COMPLETE=$LANTERN_TESTS_COMPLETE" PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -rs -p no:cacheprovider tests/test_netguard.py | tee "$RUNNER_TEMP/second-pass.log"
          grep -q '^rules of this run: LANTERN_TESTS_COMPLETE=no-skips' "$RUNNER_TEMP/second-pass.log" || { echo "::error::The rule this step sets did not reach the tests: the last lines of the run do not name it"; exit 1; }
      - name: Lantern audits itself (no critical, high, or medium findings)
        # isolated (tools/netguard): only the three addresses the dependency audit asks can be reached
        run: python tools/netguard/lantern_netguard.py --allow pypi.org,registry.npmjs.org,api.osv.dev -- lantern analyze . --out /tmp/self --fail-on medium
      - name: Lantern passes its own readiness checks (grade A, every check pass or skip except the listed ones)
        run: python tools/self_readiness.py /tmp/self/readiness.json
      - name: Audit package checks (tools/audit.sh)
        if: matrix.python == '3.13'
        run: bash tools/audit.sh

  lint:
    # Mistakes that are not bugs yet (undefined names, unused variables, likely-bug patterns), and every library
    # Lantern ships with has a licence that allows it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install ruff pip-licenses -e ".[scan,dev]"
      - run: ruff check lantern gateway cloud tests tools bench examples
      - name: Licences of Lantern's own libraries (allow-list in tools/licences.py)
        run: python tools/licences.py
      - name: The lock file matches pyproject.toml (every library it names is still declared)
        run: python tools/licences.py --lock-matches

  gateway:
    # The free allowance testers get by default: the live gateway must answer. Prints its health (version and
    # model, no counters) to the job summary.
    runs-on: ubuntu-latest
    steps:
      - name: curl the live gateway's health check
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 https://lantern-gateway.fly.dev/v1/health | tee health.json
          echo
          python3 - <<'PY'
          import json, os
          d = json.load(open("health.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Live gateway\n```\n$ curl -fsS https://lantern-gateway.fly.dev/v1/health\n" + json.dumps(d) + "\n```\n")
          assert d.get("ok") is True and d.get("configured") is True, d
          if "version" not in d:
              print("::notice::the live gateway predates the version field; deploy gateway/ to add it")
          PY

  cloud-image:
    # Cloud mode's server image (cloud/Dockerfile, built from the repository root) builds, starts as a non-root
    # user, and answers its health check with the engine inside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - run: docker build -f cloud/Dockerfile -t lantern-cloud .
      - name: start it and read /v1/health
        run: |
          docker run -d --name lc -p 8090:8080 -e LANTERN_CLOUD_DB=/tmp/c.db -e LANTERN_CLOUD_RESULTS=/tmp/r lantern-cloud
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors --max-time 10 http://127.0.0.1:8090/v1/health | tee health.json
          echo
          test "$(docker exec lc id -u)" != "0"
          docker exec lc git --version
          docker exec lc npm --version
          python3 - <<'PY'
          import json, re
          d = json.load(open("health.json"))
          want = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          assert d["ok"] is True and d["service"] == "lantern-cloud" and d["engine"] == want, d
          PY
      - name: the website is served, built from the app's own stylesheet, with a nonce policy
        run: |
          curl -fsS -D site.h http://127.0.0.1:8090/ -o site.html
          grep -qi "content-security-policy: .*nonce-" site.h
          grep -q 'class="dropzone"' site.html
          grep -q -- '--accent:#0F7B74' site.html
          curl -fsS http://127.0.0.1:8090/manifest.webmanifest | grep -q '"start_url": "/"'

  windows:
    # Stock Windows settings: the system code page, not UTF-8, and backslash paths.
    runs-on: windows-latest
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan,dev]"
      - run: python -m pytest -q -rs
      - name: Lantern audits itself (no critical, high, or medium findings)
        # isolated (tools/netguard): only the three addresses the dependency audit asks can be reached
        shell: bash
        run: python tools/netguard/lantern_netguard.py --allow pypi.org,registry.npmjs.org,api.osv.dev -- lantern analyze . --out "$RUNNER_TEMP/self" --fail-on medium
      - name: Next.js sample finds the unprotected route
        shell: python
        run: |
          import json, os, subprocess, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "nx")
          isolated = [sys.executable, "tools/netguard/lantern_netguard.py", "--allow", "pypi.org,registry.npmjs.org,api.osv.dev", "--"]
          subprocess.run([*isolated, "lantern", "analyze", "tests/fixtures/nextapp", "--out", out], check=True)
          rules = {f["rule"] for f in json.load(open(os.path.join(out, "security.json"), encoding="utf-8"))["findings"]}
          assert "LW-AUTH-MISSING" in rules, rules

  browser:
    # The viewer in a real browser: no JS errors, and hostile text can't break or hijack the page.
    # Pinned to Ubuntu 24.04: `ubuntu-latest` moved to 26.04 on 2026-11-05 and Playwright 1.48's browser packages
    # (libicu74, libvpx9, libx264-164) are not in it yet; the same image also runs Tesseract several times slower.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
      - run: pip install -e ".[scan,dev]"
      - name: Playwright with all three engines (Chromium, Firefox, WebKit = Safari) and axe-core, the accessibility checker
        run: npm i --no-save playwright@1.48.2 axe-core@4.10.2 && npx playwright install --with-deps chromium firefox webkit
      - name: Tesseract, so the live-app smoke can check a screenshot's text is read
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: LANTERN_BROWSERS="firefox webkit" bash tools/audit.sh --browser

  install:
    # What a tester does: one pip command into a clean venv (no extras), then the first three commands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4   # only for tests/fixtures/shop; Lantern itself comes from pip below
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Clean-venv install from GitHub, then version, analyze, serve --check
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -f "$RUNNER_TEMP/v/Scripts/activate" ]; then . "$RUNNER_TEMP/v/Scripts/activate"; else . "$RUNNER_TEMP/v/bin/activate"; fi
          pip install "git+https://github.com/LittleHenderson/Lantern@${SHA}"
          export LANTERN_HOME="$RUNNER_TEMP/lantern-home"
          {
            echo '### Clean install on ${{ matrix.os }}'
            echo '```'
            echo "$ lantern --version"; lantern --version
            echo "$ lantern analyze tests/fixtures/shop --out $RUNNER_TEMP/shop --offline"
            lantern analyze tests/fixtures/shop --out "$RUNNER_TEMP/shop" --offline 2>&1
            echo "$ lantern serve tests/fixtures/shop --check"
            lantern serve tests/fixtures/shop --check 2>&1 | sed 's/token=[A-Za-z0-9_-]*/token=<one-time>/'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(lantern --version)" = "lantern $(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          test -f "$RUNNER_TEMP/shop/report.html"
          lantern serve tests/fixtures/shop --check > /dev/null
