# Big public apps, once a week: does Lantern still finish each one inside the time and memory budget, without crashing?
# (test checklist 3.3 "a large app"). Not on every push: it clones ten repositories and takes about ten minutes.
# Run it by hand from the Actions tab (workflow_dispatch) after a change to a language reader or the graph.
name: large-apps

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "one app by name (see tools/large_apps.py APPS), or empty for all"
        required: false
        default: ""
      budget_s:
        description: "seconds each analysis may take"
        required: false
        default: "900"

permissions:
  contents: read

jobs:
  large-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan]"
      - name: analyze each app within the budget
        run: |
          ONLY="${{ github.event.inputs.only }}"
          BUDGET="${{ github.event.inputs.budget_s }}"
          python tools/large_apps.py /tmp/large ${ONLY:+--only "$ONLY"} --budget-s "${BUDGET:-900}" --max-mb 4096 \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: always()
        with:
          node-version: "20"
      - name: the biggest report opens on a slowed phone (tools/report_perf.js)
        if: always()
        run: |
          set -o pipefail   # the checks below are piped into tee: without this the step would pass whatever they said
          npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
          BIG=$(ls -S /tmp/large/*.out/report.html 2>/dev/null | head -1 || true)
          if [ -n "$BIG" ]; then node tools/report_perf.js "$BIG" --budget-ms=8000 | tee perf.json; else echo "no report to open"; fi
          { echo "## Report on a phone"; echo; echo '```'; cat perf.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: many readers on the website at once (tools/load_test.py)
        if: always()
        run: |
          set -o pipefail   # the load test is piped into tee: without this the step would pass whatever it said
          pip install -e ".[scan,dev]"
          python tools/cloud_site_demo.py --port 8872 --token-file /tmp/tok > /tmp/demo.log 2>&1 &
          for _ in $(seq 150); do grep -q '"ready"' /tmp/demo.log && break; sleep 0.2; done
          python tools/load_test.py http://127.0.0.1:8872 /tmp/tok --readers 50 --seconds 20 --p95-ms 1500 | tee load.json
          { echo "## Load test"; echo; echo '```'; cat load.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: large-apps-results
          path: |
            /tmp/large/large-apps.json
            perf.json
            load.json
          if-no-files-found: ignore
