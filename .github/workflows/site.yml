# Publishes site/ (the landing page, the intro and the live example report) to GitHub Pages
# on every push to main that touches it. The first run turns Pages on by itself.
name: site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", "lantern/viewer/report.html", "examples/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build the live example (the shop demo report)
        run: |
          pip install -e ".[scan]" pytest
          python examples/make_demo.py /tmp/demo
          mkdir -p site/demo && cp /tmp/demo/report.html site/demo/report.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: true   # turns GitHub Pages on for the repo the first time; no Settings click needed
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
