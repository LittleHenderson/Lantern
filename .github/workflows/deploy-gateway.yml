# Deploy the gateway to Fly.io from GitHub's servers, so no local tooling or network is needed.
# Run it from the Actions tab ("Run workflow"). Needs one repository secret: FLY_API_TOKEN, a deploy token
# made on the Fly website (app lantern-gateway → Tokens → Create deploy token). The token never leaves GitHub.
name: Deploy gateway

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to deploy the gateway on main to Fly.io
        required: true
        default: ""

concurrency: deploy-gateway

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: gateway
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check
        run: |
          curl -fsS https://lantern-gateway.fly.dev/v1/health
          echo
          curl -fsS https://lantern-gateway.fly.dev/v1/auth/providers
