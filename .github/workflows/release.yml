# A pushed tag v* (v0.9.0, v0.9.0-rc1) builds the sdist and wheel, runs the test suite against the built wheel
# in a clean environment, checks the hosted gateway is up, and publishes a GitHub Release with both files.
# The Release body is the matching CHANGELOG.md section (tools/changelog_section.py).
#
# A rehearsal: "Run workflow" on the Actions tab (or `gh workflow run release.yml --ref main`) does everything a tag
# does on that branch except the last job. Nothing is published and no tag is needed. Run it before the tag is
# pushed: twice (0.10.0, and a trial of 0.11.0) the tests against the built wheel failed where every other check
# was green, and a tag that ends in a failed release has to be moved by hand.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version (a rehearsal has no tag and takes the version the package says)
        run: |
          ver="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Rehearsal of v$ver on $GITHUB_REF_NAME: nothing will be published."
            echo "RELEASE_NAME=v$ver" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in "$ver"|"$ver"-*|"$ver"rc*) ;; *) echo "tag $GITHUB_REF_NAME does not match version $ver"; exit 1;; esac
          echo "RELEASE_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: The CHANGELOG has a section for this tag, short enough for the release page
        run: python tools/changelog_section.py "$RELEASE_NAME" > release-notes.md && cat release-notes.md
      - run: pip install build && python -m build
      - name: Software bill of materials (every library in requirements-lock.txt, CycloneDX JSON, shipped with the Release)
        run: pip install cyclonedx-bom && cyclonedx-py requirements requirements-lock.txt -o dist/lantern-sbom.cdx.json && python -c "import json; d=json.load(open('dist/lantern-sbom.cdx.json')); print(len(d['components']), 'components')"
      - run: ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false   # the run's own GitHub sign-in is not left in the checkout, where tests could read it
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: built
      - name: Tests against the built wheel in a clean venv (the source package is moved away first)
        env:
          LANTERN_TESTS_COMPLETE: required   # a test skipped for a missing library fails the release (tests/conftest.py)
        run: |
          mv lantern "$RUNNER_TEMP/lantern-source-not-used"
          python -m venv "$RUNNER_TEMP/v"
          . "$RUNNER_TEMP/v/bin/activate"
          whl="$(ls built/dist/*.whl)"
          pip install "${whl}[scan,dev]"
          python -c "import lantern, sys; print(lantern.__version__, lantern.__file__); sys.exit('site-packages' not in lantern.__file__)"
          python -m pytest -q -rs

  gateway-up:
    # The free allowance must answer before a build that points testers at it goes out.
    runs-on: ubuntu-latest
    steps:
      - name: curl the live gateway's health check
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 https://lantern-gateway.fly.dev/v1/health | tee health.json
          python3 -c "import json; d=json.load(open('health.json')); assert d.get('ok') is True and d.get('configured') is True, d"
          { echo '### Live gateway'; echo '```'; cat health.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, test-wheel, gateway-up]
    if: github.event_name == 'push'      # a pushed tag only: a rehearsal (workflow_dispatch) ends before this job
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: built
      - name: GitHub Release with the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*|*rc*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" built/dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Lantern $GITHUB_REF_NAME" --notes-file built/release-notes.md $pre
