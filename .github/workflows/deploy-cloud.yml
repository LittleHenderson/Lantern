# Deploy lantern-cloud or the gateway from GitHub instead of one laptop (test checklist, "one-person risk").
# Run it from the Actions tab: pick the app and, if you like, a git ref. It needs one repository secret, FLY_API_TOKEN:
# make it with `fly tokens create deploy -a lantern-cloud` (a token that can deploy only that app) and paste it under
# Settings → Secrets and variables → Actions. The gateway lives in another Fly organisation, so it has its own secret,
# FLY_GATEWAY_TOKEN (`fly tokens create deploy -a lantern-gateway`). Without the secret the job stops at the first step with a sentence.
name: deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "which app"
        required: true
        default: "lantern-cloud"
        type: choice
        options: ["lantern-cloud", "lantern-gateway"]
      ref:
        description: "git ref to deploy (default: the branch this workflow runs from)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: the Fly token is set
        env:
          FLY_API_TOKEN: ${{ github.event.inputs.app == 'lantern-gateway' && secrets.FLY_GATEWAY_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::No Fly token secret for ${{ github.event.inputs.app }} (FLY_API_TOKEN for lantern-cloud, FLY_GATEWAY_TOKEN for lantern-gateway). Make one with 'fly tokens create deploy -a ${{ github.event.inputs.app }}' and add it under Settings → Secrets and variables → Actions."; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # v1.5
      - name: the volume is big enough
        if: github.event.inputs.app == 'lantern-cloud'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Runs keep their download and files on the data volume (cloud/fly.toml): extend an older 1 GB one to 3 GB.
          # A volume can grow but never shrink. A token that may not change volumes gets a warning, not a failed deploy.
          flyctl volumes list -a lantern-cloud --json > vols.json || { echo "::warning::could not list the volumes"; exit 0; }
          for v in $(python3 -c "import json;[print(x['id']) for x in json.load(open('vols.json')) if x.get('name')=='lantern_cloud_data' and int(x.get('size_gb') or 0) < 3]"); do
            flyctl volumes extend "$v" -s 3 -a lantern-cloud --yes || echo "::warning::could not extend volume $v to 3 GB; run 'fly volumes extend $v -s 3 -a lantern-cloud'"
          done
      - name: deploy
        env:
          FLY_API_TOKEN: ${{ github.event.inputs.app == 'lantern-gateway' && secrets.FLY_GATEWAY_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.app }}" = "lantern-cloud" ]; then
            flyctl deploy . --config cloud/fly.toml --dockerfile cloud/Dockerfile --remote-only -a lantern-cloud \
              --build-arg LANTERN_COMMIT="$(git rev-parse HEAD)"
          else
            # The same command as the laptop (docs/deploy.md): run from the gateway folder, so fly.toml and Dockerfile
            # are read from there. Given a folder argument, flyctl reads --config relative to that folder, not the repo.
            cd gateway && flyctl deploy --remote-only -a lantern-gateway
          fi
      - name: the new version answers
        run: |
          sleep 20
          if [ "${{ github.event.inputs.app }}" = "lantern-cloud" ]; then
            python tools/uptime.py --cloud https://lantern-cloud.fly.dev --expect-engine "$(python -c 'import re;print(re.search(r"\"([^\"]+)\"", open("lantern/__init__.py").read()).group(1))')" --summary "$GITHUB_STEP_SUMMARY"
          else
            python tools/uptime.py --gateway https://lantern-gateway.fly.dev --summary "$GITHUB_STEP_SUMMARY"
          fi
