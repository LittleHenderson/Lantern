# Re-measure the model behind the free allowance (test checklist 8.4 and "Model changes"). Run it from the Actions tab
# when the default model changes or a provider announces an update: it analyses the shop and nextapp samples, runs
# `lantern explain` through the gateway with the LANTERN_TOKEN secret (a normal sign-in token from `lantern login`,
# made for this purpose; it spends that account's allowance) and scores the Ask Lantern eval. The step summary shows the
# explain-runs row to paste into docs/explain-runs.md and the Ask Lantern score. Fails when the first-try rate is under
# 80% or the Ask Lantern score under 90%, so a quiet model regression is a red run, not a tester's surprise.
name: model-eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "provider/model (default: the free allowance's default model)"
        required: false
        default: ""
      min_first_try:
        description: "fail when fewer than this share of explanations pass first try"
        required: false
        default: "0.8"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: the allowance token is set
        env:
          LANTERN_TOKEN: ${{ secrets.LANTERN_TOKEN }}
        run: |
          if [ -z "$LANTERN_TOKEN" ]; then
            echo "::error::No LANTERN_TOKEN secret. Run 'lantern login --github' on a computer, copy the token from ~/.config/lantern/token (Windows: C:\Users\<you>\.config\lantern\token) and add it under Settings → Secrets and variables → Actions."; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[scan,dev]"
      - name: analyse the samples
        run: |
          lantern analyze tests/fixtures/shop --offline --out tests/fixtures/shop/.lantern
          lantern analyze tests/fixtures/nextapp --offline --out tests/fixtures/nextapp/.lantern
      - name: explanation eval (shop, nextapp)
        env:
          LANTERN_TOKEN: ${{ secrets.LANTERN_TOKEN }}
          LANTERN_ACCEPT_DATA_SHARING: "1"   # the samples are Lantern's own files; consent is given here, not at a prompt
        run: |
          M="${{ github.event.inputs.model }}"
          ARGS=""; [ -n "$M" ] && ARGS="--model $M"
          echo "## Explanation eval" >> "$GITHUB_STEP_SUMMARY"
          echo "| Date | Model (via) | Validated | First try | Repaired | Undetermined | Invented dropped | Tokens in / out | What changed before this run |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|---:|---:|---:|---:|---:|---|" >> "$GITHUB_STEP_SUMMARY"
          python bench/explain_eval.py tests/fixtures/shop $ARGS --limit 25 --min-first-try "${{ github.event.inputs.min_first_try }}" --note "model-eval run ${{ github.run_number }}" --record "$GITHUB_STEP_SUMMARY" --out /tmp/shop_eval.json
          python bench/explain_eval.py tests/fixtures/nextapp $ARGS --limit 12 --min-first-try "${{ github.event.inputs.min_first_try }}" --note "model-eval run ${{ github.run_number }}" --record "$GITHUB_STEP_SUMMARY" --out /tmp/nextapp_eval.json
      - name: Ask Lantern eval (shop)
        if: always()
        env:
          LANTERN_TOKEN: ${{ secrets.LANTERN_TOKEN }}
          LANTERN_ACCEPT_DATA_SHARING: "1"   # the samples are Lantern's own files; consent is given here, not at a prompt
        run: |
          M="${{ github.event.inputs.model }}"
          ARGS=""; [ -n "$M" ] && ARGS="--model $M"
          echo "## Ask Lantern eval" >> "$GITHUB_STEP_SUMMARY"
          python bench/ask_eval.py tests/fixtures/shop $ARGS --out /tmp/ask_eval.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: model-eval
          path: /tmp/*_eval.json
          if-no-files-found: ignore
