<title>Lantern report</title>
<style>
/* Lantern design tokens (shared with app.html and evidence.py). Ink for text and primary actions, one blue accent
   for selection and links, status colors only for risk and results (always with a label or icon), and three lens
   colors for the three explanations. */
:root{
  color-scheme: light;
  --bg:#F5F5F2; --surface:#FFFFFF; --surface-2:#FAFAF8; --sunken:#EEEEEA; --hover:rgba(22,22,24,.045);
  --flame:#FFB547;
  --ink:#161618; --ink-2:#46464C; --muted:#62626A; --faint:#A3A3A8;
  --line:rgba(22,22,24,.09); --line-2:rgba(22,22,24,.16);
  --accent:#0F7B74; --accent-ink:#0B5F5A; --accent-soft:rgba(15,123,116,.10); --accent-line:rgba(15,123,116,.45);
  --primary:#161618; --on-primary:#FFFFFF;
  --good:#0CA30C; --warning:#FAB219; --serious:#EC835A; --critical:#D03B3B;
  --good-soft:rgba(12,163,12,.11); --warning-soft:rgba(250,178,25,.17); --serious-soft:rgba(236,131,90,.16); --critical-soft:rgba(208,59,59,.11);
  --good-ink:#0A7A0A; --warn-ink:#8A5A00; --serious-ink:#B5522E; --crit-ink:#B02A2A;
  --l1:#2F5BEA; --l1-ink:#2446C8; --l1s:rgba(47,91,234,.08); --l2:#B8650A; --l2-ink:#8A4B06; --l2s:rgba(232,140,30,.10); --l3:#0B8466; --l3-ink:#07705A; --l3s:rgba(11,132,102,.09); --l4:#7A4FD6; --l4-ink:#6E43CC; --l4s:rgba(122,79,214,.08);
  --fe:#2F5BEA; --be:#0B8466;
  --code-bg:#151517; --code-ink:#E7E7E4; --code-dim:#8A8A91; --code-hl:rgba(255,181,71,.20); --code-flag:rgba(208,59,59,.32);
  --shadow-1:0 1px 2px rgba(16,16,20,.05);
  --shadow-2:0 1px 2px rgba(16,16,20,.04), 0 6px 20px -6px rgba(16,16,20,.10);
  --shadow-3:0 1px 3px rgba(16,16,20,.06), 0 24px 56px -16px rgba(16,16,20,.30);
  --ease:cubic-bezier(.2,.8,.2,1); --t:160ms;
  --font:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif:"Lora", Georgia, "Times New Roman", serif;   /* the app loads Lora; the report never fetches fonts */
  --mono:ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
:root[data-theme=dark]{
  color-scheme: dark;
  --bg:#0E0E10; --surface:#161618; --surface-2:#1B1B1E; --sunken:#0A0A0B; --hover:rgba(255,255,255,.05);
  --ink:#F3F3F1; --ink-2:#BEBEC3; --muted:#9A9AA0; --faint:#5E5E64;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --accent:#4FC3BA; --accent-ink:#7FDBD3; --accent-soft:rgba(79,195,186,.14); --accent-line:rgba(79,195,186,.55);
  --primary:#F3F3F1; --on-primary:#0E0E10;
  --good-soft:rgba(12,163,12,.20); --warning-soft:rgba(250,178,25,.18); --serious-soft:rgba(236,131,90,.20); --critical-soft:rgba(208,59,59,.22);
  --good-ink:#5BD15B; --warn-ink:#FAC55A; --serious-ink:#F0A080; --crit-ink:#FF8A8A;
  --l1:#8EA8FF; --l1-ink:#8EA8FF; --l1s:rgba(124,155,255,.12); --l2:#F2A65A; --l2-ink:#F2A65A; --l2s:rgba(242,166,90,.12); --l3:#4FD1A5; --l3-ink:#4FD1A5; --l3s:rgba(79,209,165,.11); --l4:#B79CFF; --l4-ink:#B79CFF; --l4s:rgba(183,156,255,.12);
  --fe:#8EA8FF; --be:#4FD1A5;
  --code-bg:#0A0A0B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-3:0 1px 3px rgba(0,0,0,.4), 0 24px 56px -16px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    color-scheme: dark;
    --bg:#0E0E10; --surface:#161618; --surface-2:#1B1B1E; --sunken:#0A0A0B; --hover:rgba(255,255,255,.05);
    --ink:#F3F3F1; --ink-2:#BEBEC3; --muted:#9A9AA0; --faint:#5E5E64;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
    --accent:#4FC3BA; --accent-ink:#7FDBD3; --accent-soft:rgba(79,195,186,.14); --accent-line:rgba(79,195,186,.55);
    --primary:#F3F3F1; --on-primary:#0E0E10;
    --good-soft:rgba(12,163,12,.20); --warning-soft:rgba(250,178,25,.18); --serious-soft:rgba(236,131,90,.20); --critical-soft:rgba(208,59,59,.22);
    --good-ink:#5BD15B; --warn-ink:#FAC55A; --serious-ink:#F0A080; --crit-ink:#FF8A8A;
    --l1:#8EA8FF; --l1-ink:#8EA8FF; --l1s:rgba(124,155,255,.12); --l2:#F2A65A; --l2-ink:#F2A65A; --l2s:rgba(242,166,90,.12); --l3:#4FD1A5; --l3-ink:#4FD1A5; --l3s:rgba(79,209,165,.11); --l4:#B79CFF; --l4-ink:#B79CFF; --l4s:rgba(183,156,255,.12);
    --fe:#8EA8FF; --be:#4FD1A5;
    --code-bg:#0A0A0B;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-3:0 1px 3px rgba(0,0,0,.4), 0 24px 56px -16px rgba(0,0,0,.7);
  }
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

*{box-sizing:border-box}
html{margin:0;background:var(--bg)} html.framed{background:transparent}   /* in a frame the host page's backdrop shows through */
body{margin:0;background:transparent;color:var(--ink-2);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{height:100vh;height:100dvh;display:flex;flex-direction:column}
/* Backdrop (design directive): three full-size SVG layers of thin outlines drifting slowly behind everything. Each
   layer is animated as a whole <svg> (compositor only, never its paths). Not mounted inside a frame: the host app's own
   backdrop shows through. Quiet (no graph clusters, dimmer) behind the map, findings and fix screens. */
@keyframes drift1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-26px) rotate(6deg)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
@keyframes drift3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,22px) rotate(-8deg)}}
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.55}
.backdrop[data-quiet]{opacity:.4}
.backdrop[data-level=bold]{opacity:1} .backdrop[data-level=bold][data-quiet]{opacity:.7}
.backdrop[data-level=off]{display:none}
.backdrop[data-quiet] .graphs{display:none}
.backdrop svg{position:absolute;inset:0;width:100%;height:100%;will-change:transform}
.backdrop svg.a{animation:drift1 22s cubic-bezier(.45,0,.55,1) 0s infinite}
.backdrop svg.b{animation:drift2 26s cubic-bezier(.45,0,.55,1) 3s infinite}
.backdrop svg.c{animation:drift3 30s cubic-bezier(.45,0,.55,1) 6s infinite}
@media (prefers-reduced-motion:reduce){.backdrop svg{animation:none}}
@media print{.backdrop{display:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code{font:12px var(--mono);background:var(--sunken);color:var(--ink);padding:1px 6px;border-radius:6px}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* ---------- header ---------- */
header{flex:none;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand .mark{width:26px;height:26px;flex:none}
.brand .home{display:flex;align-items:center;gap:10px;flex:none;margin-left:-6px;padding:5px 6px;border-radius:10px;cursor:pointer}
.brand .home:hover{background:var(--hover)}
.brand b{font:650 15px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.brand .repo{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn .ic{width:17px;height:17px}
body.embed>header{display:none} body.embed .brand{display:none} body.embed nav.tabs{display:none} body.embed .seg.mode{display:none} body.embed .xnote{display:none}
.bar2{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:48px}
@media (max-width:1100px){.bar2 .chips .chip{display:none}}
@media (max-width:720px){nav.tabs{overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}nav.tabs::-webkit-scrollbar{display:none}.bar2 .chips{display:none}}
nav.tabs{display:flex;gap:2px;flex:none}
nav.tabs button{position:relative;display:flex;align-items:center;gap:6px;height:48px;padding:0 11px;font-weight:550;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:color var(--t) var(--ease)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
nav.tabs .n{font:600 11px/1 var(--font);padding:3px 6px;border-radius:99px;background:var(--hover);color:var(--ink-2)}
nav.tabs .n.crit{background:var(--critical-soft);color:var(--ink)}
.chips{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-left:auto;justify-content:flex-end;padding:8px 0;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550;color:var(--ink-2);padding:2px 9px 2px 7px;border-radius:99px;background:var(--hover);white-space:nowrap}
.sev i{width:7px;height:7px;border-radius:99px;background:var(--faint);flex:none}
.sev.critical{background:var(--critical-soft)} .sev.critical i{background:var(--critical)}
.sev.high{background:var(--serious-soft)} .sev.high i{background:var(--serious)}
.sev.medium{background:var(--warning-soft)} .sev.medium i{background:var(--warning)}
.sev.low,.sev.good{background:var(--good-soft)} .sev.low i,.sev.good i{background:var(--good)}
.sev.serious{background:var(--serious-soft)} .sev.serious i{background:var(--serious)}
.sev.warning{background:var(--warning-soft)} .sev.warning i{background:var(--warning)}

/* ---------- layout ---------- */
main{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 440px}
main.noleft{grid-template-columns:minmax(0,1fr) 440px} main.noleft aside.left{display:none}
aside.left{border-right:1px solid var(--line);background:color-mix(in srgb, var(--surface) 62%, transparent);overflow:auto;padding:14px 10px 24px}
section.center{padding:20px 24px 40px;overflow:auto;min-width:0}
/* design 6b/11b: Flowchart and Graph sit straight on a dotted page; the drifting backdrop shows between the dots.
   The dots scroll with the content (local), so the map and its grid move together. */
section.center.dotted{background-image:radial-gradient(color-mix(in srgb, var(--faint) 60%, transparent) 1.1px, transparent 1.4px);background-size:20px 20px;background-attachment:local}
aside.right{border-left:1px solid var(--line);background:var(--surface);overflow:auto;position:relative}
aside.left{position:relative}
/* Retracting side panels (design 3c): a 30px rail with a vertical label and the same toggle. */
main.lrail{grid-template-columns:30px minmax(0,1fr) 440px} main.rrail{grid-template-columns:280px minmax(0,1fr) 30px} main.lrail.rrail{grid-template-columns:30px minmax(0,1fr) 30px}
main.noleft.rrail{grid-template-columns:minmax(0,1fr) 30px}
main.noright{grid-template-columns:280px minmax(0,1fr)} main.noleft.noright{grid-template-columns:minmax(0,1fr)} main.noright aside.right{display:none}
aside .edge{position:absolute;top:50%;width:18px;height:40px;margin-top:-20px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:7px;display:grid;place-items:center;padding:0;z-index:3;opacity:.7;transition:opacity var(--t) var(--ease), color var(--t) var(--ease)}
aside .edge:hover{opacity:1;color:var(--ink)} aside .edge .ic{width:14px;height:14px}
aside.left .edge{right:-9px} aside.right .edge{left:-9px}
aside.rail{padding:0;overflow:hidden} aside.rail>*:not(.edge):not(.raillabel){display:none}
aside:not(.rail) .raillabel{display:none}
aside.rail .raillabel{position:absolute;left:0;right:0;top:62px;text-align:left;writing-mode:vertical-rl;white-space:nowrap;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:30px}
aside.left.rail .edge{right:auto;left:50%;margin-left:-9px;top:12px;margin-top:0} aside.right.rail .edge{left:50%;margin-left:-9px;top:12px;margin-top:0}
aside.rail .edge .ic{transform:rotate(180deg)}
@media (max-width:760px){aside.left:not(.rail) .edge{right:0}}   /* full width on a phone: 9px past the screen made the page scroll sideways */
.ep .d b{font-weight:600} .ep .d b.critical{color:var(--crit-ink)} .ep .d b.high{color:var(--warn-ink)}
/* Stack strip (design 11): four fixed stops, Browser → Frontend → Server → Data, the same words everywhere */
.strip{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px;color:var(--muted);max-width:100%;margin:0 0 12px}
.strip .yah{font:600 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
.strip .stop{position:relative;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:help;color:var(--muted)}   /* unlit lanes read lighter than lit ones, but stay readable (AA) */
.strip .stop i{width:9px;height:9px;border-radius:99px;border:1.5px solid var(--line-2);background:transparent;flex:none}
.strip .stop.lit{color:var(--ink-2)} .strip .stop.lit i{background:var(--ink-2);border-color:var(--ink-2)}
.strip .stop.here{color:var(--ink);font-weight:600} .strip .stop.here i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.strip .stop.bad i{background:var(--critical);border-color:var(--critical)}
.strip .ln2{width:52px;height:1px;background:var(--line-2);flex:none} .strip .ln2.lit{background:var(--muted)}
.strip .stop[data-def]:hover::after,.strip .stop[data-def]:focus::after{content:attr(data-def);display:block;position:absolute;left:0;top:calc(100% + 8px);z-index:5;width:220px;white-space:normal;font:400 12px var(--font);line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.strip.legend2{border:0;background:none;padding:0 0 0 0;margin:0 0 14px} .strip.legend2 .yah{margin-right:8px}
/* the key on the findings page: words only (hollow dots read as switched off), each hoverable for its meaning */
.strip.legend2 .stop{color:var(--ink-2);cursor:help;border-bottom:1px dotted var(--line-2);padding-bottom:1px} .strip.legend2 .stop i{display:none} .strip.legend2 .ln2{display:none}
.lanesay{font-size:14px;color:var(--ink-2);margin:0 0 18px;line-height:1.5} .lanesay b{color:var(--ink)}
.lanewalk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}
.lanewalk .lw{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:13px;color:var(--ink-2);line-height:1.45;min-width:0}
.lanewalk .lw .k{display:flex;align-items:center;gap:6px;font:600 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px} .lanewalk .lw .k i{width:7px;height:7px;border-radius:99px;background:var(--faint)}
.lanewalk .lw.lit .k i{background:var(--muted)} .lanewalk .lw.here{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)} .lanewalk .lw.here .k{color:var(--accent-ink)} .lanewalk .lw.here .k i{background:var(--accent)}
.lanewalk .lw.bad .k i{background:var(--critical)} .lanewalk .lw.off{border-style:dashed;background:transparent} .lanewalk .lw.off .k{color:var(--muted)} .lanewalk .lw code{font:500 12px var(--mono)}
.glyph{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;flex:none} .glyph i{width:7px;height:7px;border-radius:99px;border:1.2px solid var(--line-2);background:transparent}
.glyph i.lit{background:var(--ink-2);border-color:var(--ink-2)} .glyph i.hot{background:var(--accent);border-color:var(--accent)}
.glyph i.hot.critical{background:var(--critical);border-color:var(--critical)} .glyph i.hot.high{background:var(--serious);border-color:var(--serious)} .glyph i.hot.medium{background:var(--warning);border-color:var(--warning)} .glyph i.hot.low{background:var(--good);border-color:var(--good)}
.onlane{font-size:12.5px;color:var(--muted);white-space:nowrap} .onlane b{color:var(--ink);font-weight:600}
.ep .glyph{margin-right:7px} .ftable .glyph{margin-right:6px}
.lanehead{display:flex;flex-direction:column;gap:2px;margin:0 0 10px} .lanehead .eyebrow{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#chart.lanes{background:transparent;border:0;border-radius:0;border-top:1px solid var(--line)}   /* design 11b: lanes sit on the page, the backdrop shows through */ #chart.lanes svg .lanename{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink)} #chart.lanes svg .lanedef{font:400 11.5px var(--font);fill:var(--muted)}
#chart.lanes svg .sub{font:400 11px var(--font);fill:var(--muted)}
.strip .mini{display:none;align-items:center;gap:8px}
@media (max-width:720px){.lanewalk{grid-template-columns:1fr 1fr}.strip:not(.legend2) .stop,.strip:not(.legend2) .ln2,.strip:not(.legend2) .yah{display:none}.strip:not(.legend2) .mini{display:inline-flex}.strip.legend2{gap:7px}.strip.legend2 .ln2{width:18px}.strip.legend2 .yah{display:none}}
/* Graph view: the whole app in five columns, risk as heat */
/* Graph and Flowchart take every pixel of the panel under the toolbar: an endless canvas with a camera (wireCanvas), no frame and no scrollbars */
section.center.gfull{display:flex;flex-direction:column;overflow:hidden;overflow-y:auto;padding-bottom:0;background-image:none}
section.center.gfull>.toolbar{flex:none;margin-bottom:0;padding-bottom:12px;position:relative;z-index:1}
.canvas{position:relative;overflow:hidden;flex:1 1 auto;min-height:min(420px, 70vh);margin:0 -24px}
section.center.gfull>.note,section.center.gfull>.legend{flex:none} section.center.gfull>.note{padding:6px 0 10px}
.canvas .vp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;overscroll-behavior:contain;outline-offset:-2px;background-image:radial-gradient(color-mix(in srgb, var(--faint) 60%, transparent) 1.1px, transparent 1.4px)}
.canvas .vp.drag{cursor:grabbing}
.canvas .vp>svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.canvas .zlevel{min-width:52px;align-self:center;text-align:center;font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.canvas .zoom button[data-z="max"]{display:grid;place-items:center}
/* full screen: only the map and its toolbar, whether or not the browser allowed real full screen */
body.gmax header,body.gmax aside.left,body.gmax aside.right{display:none!important}
body.gmax main{display:grid;grid-template-columns:minmax(0,1fr)!important}
/* the zoom buttons stay clear of the Ask Lantern button when the map reaches the window's right edge */
/* also inside the website's frame, whose own Ask Lantern button sits over the frame's bottom-right corner */
body.gmax .canvas .zoom,main.rrail .canvas .zoom,main.noright .canvas .zoom{bottom:80px}
#graph svg text{font-family:var(--mono);font-size:11.5px;fill:var(--ink)} #graph svg text.col{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}
#graph svg text.sub{font-family:var(--font);font-size:10.5px;fill:var(--muted)} #graph svg text.lb{font-size:9px;fill:var(--muted)}
#graph g[data-id]{cursor:pointer} #graph g[data-id]:hover rect.box{stroke:var(--accent-line)}

#ask .hd .t{font:600 13.5px var(--font);color:var(--ink);line-height:1.2}#ask .hd .s{font:11px var(--font);color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ask .hd input[type=range]{width:64px;accent-color:var(--accent);margin:0}
#ask .x{width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font:400 16px/1 var(--font)}#ask .x:hover{background:var(--hover);color:var(--ink)}
#ask .log{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:10px}
#ask .ctx{align-self:center;font:11px var(--font);color:var(--faint);white-space:nowrap}#ask .ctx b{color:var(--muted);font-weight:600}
#ask .me{align-self:flex-end;max-width:85%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--primary);color:var(--on-primary);font:13px/1.45 var(--font);white-space:pre-wrap}
#ask .bot{align-self:flex-start;max-width:92%;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--surface-2);border:1px solid var(--line);font:13px/1.5 var(--font);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
#ask .bot code{font:11.5px var(--mono);background:var(--sunken);padding:0 4px;border-radius:4px;color:var(--ink)}
#ask .bot .cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#ask .bot .cites button{font:600 10.5px var(--mono);padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);border:0;cursor:pointer}
#ask .bot.wait{color:var(--muted)}
#ask .ft{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#ask .chips{display:flex;gap:6px;flex-wrap:wrap}#ask .chips button{font:500 11.5px var(--font);padding:4px 9px;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);white-space:nowrap;cursor:pointer}#ask .chips button:hover{background:var(--hover)}
#ask .shot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft)}#ask .shot .nm{font:600 12.5px var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ask .shot .sm{font:11px var(--font);color:var(--muted)}#ask .shot button{font:600 11.5px var(--font);color:var(--ink-2);padding:4px 8px;border-radius:7px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
#ask .comp{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
#ask .comp .att{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}#ask .comp .att:hover{background:var(--hover);color:var(--ink)}
#ask .comp textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:13px/1.4 var(--font);color:var(--ink);min-height:20px;max-height:90px;padding:4px 2px}
#ask .comp .send{width:30px;height:30px;border-radius:9px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;cursor:pointer}
#ask .asknote{font:10.5px var(--font);color:var(--faint);text-align:center}
#ask .peek{padding:8px 12px;border-radius:12px 12px 4px 12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);font:12.5px/1.4 var(--font);color:var(--ink);max-width:230px}
#ask .pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:99px;border:0;background:var(--primary);color:var(--on-primary);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18),0 10px 28px -8px rgba(255,170,60,.55);transition:padding .15s,transform .15s;font:600 13.5px var(--font)}
#ask .pill:hover{transform:translateY(-1px)}#ask .pill .lbl{display:none}#ask .pill:hover .lbl{display:inline}#ask .pill:hover{padding:0 14px 0 12px}
#ask .pill .mark{width:24px;height:24px;border-radius:8px;box-shadow:none}
@media (max-width:760px){#ask .win{width:calc(100vw - 32px);height:min(580px,calc(100vh - 90px))}}
#ask .pill .mark{display:inline-block;width:24px;height:24px;border-radius:8px;background:#141416;position:relative;overflow:hidden}
#ask .pill .mark svg{position:absolute;inset:0;width:100%;height:100%}
body.embed #ask{display:none}
.detail .acts{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- left: entry points ---------- */
.searchbox{position:relative;margin:0 4px 6px}
.searchbox .ic{position:absolute;left:11px;top:11px;color:var(--faint)}
input.search{width:100%;height:36px;padding:0 10px 0 33px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease)}
input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
input.search::placeholder{color:var(--faint)}
.group{margin-top:18px}
.group h4{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 10px 6px}
.group h4 span{font-weight:500;letter-spacing:0;color:var(--muted)}
.ep{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--ink);transition:background var(--t) var(--ease)}
.ep:hover{background:var(--hover)}
.ep.on{background:var(--accent-soft)}
.ep .t{display:flex;align-items:center;gap:7px;min-width:0}
.ep .t span.x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.ep .d{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.m{flex:none;display:inline-block;min-width:38px;text-align:center;font:700 9.5px/1 var(--mono);letter-spacing:.03em;padding:4px 5px;border-radius:5px;background:var(--hover);color:var(--ink-2)}
.m.GET{background:var(--l1s);color:var(--l1-ink)} .m.POST{background:var(--l3s);color:var(--l3-ink)}
.m.PUT,.m.PATCH{background:var(--l2s);color:var(--l2-ink)} .m.DELETE{background:var(--critical-soft);color:var(--crit-ink)}
.m.pg{background:var(--hover);color:var(--ink-2);font-family:var(--font);text-transform:lowercase}

/* ---------- center: toolbar, legend ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.022em;color:var(--ink);flex:1 0 auto;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.toolbar h2 .m{font-size:11px;padding:5px 7px}
.toolbar h2 .c{font-weight:500;color:var(--muted);font-size:18px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--hover);gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color var(--t) var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1), 0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;transition:background var(--t) var(--ease), border-color var(--t) var(--ease)}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 14px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.ln{display:inline-block;width:22px;border-top:2px solid var(--ink-2)}
.ln.observed{border-top-width:3px;border-color:var(--accent)} .ln.inferred{border-top-style:dashed} .ln.possible{border-top-style:dotted}
.layer{display:inline-block;width:8px;height:8px;border-radius:3px;flex:none;background:var(--faint)}
.layer.frontend{background:var(--fe)} .layer.backend{background:var(--be)} .layer.external{background:var(--line-2)}

/* ---------- path tree ---------- */
.tree{font-size:13.5px}
.row{display:flex;align-items:flex-start;gap:4px;padding:2px 0}
.row .indent{flex:none;display:flex}
.row .indent i{display:inline-block;width:20px;border-left:1px solid var(--line-2);margin-left:9px;margin-right:-9px;height:34px}
.tog{flex:none;display:grid;place-items:center;width:22px;height:30px;color:var(--muted);border-radius:6px}
.tog:hover{color:var(--ink)}
.tog .ic{width:13px;height:13px;transition:transform var(--t) var(--ease)}
.tog.open .ic{transform:rotate(90deg)}
.conn{flex:none;width:16px;margin-top:15px}
.node{flex:1;min-width:0;text-align:left;padding:6px 10px;border-radius:10px;border:1px solid transparent;transition:background var(--t) var(--ease), border-color var(--t) var(--ease), box-shadow var(--t) var(--ease)}
.node:hover{background:var(--surface);border-color:var(--line)}
.node.on{background:var(--surface);border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.node .h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.node .nm{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.node .loc{font:11px var(--mono);color:var(--muted)}
.node .sum{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;padding:1px 7px 1px 6px;border-radius:99px;background:var(--hover);color:var(--ink-2);text-transform:lowercase}
.badge i{width:6px;height:6px;border-radius:99px;background:var(--faint)}
.badge.critical{background:var(--critical-soft)} .badge.critical i{background:var(--critical)}
.badge.high{background:var(--serious-soft)} .badge.high i{background:var(--serious)}
.badge.medium{background:var(--warning-soft)} .badge.medium i{background:var(--warning)}
.badge.low{background:var(--good-soft)} .badge.low i{background:var(--good)}
.badge.entry{background:var(--l1s);color:var(--l1);padding-left:7px}
.badge.ai{background:var(--l3s);color:var(--l3);padding-left:7px;margin-left:4px}
.badge.ai.payment,.badge.ai.email,.badge.ai.sms{background:var(--l2s);color:var(--l2)}
.ext{display:block;font:11px var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.hop{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--mono);color:var(--l2-ink);background:var(--l2s);border-radius:99px;padding:2px 9px;margin:0 2px;white-space:nowrap}
.hop.ui{color:var(--l1);background:var(--l1s);font-family:var(--font)}
.hoprow{padding:0;margin:-1px 0}
.again{font-size:11.5px;color:var(--muted);font-style:italic}
.empty{color:var(--muted);padding:48px 16px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--ink);font:600 16px var(--display);margin-bottom:4px}
.empty .art{width:52px;height:52px;display:block;margin:0 auto 12px}
#chart{width:100%;overflow:auto} #chart.canvas{width:auto;overflow:hidden} #chart:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#tabs button[hidden]{display:none}   /* design: no box; the flowchart sits on the dotted page like the graph */
#chart svg text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
#chart g[data-id]:hover rect.box{stroke:var(--accent-line)}

/* ---------- right: detail ---------- */
.detail{padding:20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.detail h3{margin:0;font:650 15px/1.4 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.detail .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted);margin:8px 0 12px}
.sig{font:12px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:9px 11px;border-radius:10px;overflow-wrap:anywhere;color:var(--ink)}
.lenses{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin:18px 0 10px;padding:3px;border-radius:11px;background:var(--hover)}
.lenses button{display:flex;align-items:center;justify-content:center;gap:7px;height:32px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color var(--t) var(--ease)}
.lenses button i{width:7px;height:7px;border-radius:99px}
.lenses button[data-l="1"] i{background:var(--l1)} .lenses button[data-l="2"] i{background:var(--l2)} .lenses button[data-l="3"] i{background:var(--l3)} .lenses button[data-l="4"] i{background:var(--l4)}
.lenses button:hover{color:var(--ink)}
.lenses button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1), 0 0 0 1px var(--line)}
.lens{border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--ink);border:1px solid}
.lens.l1{background:var(--l1s);border-color:var(--l1)} .lens.l2{background:var(--l2s);border-color:var(--l2)} .lens.l3{background:var(--l3s);border-color:var(--l3)} .lens.l4{background:var(--l4s);border-color:var(--l4)}
.scen ol{margin:6px 0 0;padding-left:20px} .scen li{margin:3px 0} .scen .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-top:10px} .scenbox{margin-top:10px} .scenbox summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)} .scenbox .lens{margin-top:8px}
.scen .basis{font-size:12px;color:var(--muted);margin-top:10px}
.lens dl{margin:6px 0 0} .lens dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:10px} .lens dd{margin:2px 0 0;color:var(--ink-2)}
.lens .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-top:12px}
mark.p{background:transparent;border-bottom:2px solid var(--l3);color:var(--ink);cursor:pointer;padding:0 1px}
mark.p.on{background:var(--l3);color:var(--surface);border-radius:4px}
.pairs{margin-top:12px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 18px 1.2fr;gap:6px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12.5px;border-radius:8px;cursor:pointer;transition:background var(--t) var(--ease)}
.pair:hover{background:var(--surface)}
.pair .t{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.pair .ar{color:var(--l3);font-weight:800;text-align:center}
.pair .an{grid-column:3;font-size:10.5px;color:var(--muted)}
.pair.on{background:var(--surface);box-shadow:0 0 0 2px var(--l3)}
.warn{display:flex;gap:8px;background:var(--warning-soft);color:var(--ink);font-size:12.5px;padding:10px 12px;border-radius:10px;margin:10px 0}
.warn .ic{color:var(--warn-ink);margin-top:1px}
.note{font-size:12.5px;color:var(--muted)}
.scopenote{padding:6px 18px;border-top:1px solid var(--line);background:var(--surface-2,var(--surface))}
.byline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.unexplained{border:1px dashed var(--line-2);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:13px}
.unexplained .btn{margin-top:10px}
pre.src{background:var(--code-bg);color:var(--code-ink);font:12px/1.65 var(--mono);padding:12px 0;border-radius:12px;overflow:auto;margin:14px 0}
pre.src span{display:block;padding:0 14px;white-space:pre}
pre.src span u{text-decoration:none;color:var(--code-dim);user-select:none} pre.src span.f u{color:var(--code-ink)}
pre.src span.f{background:var(--code-flag);box-shadow:inset 3px 0 0 var(--critical)}
pre.src span.h{background:var(--code-hl);box-shadow:inset 3px 0 0 #FFB547}
.links{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.links h5{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.links button{display:block;max-width:100%;text-align:left;font:12px var(--mono);color:var(--accent-ink);padding:3px 0;overflow-wrap:anywhere}
.links button:hover{text-decoration:underline}

/* ---------- findings ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.fchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink-2);transition:all var(--t) var(--ease)}
.fchip i{width:7px;height:7px;border-radius:99px;background:var(--faint)}
.fchip.critical i{background:var(--critical)} .fchip.high i{background:var(--serious)} .fchip.medium i{background:var(--warning)} .fchip.low i{background:var(--good)}
.fchip b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.fchip:hover{border-color:var(--faint)}
.fchip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)} .fchip.on b{color:var(--on-primary)}
.fcard{position:relative;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.fcard.critical{border-color:color-mix(in srgb, var(--critical) 45%, var(--line))}
.fcard.accepted{opacity:.72}
.fcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fcard .rule{font:11.5px var(--mono);color:var(--muted);white-space:nowrap}
.fcard h4{margin:10px 0 4px;font:650 15px/1.4 var(--display);letter-spacing:-.01em;color:var(--ink)}
.fcard .acts{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.sendmenu{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sendmenu .note{flex-basis:100%;margin:0 0 2px}
.sendmenu a.btn{text-decoration:none}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:550;color:var(--ink-2);padding:1px 8px;border-radius:99px;border:1px solid var(--line-2);white-space:nowrap}
.path{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font:11.5px var(--mono);margin-top:10px}
.path .note{font-family:var(--font);margin-right:2px}
.path button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:7px}
.path button:hover{border-color:var(--accent-line);color:var(--accent-ink)}
.path .sep{color:var(--faint)}
.plain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--l2s);color:var(--ink);font-size:13px}
.fid{font:10.5px var(--mono);color:var(--muted);user-select:all;margin-left:auto}

/* ---------- readiness and about ---------- */
.page{max-width:880px;margin:0 auto}
.scorehero{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-1);margin:0 0 22px}
.gauge{position:relative;width:112px;height:112px;flex:none}
.gauge svg{width:112px;height:112px;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:9}
.gauge .fill{stroke-linecap:round}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font:700 34px/1 var(--display);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.gauge .v span{font-size:11.5px;color:var(--muted);margin-top:3px}
.good .fill{stroke:var(--good)} .good .track{stroke:var(--good-soft)}
.warning .fill{stroke:var(--warning)} .warning .track{stroke:var(--warning-soft)}
.serious .fill{stroke:var(--serious)} .serious .track{stroke:var(--serious-soft)}
.critical .fill{stroke:var(--critical)} .critical .track{stroke:var(--critical-soft)}
.none .track{stroke:var(--sunken)}

<script type="application/json" id="lantern-data">/*__LANTERN_DATA__*/null</script>
<script>

const AI = SEC.ai || {}, AI_BY_NODE = AI.by_node || {};

const RANK = {critical: 0, high: 1, medium: 2, low: 3};
// Findings a visitor can reach from each entry point (security.json says which entry each reachable finding starts from).
const FIND_BY_ENTRY = {};
for (const f of SEC.findings) { const r = f.reachable; if (r && r.entry && f.status !== 'accepted') (FIND_BY_ENTRY[r.entry] ||= []).push(f); }
const entryCounts = id => { const c = {}; for (const f of FIND_BY_ENTRY[id] || []) c[f.rank] = (c[f.rank] || 0) + 1; return ['critical', 'high', 'medium'].filter(k => c[k]).map(k => `<b class="${k}">${c[k]} ${k}</b>`).join(' · '); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS', 'ANY', 'WS'];

const short = q => {

const UI_WORDS = {onClick: 'on click', onSubmit: 'on submit', onChange: 'on change', mutationFn: 'on submit', queryFn: 'on load', action: 'on submit'};

// ---------- Graph view (design 3c): the whole app in five columns, risk as heat ----------

    <a class="btn" href="https://claude.ai/new?q=${q}" target="_blank" rel="noopener noreferrer">Claude</a>
    <a class="btn" href="https://chatgpt.com/?q=${q}" target="_blank" rel="noopener noreferrer">ChatGPT</a>
    <button class="btn" data-copy>Copy for Cursor, Claude Code, others</button><span class="note" data-msg></span></div>`;
  btn.setAttribute('aria-expanded', 'true');
  slot.querySelector('[data-copy]').onclick = async e => {
    const msg = slot.querySelector('[data-msg]');

}

// ---------- live actions (only when opened from `lantern serve`) ----------
const LIVE = window.LANTERN_LIVE || null;
async function live(path, body, method = 'POST') {
  const r = await fetch(LIVE.api + path, {method, headers: {'Content-Type': 'application/json', 'X-Lantern-Token': LIVE.token}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin'});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
async function waitJob(id, onLog) {
  for (;;) {
    const r = await fetch('/api/jobs/' + id, {credentials: 'same-origin'}); const j = await r.json();
    if (onLog) onLog(j.log);
    if (j.status !== 'running') return j;
    await new Promise(res => setTimeout(res, 800));
  }
}
async function explainLive(id, again = false) {
  const msg = document.getElementById('explainmsg') || {}, btn = document.getElementById('explainbtn') || document.getElementById('xexplain') || document.getElementById('reexplain') || {};
  btn.disabled = true; msg.textContent = 'Asking the model…';
  try {
    const job = await live('/explain', {nodes: [id], fresh: again});
    const j = await waitJob(job.id, log => { msg.textContent = log[log.length - 1] || 'Working…'; });
    if (j.status === 'error') throw new Error(j.error);
    const r = await fetch(LIVE.api + '/explanation?node=' + encodeURIComponent(id), {credentials: 'same-origin'}).then(x => x.json());
    if (r.record) { EXP[id] = r.record; }
    render();
  } catch (e) { msg.textContent = e.message; btn.disabled = false; }
}
async function acceptLive(fid) {
  const reason = prompt('Why is this risk acceptable? This reason is shown in the Evidence Report.');
  if (!reason) return;
  try { const job = await live('/accept', {finding: fid, reason}); await waitJob(job.id); location.reload(); } catch (e) { alert(e.message); }
}
async function starterLive(name, btn) {
  try { await live('/starter', {name}); btn.textContent = 'Written ✓'; btn.disabled = true; } catch (e) { alert(e.message); }
}

function gauge(score, size = 112, grade = null) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, n = pct(score);
  return `<div class="gauge ${toneOf(score)}${grade ? ' lettered' : ''}" role="img" aria-label="Readiness ${esc(score)} of 100${grade ? `, grade ${esc(grade)}` : ''}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="fill" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-dasharray="${(c * n / 100).toFixed(1)} ${c.toFixed(1)}"/></svg>
    <div class="v">${grade ? `<b>${esc(grade)}</b>` : `<b>${esc(score)}</b><span>of 100</span>`}</div></div>`;
}
const hardFailures = () => SEC.findings.filter(f => f.status !== 'accepted' && f.rank === 'critical' && f.input && (f.reachable || f.ui_path));
function readyHeadline(R) {
  const hard = hardFailures().length, g = R.grade;
  if (hard) return `Not yet. ${countWord(hard)} thing${hard > 1 ? 's' : ''} ${visitor()} can reach would stop a senior engineer from shipping this.`;
  if (g === 'A') return 'Yes. A senior engineer would ship this; keep the list below green.';
  if (g === 'B') return `Close. Nothing ${visitor()} can reach is critical; a few things below would make a reviewer comfortable.`;
  if (g === 'C') return 'Not quite. No hard failures, but the gaps below are the ones a reviewer asks about first.';
  return 'Not yet. No single hard failure, but too many gaps for a reviewer to sign off.';
}
function renderReady() {
  const el = document.getElementById('center');

  if (!R) { el.innerHTML = '<div class="empty">No readiness results. Run <code>lantern analyze</code> again to compute them.</div>'; return; }
  const checks = arr(R.categories).flatMap(c => arr(c.checks).map(k => ({...k, category: c.title})));
  const passed = checks.filter(k => k.status === 'pass');
  const lang = f => `<span class="lang">${esc(String(f || '').split('.').pop())}</span>`;
  const rankOf = k => /critical/.test(k.id) ? 'critical' : /high/.test(k.id) ? 'high' : /medium/.test(k.id) ? 'medium' : null;
  const firstFinding = k => { const r = rankOf(k); return r ? SEC.findings.find(f => f.rank === r && f.status !== 'accepted' && !f.in_tests) : null; };
  // The design phrases each move as the action, not the check: "Fix: subprocess call with shell=True" / "Commit the lockfile…".
  const moveTitle = k => { const f = firstFinding(k); if (f) { const n = SEC.findings.filter(x => x.rank === f.rank && x.status !== 'accepted' && !x.in_tests).length; const what = (f.headline || f.title).replace(/\.$/, ''); return n > 1 ? `Fix the ${n} ${f.rank} findings, starting with: ${what}` : `Fix: ${what}`; } const fx = (k.fix || '').split(/(?<=\.)\s/)[0].replace(/\.$/, ''); return fx && fx.length < 120 ? fx : k.title; };
  const stepMeta = k => {
    const f = firstFinding(k);

    const m = /(\S+\.\w+):(\d+)/.exec(k.evidence || '');

    return `${sev ? `<b class="${sev}">${sev}</b> · ` : `${esc(k.category.toLowerCase())} · `}${m ? `<code>${esc(m[1])}:${esc(m[2])}</code>${lang(m[1])} · ` : ''}${esc(k.evidence || '')}`;
  };
  const stepAct = k => /^sec-/.test(k.id) ? `<button class="btn" data-go="findings">Show me</button>` : /deploy|docker|ci|health|security-md|env-example/.test(k.id) && Object.keys(R.starter || {}).length ? `<button class="btn" data-go="starters">${LIVE ? 'Write them for me' : 'Show the starters'}</button>` : `<button class="btn" data-go="advanced">Show me</button>`;

        <div class="k2">What moves the needle most</div>
        <div class="moves">${top.map(k => `<div class="move"><span class="gain">+${esc(Math.round(k.gain))}</span><div><div class="t">${esc(moveTitle(k))}</div><div class="d">${stepMeta(k)}</div></div>${stepAct(k)}</div>`).join('')}
          ${rest.length ? `<div class="more">${rest.map(k => `<span class="mi"><span class="gain sm">+${esc(Math.round(k.gain))}</span><span>${esc(moveTitle(k))}</span></span>`).join('')}<button class="linkbtn" data-go="advanced">All ten areas</button></div>` : ''}</div>
        </div><aside class="rside">
        <div class="k2" style="margin-top:0">Already good · keep it that way</div>${passed.length ? passed.slice(0, 6).map(k => `<div class="good"><span class="pic good">${icon('check')}</span><span>${esc(k.title)}</span></div>`).join('') : '<div class="note">Nothing has passed yet.</div>'}${passed.length > 6 ? `<div class="note">and ${passed.length - 6} more</div>` : ''}
        <div class="howscore"><b>How the score works.</b> Ten areas, each weighted. Every point has a written reason, and heuristic checks never count as hard failures. <button class="linkbtn" data-go="advanced">Read the rubric</button></div>

      <div><section class="card"><b>Starter files</b><div class="note" style="margin:4px 0 8px">Written next to your code, never over an existing file.</div>${files.map(([n, f]) => `<label class="chk2"><input type="checkbox" data-sf="${esc(n)}" checked> ${esc(n)}<span class="note"> · ${esc(f.why)}</span></label>`).join('') || '<div class="note">Nothing to write: the usual files are already here.</div>'}${files.length ? (LIVE ? `<button class="btn primary" id="writesel" style="margin-top:10px">Write ${files.length} files</button>` : `<pre class="cmdbox">lantern starter . --write ${files.map(([n]) => n.split('/').pop().replace(/^\./, '').split('.')[0].toLowerCase()).join(' ')}</pre>`) : ''}<div id="writemsg" class="note"></div></section>

      </div></div>

    const ws = el.querySelector('#writesel'); if (ws) ws.onclick = async () => { const names = [...el.querySelectorAll('[data-sf]:checked')].map(x => x.dataset.sf); ws.disabled = true; for (const n of names) { try { await live('/starter', {name: n}); } catch (e) { el.querySelector('#writemsg').textContent = e.message; } } el.querySelector('#writemsg').textContent = `Wrote ${names.length} file${names.length === 1 ? '' : 's'} next to your code.`; };

    else if (t.id === 'rasksend') { const ta = document.getElementById('raskin'); const v = ta.value.trim(); ta.value = ''; rAskSend(v); }
    else if (t.dataset.rchip) rAskSend(t.dataset.rchip); });
  el.addEventListener('keydown', e => { if (e.target.id === 'raskin' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('rasksend').click(); } });
})();

window.setSimple = v => { setMode(PHONE.matches || v, false); if (LIVE) LIVE.view_mode = S.simple ? 'simple' : 'advanced'; render(); };   // the app's toggle, already saved
PHONE.addEventListener('change', () => { if (PHONE.matches && !S.simple) { S.simple = true; render(); } });
function renderScope() {   // per-layer permissions (lantern/scope.py): say once, on every tab, what this person sees
  const el = document.getElementById('scopenote');
  if (!el || !DATA.scope || !Array.isArray(DATA.scope.lanes)) return;
  const ws = DATA.scope.lanes.map(l => LANE_WORD[l] || String(l)), and = a => a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  el.textContent = `You can see the ${and(ws)} ${ws.length === 1 ? 'layer' : 'layers'} of this app. Calls into the rest show as sealed boxes.`;
  el.hidden = false;
}
function render() {
  renderScope();
  // renderMap puts these back for Flowchart and Graph; left on, gfull's overflow:hidden stopped every other tab scrolling
  document.getElementById('center').classList.remove('dotted', 'gfull');
  if (S.tab !== 'map' && document.body.classList.contains('gmax')) setGraphMax(false);
  mountBackdrop();
  renderRAsk();
  renderLeft();
  if (S.tab === 'map') renderMap(); else if (S.tab === 'findings') renderFindings(); else if (S.tab === 'prot') renderProtections(); else if (S.tab === 'ready') renderReady(); else if (S.tab === 'xp') renderExplanations(); else if (S.tab === 'fix') renderFix(); else renderAbout();
  tabWords();
  renderRight();
}
// default: first non-test entry point, preferring routes
const EP_ORDER = ['page', 'route', 'cli', 'main', 'script'];
const firstEp = G.nodes.filter(n => n.entry && n.entry.kind !== 'test').sort((a, b) => EP_ORDER.indexOf(a.entry.kind) - EP_ORDER.indexOf(b.entry.kind) || (a.entry.detail || '').length - (b.entry.detail || '').length)[0];
if (firstEp) { S.entry = firstEp.id; S.open = new Set([firstEp.id]); }
// Open on the worst problem a visitor can reach, as designed (3c, 11b): its path's start, and in Advanced the flagged
// function itself, so the right panel shows it instead of an empty "select a function".
const worstReached = SEC.findings.filter(f => f.status !== 'accepted' && (f.ui_path || f.reachable) && N[f.node]).sort((a, b) => RANK[a.rank] - RANK[b.rank] || (b.input ? 1 : 0) - (a.input ? 1 : 0))[0];
if (worstReached) {
  const path = worstReached.ui_path || worstReached.reachable.path || [];
  if (path.length && N[path[0]]) { S.entry = path[0]; S.open = new Set(path); }
  if (!S.simple) S.sel = worstReached.node;
}
recheckBanner();
render();
</script>
