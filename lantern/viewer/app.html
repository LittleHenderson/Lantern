<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2" id="themecolor">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Lora:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Lantern</title>
<style>
/* Lantern design tokens. The same set lives in report.html and evidence.py (each page is self-contained).
   Color jobs: ink for text and primary actions, one blue accent for selection and links, status colors
   (good, warning, serious, critical) only for risk and results, always with a label. */
:root{
  color-scheme: light;
  --bg:#F5F5F2; --glow:rgba(255,181,71,.2); --surface:#FFFFFF; --surface-2:#FAFAF8; --sunken:#EEEEEA; --hover:rgba(22,22,24,.045);
  --ink:#161618; --ink-2:#46464C; --muted:#62626A; --faint:#A3A3A8;
  --line:rgba(22,22,24,.09); --line-2:rgba(22,22,24,.16);
  --accent:#0F7B74; --accent-ink:#0B5F5A; --accent-soft:rgba(15,123,116,.10); --on-accent:#FFFFFF;
  --primary:#161618; --primary-hover:#2C2C30; --on-primary:#FFFFFF;
  --flame:#FFB547;
  --good:#0CA30C; --warning:#FAB219; --serious:#EC835A; --critical:#D03B3B;
  --good-soft:rgba(12,163,12,.11); --warning-soft:rgba(250,178,25,.17); --serious-soft:rgba(236,131,90,.16); --critical-soft:rgba(208,59,59,.11);
  --good-ink:#0A7A0A; --warn-ink:#8A5A00; --crit-ink:#B02A2A;
  --code-bg:#151517; --code-ink:#E7E7E4; --code-dim:#8A8A91;
  --shadow-1:0 1px 2px rgba(16,16,20,.05);
  --shadow-2:0 1px 2px rgba(16,16,20,.04), 0 6px 20px -6px rgba(16,16,20,.10);
  --shadow-3:0 1px 3px rgba(16,16,20,.06), 0 24px 56px -16px rgba(16,16,20,.28);
  --r-sm:7px; --r:10px; --r-lg:16px; --r-xl:22px;
  --ease:cubic-bezier(.2,.8,.2,1); --t:160ms;
  --font:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif:"Lora", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
:root[data-theme=dark]{
  color-scheme: dark;
  --bg:#0E0E10; --glow:rgba(255,170,60,.1); --surface:#161618; --surface-2:#1B1B1E; --sunken:#0A0A0B; --hover:rgba(255,255,255,.05);
  --ink:#F3F3F1; --ink-2:#BEBEC3; --muted:#9A9AA0; --faint:#5E5E64;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --accent:#4FC3BA; --accent-ink:#7FDBD3; --accent-soft:rgba(79,195,186,.14); --on-accent:#0E0E10;
  --primary:#F3F3F1; --primary-hover:#FFFFFF; --on-primary:#0E0E10;
  --good-soft:rgba(12,163,12,.20); --warning-soft:rgba(250,178,25,.18); --serious-soft:rgba(236,131,90,.20); --critical-soft:rgba(208,59,59,.22);
  --good-ink:#5BD15B; --warn-ink:#FAC55A; --crit-ink:#FF8A8A;
  --code-bg:#0A0A0B;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-3:0 1px 3px rgba(0,0,0,.4), 0 24px 56px -16px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    color-scheme: dark;
    --bg:#0E0E10; --glow:rgba(255,170,60,.1); --surface:#161618; --surface-2:#1B1B1E; --sunken:#0A0A0B; --hover:rgba(255,255,255,.05);
    --ink:#F3F3F1; --ink-2:#BEBEC3; --muted:#9A9AA0; --faint:#5E5E64;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
    --accent:#4FC3BA; --accent-ink:#7FDBD3; --accent-soft:rgba(79,195,186,.14); --on-accent:#0E0E10;
    --primary:#F3F3F1; --primary-hover:#FFFFFF; --on-primary:#0E0E10;
    --good-soft:rgba(12,163,12,.20); --warning-soft:rgba(250,178,25,.18); --serious-soft:rgba(236,131,90,.20); --critical-soft:rgba(208,59,59,.22);
    --good-ink:#5BD15B; --warn-ink:#FAC55A; --crit-ink:#FF8A8A;
    --code-bg:#0A0A0B;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-3:0 1px 3px rgba(0,0,0,.4), 0 24px 56px -16px rgba(0,0,0,.7);
  }
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink-2);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
code{font:12.5px var(--mono);background:var(--sunken);color:var(--ink);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}

/* ---------- top bar ---------- */
/* Backdrop: three full-size SVG layers, each animated as a whole element (compositor only), 22–30 s drifts.
   Quieter on project screens (the Atlas is busy enough); off under prefers-reduced-motion or in Settings. */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.55;transition:opacity .4s}
#bg.quiet{opacity:.4}#bg.off{display:none}
#bg svg{position:absolute;inset:0;width:100%;height:100%;will-change:transform}
#bg .la{animation:drift1 22s cubic-bezier(.45,0,.55,1) 0s infinite}#bg .lb{animation:drift2 26s cubic-bezier(.45,0,.55,1) 3s infinite}#bg .lc{animation:drift3 30s cubic-bezier(.45,0,.55,1) 6s infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-26px) rotate(6deg)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,18px)}}
@keyframes drift3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,22px) rotate(-8deg)}}
@keyframes flame{0%{transform:scale(1,1) skewX(0)}22%{transform:scale(.93,1.09) skewX(-4deg)}48%{transform:scale(1.05,.94) skewX(3deg)}71%{transform:scale(.96,1.06) skewX(-2deg)}100%{transform:scale(1,1) skewX(0)}}
@keyframes flame2{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.88,1.14) skewX(4deg)}60%{transform:scale(1.08,.9) skewX(-3deg)}100%{transform:scale(1,1) skewX(0)}}
@keyframes flameglow{0%,100%{opacity:.5}40%{opacity:.9}70%{opacity:.65}}
@media (prefers-reduced-motion: reduce){#bg svg,.mark .fl,.mark .fl2,.mark .gl{animation:none !important}}
header.top,#view{position:relative;z-index:1}
/* The lantern mark: glow + body + two flame tongues, each animated as a whole element. */
.mark{width:28px;height:28px;border-radius:9px;flex:none;position:relative;display:inline-block;background:#141416;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 4px 14px -4px rgba(255,170,60,.5)}
.mark .gl{position:absolute;left:17%;top:22%;width:66%;height:66%;border-radius:99px;background:radial-gradient(closest-side,rgba(255,196,92,.6),rgba(255,196,92,0));animation:flameglow 1.4s ease-in-out infinite;will-change:opacity}
.mark svg{position:absolute;inset:0;width:100%;height:100%}
.mark .fl{transform-origin:50% 61%;animation:flame 1.1s ease-in-out infinite;will-change:transform}
.mark .fl2{transform-origin:50% 61%;animation:flame2 .75s ease-in-out infinite;will-change:transform}
/* Ask Lantern: floating pill bottom-right, 340×580 window. */
#ask{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:var(--font);color:var(--ink-2)}
#ask .win{width:340px;height:580px;max-height:calc(100vh - 100px);max-width:calc(100vw - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 1px 3px rgba(16,16,20,.08),0 24px 56px -16px rgba(16,16,20,.35);overflow:hidden;transition:opacity .15s}
#ask .hd{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
#ask .hd .t{font:600 13.5px var(--font);color:var(--ink);line-height:1.2}#ask .hd .s{font:11px var(--font);color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ask .hd input[type=range]{width:64px;accent-color:var(--accent);margin:0}
#ask .x{width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;font:400 16px/1 var(--font)}#ask .x:hover{background:var(--hover);color:var(--ink)}
#ask .log{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:10px}
#ask .ctx{align-self:center;font:11px var(--font);color:var(--muted);white-space:nowrap}#ask .ctx b{color:var(--muted);font-weight:600}
#ask .me{align-self:flex-end;max-width:85%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--primary);color:var(--on-primary);font:13px/1.45 var(--font);white-space:pre-wrap}
#ask .bot{align-self:flex-start;max-width:92%;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--surface-2);border:1px solid var(--line);font:13px/1.5 var(--font);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
#ask .bot code{font:11.5px var(--mono);background:var(--sunken);padding:0 4px;border-radius:4px;color:var(--ink)}
#ask .bot .cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#ask .bot .cites button{font:600 10.5px var(--mono);padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);border:0;cursor:pointer}
#ask .bot.wait{color:var(--muted)}
#ask .ft{padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#ask .chips{display:flex;gap:6px;flex-wrap:wrap}#ask .chips button{font:500 11.5px var(--font);padding:4px 9px;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);white-space:nowrap;cursor:pointer}#ask .chips button:hover{background:var(--hover)}
#ask .shot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft)}#ask .shot .nm{font:600 12.5px var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ask .shot .sm{font:11px var(--font);color:var(--muted)}#ask .shot button{font:600 11.5px var(--font);color:var(--ink-2);padding:4px 8px;border-radius:7px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
#ask .comp{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
#ask .comp .att{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}#ask .comp .att:hover{background:var(--hover);color:var(--ink)}
#ask .comp textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:13px/1.4 var(--font);color:var(--ink);min-height:20px;max-height:90px;padding:4px 2px}
#ask .comp .send{width:30px;height:30px;border-radius:9px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;cursor:pointer}
#ask .asknote{font:10.5px var(--font);color:var(--muted);text-align:center}
#ask .peek{padding:8px 12px;border-radius:12px 12px 4px 12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);font:12.5px/1.4 var(--font);color:var(--ink);max-width:230px}
#ask .pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:99px;border:0;background:var(--primary);color:var(--on-primary);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18),0 10px 28px -8px rgba(255,170,60,.55);transition:padding .15s,transform .15s;font:600 13.5px var(--font)}
#ask .pill:hover{transform:translateY(-1px)}#ask .pill .lbl{display:none}#ask .pill:hover .lbl{display:inline}#ask .pill:hover{padding:0 14px 0 12px}
#ask .pill .mark{width:24px;height:24px;border-radius:8px;box-shadow:none}
@media (max-width:760px){#ask .win{width:calc(100vw - 32px);height:min(580px,calc(100vh - 90px))}}
/* Simple / Advanced segmented toggle (shared chrome) */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunken);border:1px solid var(--line)}
.seg button{padding:4px 10px;border-radius:6px;border:0;cursor:pointer;font:600 12px var(--font);background:transparent;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
@media (max-width:760px){#viewmode{display:none !important}}
header.top{position:sticky;top:0;z-index:10;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;font:600 16px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.brand:hover span{color:var(--accent-ink)}
.nav{display:flex;gap:2px;margin-left:auto;padding:3px;border-radius:12px;background:var(--hover)}
.nav button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:6px 12px;border-radius:9px;font-weight:550;font-size:13.5px;color:var(--muted);transition:color var(--t) var(--ease), background var(--t) var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1), 0 0 0 1px var(--line)}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--muted);transition:background var(--t) var(--ease), color var(--t) var(--ease)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn .ic{width:18px;height:18px}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
.hero{position:relative;isolation:isolate;margin:0 0 28px}
.hero::before{content:"";position:absolute;z-index:-1;left:-120px;top:-140px;width:520px;height:360px;background:radial-gradient(closest-side, var(--glow), transparent);pointer-events:none}
h1{font:700 32px/1.15 var(--display);letter-spacing:-.028em;color:var(--ink);margin:0 0 8px}
h2{font:650 17px/1.3 var(--display);letter-spacing:-.012em;color:var(--ink);margin:0}
h3{font:650 15px/1.35 var(--display);letter-spacing:-.01em;color:var(--ink);margin:0}
.lede{font-size:15.5px;line-height:1.6;color:var(--muted);max-width:680px;margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 10px}
.sectionhead{display:flex;align-items:baseline;gap:10px;margin:36px 0 14px}
.count{font:600 12px var(--font);color:var(--muted);background:var(--hover);padding:1px 8px;border-radius:99px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .art{width:56px;height:56px;margin:0 auto 14px;display:block;opacity:.9}
.empty b{display:block;color:var(--ink);font:600 16px var(--display);margin-bottom:4px}


/* ---------- Projects (design 3b/8a/8b): Simple hero + app cards, Advanced strip + table ---------- */
.simplehome{max-width:1040px;padding-top:36px;position:relative;isolation:isolate}
/* The warm light behind the home headline, as in the mock-ups (same --glow as the hero on other pages). */
.simplehome::before{content:"";position:absolute;z-index:-1;left:50%;top:-70px;width:min(820px,100%);height:360px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.simplehome h1{font:700 36px/1.15 var(--font);letter-spacing:-.025em;text-align:center;margin:0 0 10px}
.simplehome .lede{text-align:center;max-width:520px;margin:0 auto 28px;font-size:16px}
.dropzone{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-2);transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease)}
.dropzone:focus-within,.dropzone.over{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.dropzone .ic{width:20px;height:20px;color:var(--muted);flex:none}
.dropzone input[type=text]{flex:1;border:0;background:transparent;height:40px;padding:0;font-size:16px;box-shadow:none !important;min-width:0}
.dropzone .btn.ghost{height:40px;border-radius:12px;font-size:14px}
.dropzone .btn.primary{height:44px;padding:0 20px;border-radius:13px;font-size:15px}
.steps3{display:flex;justify-content:center;gap:40px;margin:22px 0 40px;font:13.5px var(--font);color:var(--muted);flex-wrap:wrap}
.steps3 span{display:flex;align-items:center;gap:8px}
.steps3 b{display:grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--hover);color:var(--ink);font:600 12px var(--font)}
.privline{display:flex;gap:8px;align-items:flex-start;max-width:720px;margin:-18px auto 36px;font:13px/1.5 var(--font);color:var(--muted)}.privline .ic{width:15px;height:15px;flex:none;margin-top:2px;color:var(--accent)}
.apps-head{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.apps-head h2{font:600 18px var(--font);letter-spacing:-.01em}
.apps-head span{font:13px var(--font);color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-1);transition:box-shadow var(--t) var(--ease), border-color var(--t) var(--ease)}
.app:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.app .top{display:flex;align-items:flex-start;gap:14px}
.app .name{font:600 19px/1.2 var(--font);color:var(--ink);letter-spacing:-.01em;overflow-wrap:anywhere}
.app .path{font:12px var(--mono);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.app .sentence{margin:0;font:14.5px/1.5 var(--font);color:var(--ink-2)}
.app .sentence b.bad{color:var(--crit-ink)} .app .sentence b{color:var(--ink)}
.app .actions{display:flex;gap:8px;margin-top:auto;align-items:center}
.app .actions .btn{height:36px;border-radius:10px;font-size:14px}
.app .checking{display:flex;align-items:center;gap:8px;font:600 14px var(--font);color:var(--ink)}
.app .checking i{width:8px;height:8px;border-radius:99px;background:var(--accent);animation:pulse 1.4s var(--ease) infinite}
.app .indeterminate{height:4px}
.app .lastline{margin:0;font:13.5px/1.5 var(--font);color:var(--muted);overflow-wrap:anywhere}
.app .ring{width:56px;height:56px}.app .ring svg{width:56px;height:56px}
.firstrun{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:860px;margin:0 auto}
.firstrun .card{border-radius:18px}
.firstrun .k{font:600 12px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.firstrun h3{font:600 18px/1.3 var(--font);margin:0 0 8px}
.firstrun p{margin:0 0 14px;font:14.5px/1.55 var(--font);color:var(--ink-2)}
.firstrun .li{display:flex;align-items:center;gap:10px;font:14px var(--font);color:var(--ink-2);padding:7px 0}
.firstrun .li .ic{width:16px;height:16px;color:var(--accent)}
.running-steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}

function termPrint(text, cls = '') {

// Split a typed line into words the way a shell would quote them, without ever handing it to a shell: the server

function termWords(line) {
  const out = []; let cur = '', q = null, any = false;
  for (const ch of line) {

    if (ch === '"' || ch === "'") { q = ch; any = true; continue; }
    if (/\s/.test(ch)) { if (cur || any) out.push(cur); cur = ''; any = false; continue; }

const TERM_HELP = `Lantern commands only (results go to this project's .lantern/):
  analyze [--offline] [--no-scan]          read the project again
  trace python -m pytest -q                run your tests in the sandbox
  explain [--node ID] [--depth N]          explain functions with the model in Settings
  report                                   rebuild report.html
  verify                                   compare with the Evidence Report
  accept ID --reason "..."  |  accept ID --remove
  packs                                    list analysis packs
  export [--sarif FILE]                    findings as SARIF
  learn [--check]                          a starter app's progress
Shell commands are refused: this drawer never runs a shell or your code.`;
async function termRun(line) {
  const p = S.view === 'project' && (S.state.projects || []).find(x => x.id === S.project);
  termPrint('lantern ' + line, 'me');
  const argv = termWords(line); if (argv[0] === 'lantern') argv.shift();
  if (!argv.length || argv[0] === 'help' || argv[0] === '?') { termPrint(TERM_HELP, 'sys'); return; }
  if (!p) { termPrint('Open a project first; the terminal runs against the project on screen.', 'err'); return; }
  try {
    const r = await api(`/api/projects/${p.id}/cmd`, {method: 'POST', body: {argv}});
    if (r.output) termPrint(r.output);
    if (r.job) {
      S.jobs[p.id] = r.job; let seen = 0;
      for (;;) {
        const j = await api('/api/jobs/' + r.job.id);
        for (; seen < j.log.length; seen++) termPrint(j.log[seen]);
        if (j.status !== 'running') { if (j.status === 'error') termPrint(j.error, 'err'); else termPrint('done', 'sys'); S.frame = null; await refresh(); break; }
        await new Promise(res => setTimeout(res, 700));
      }
    }
  } catch (e) { termPrint(e.message, 'err'); }
}

document.getElementById('tcmd').addEventListener('keydown', e => {

  else if (e.key === 'ArrowUp') { if (TERM.hi > 0) { TERM.hi--; i.value = TERM.hist[TERM.hi]; } e.preventDefault(); }
  else if (e.key === 'ArrowDown') { if (TERM.hi < TERM.hist.length - 1) { TERM.hi++; i.value = TERM.hist[TERM.hi]; } else { TERM.hi = TERM.hist.length; i.value = ''; } e.preventDefault(); }

});

async function watchTrace(jobId, p, command) {
  let j;
  for (;;) { try { j = await api('/api/jobs/' + jobId); } catch (e) { await new Promise(r => setTimeout(r, 2000)); continue; } if (j.status !== 'running') break; await new Promise(r => setTimeout(r, 1000)); }
  const r = j.result || {};
  const tail = (j.log || []).slice(-6).join('\n');
  const blocked = Array.isArray(r.blocked) ? r.blocked : [];
  if (blocked.length || r.timed_out) {
    const why = r.timed_out ? 'They ran longer than 10 minutes, so the sandbox stopped them and everything they started.'
      : 'The sandbox refused ' + blocked.map(b => b.kind === 'network' ? 'a network connection' : 'a write outside its temp folder').filter((x, i, a) => a.indexOf(x) === i).join(' and ') + '. Tests here cannot change your project or reach the internet.';
    S.toast = {pid: p.id, html: `<div class="toastin bad"><div><b>Your tests were stopped by the sandbox.</b> ${esc(why)}<pre class="log" style="margin-top:8px;max-height:120px">${esc(blocked.map(b => b.what).join('\n') || tail)}</pre></div><span class="spacer"></span><button class="btn sm" data-retry>Try again</button><button class="btn ghost sm" data-dismiss>Dismiss</button></div>`};
  } else if (j.status === 'error' || (r.returncode !== undefined && r.returncode !== 0 && !r.observed)) {
    const code = r.returncode !== undefined ? r.returncode : '?';
    const likely = /No module named|ModuleNotFoundError/.test(tail + (j.error || '')) ? 'A package your tests import is not installed in the Python that runs Lantern.' : /not recognized|No such file|command not found/.test(tail + (j.error || '')) ? 'The command was not found. Is pytest installed?' : /collected 0 items|no tests ran/.test(tail) ? 'No tests were found by that command.' : 'Look at the last lines below.';
    S.toast = {pid: p.id, html: `<div class="toastin bad"><div><b>Your tests didn’t finish, so nothing changed.</b> Exit code ${esc(code)}. ${esc(likely)}<pre class="log" style="margin-top:8px;max-height:120px">${esc(j.error || tail)}</pre></div><span class="spacer"></span><button class="btn sm" data-retry>Try again</button><button class="btn sm" data-retry>Change the command</button><button class="btn ghost sm" data-dismiss>Skip</button></div>`};
  } else {
    const d = r.score_after != null && r.score_before != null ? r.score_after - r.score_before : null;
    S.toast = {pid: p.id, html: r.traced === false ? `<div class="toastin ok">${icon('check')}<div><b>Tests ran${r.returncode === 0 ? '' : ` (exit ${esc(r.returncode)})`}${r.backend ? ` in the ${r.backend === 'docker' ? 'Docker' : 'restricted'} sandbox` : ''}.</b> ${esc(r.note || 'Tests run; your map upgrades for Python only for now.')}</div><span class="spacer"></span><button class="btn ghost sm" data-dismiss>Dismiss</button></div>` : `<div class="toastin ok">${icon('check')}<div><b>Tests ran${r.returncode === 0 ? '' : ` (exit ${esc(r.returncode)})`}.</b> ${esc(r.observed || 0)} call${r.observed === 1 ? '' : 's'} seen running${r.recall != null ? `, ${Math.round(r.recall * 100)}% of them already on the map` : ''}.${d == null ? '' : d > 0 ? ` Readiness up ${d}, now ${r.score_after}.` : ` Readiness unchanged at ${r.score_after}.`} The edges your tests went through are now solid in the Atlas.</div><span class="spacer"></span><button class="btn ghost sm" data-dismiss>Dismiss</button></div>`};
  }
  S.frame = null; await refresh();
}

function watch(jobId, pid) {
  S.jobs[pid] = {id: jobId, log: [], status: 'running'};
  const tick = async () => {
    try {
      const j = await api('/api/jobs/' + jobId);
      S.jobs[pid] = j;
      const el = document.getElementById('log-' + pid);
      if (el) { const t = el.querySelector('.t'); el.textContent = j.log.join('\n'); if (t) el.prepend(t); el.scrollTop = el.scrollHeight; }
      const line = document.querySelector(`[data-last="${pid}"]`); if (line && j.log.length) line.textContent = j.log[j.log.length - 1];
      if (j.status === 'running') return setTimeout(tick, 700);
      S.frame = null;   // results changed: the embedded report is rebuilt on the next render
      await refresh();
    } catch (e) { setTimeout(tick, 2000); }
  };
  tick();
}

function counts(c) {
  if (!c) return '<span class="sev"><i></i>Not scanned</span>';
  const parts = [];
  if (c.critical) parts.push(`<span class="sev critical"><i></i>${esc(c.critical)} critical</span>`);
  if (c.high) parts.push(`<span class="sev high"><i></i>${esc(c.high)} high</span>`);
  if (c.medium) parts.push(`<span class="sev medium"><i></i>${esc(c.medium)} medium</span>`);
  if (c.accepted) parts.push(`<span class="sev"><i></i>${esc(c.accepted)} accepted</span>`);
  return parts.join('') || '<span class="sev ok"><i></i>No open critical, high, or medium</span>';
}
function sentence(p) {
  // One plain sentence per app (design 3b): what a visitor could reach, the smaller ones, the readiness number.
  const c = p.counts || {}; if (p.score == null) return 'Not checked yet.';
  const parts = [];
  if (p.reachable_critical) parts.push(`<b class="bad">${esc(p.reachable_critical)} serious problem${p.reachable_critical > 1 ? 's' : ''}</b> a visitor could reach${p.top_page ? ` from the ${esc(p.top_page)} page` : ''}`);
  else if (c.critical) parts.push(`<b class="bad">${esc(c.critical)} serious problem${c.critical > 1 ? 's' : ''}</b>, none a visitor can reach`);
  const smaller = (c.high || 0) + (c.medium || 0);
  if (parts.length && smaller) parts[0] += `, and ${smaller} smaller one${smaller > 1 ? 's' : ''}`;
  else if (!parts.length) {
    const bits = []; if (c.high) bits.push(`${c.high} high`); if (c.medium) bits.push(`${c.medium} medium`);
    parts.push(bits.length ? `No serious problems. <b>${esc(bits.join(' and '))}</b> to look at` : 'No open problems a visitor could reach');
  }
  if (c.accepted) parts[0] += `, and ${c.accepted} risk${c.accepted > 1 ? 's' : ''} you accepted with a reason`;
  return parts.join('') + `. Readiness ${esc(p.score)} of 100.`;
}

function drawProject(el) {

    <div class="tabs" role="tablist">${p.starter ? tab('guide', W.guide) : ''}${['atlas', 'findings', 'prot', 'ready', 'evidence', 'explain'].map(t => tab(t, W[t])).join('')}</div>
    <span class="spacer"></span>${simple ? '' : `<button class="btn ghost sm" id="termbtn" title="Terminal (press \`)">${icon('bolt')}<span>Terminal</span></button>`}${p.has_report ? `<button class="btn sm" id="watchtests" title="Watch my tests run" ${isRunning(p) ? 'disabled' : ''}>${icon('play')}<span>Watch my tests run</span></button>` : ''}<a class="btn ghost sm newtab" href="/p/${p.id}/${S.tab === 'evidence' ? 'evidence' : 'report'}.html" target="_blank" rel="noopener" title="Open in new tab">${icon('open')}<span>Open in new tab</span></a><span class="dock" data-dock="end"></span></div>
    <div id="toast"></div>
    <div id="pbody"></div>`;
  el.querySelector('#back').onclick = () => go('home');

  { const tb = el.querySelector('#termbtn'); if (tb) tb.onclick = () => termToggle(); }   // Advanced only (the ` key still opens it)
  if (S.toast && S.toast.pid === p.id) { el.querySelector('#toast').innerHTML = S.toast.html; el.querySelector('#toast').onclick = e => { if (e.target.closest('[data-dismiss]')) { S.toast = null; el.querySelector('#toast').innerHTML = ''; } if (e.target.closest('[data-retry]')) watchTestsSheet(p); }; }
  el.querySelectorAll('.sub [data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.reportTab = null; ASK.page = null; if (ASK.open) renderAsk(); renderProject(el); });
  const body = el.querySelector('#pbody');
  if (S.tab === 'guide') return renderGuide(body, p);
  if (REPORT_TABS[S.tab]) {
    const want = S.reportTab || REPORT_TABS[S.tab];
    const old = S.frame && S.frame.pid === p.id ? S.frame.el : null;
    const bar = S.tab === 'explain' ? '<div class="xbar" id="xbar"></div>' : '';
    body.classList.toggle('withbar', S.tab === 'explain');
    if (old && old.contentDocument && old.contentDocument.querySelector('#tabs')) {
      // Same project: keep the loaded report and switch its tab, so the Atlas state (selection, zoom) survives.
      body.innerHTML = bar; body.appendChild(old); try { old.contentDocument.querySelector(`#tabs [data-t="${want}"]`)?.click(); } catch (err) {}
    } else {
      body.innerHTML = `${bar}<iframe src="/p/${p.id}/report.html" title="${esc(W[S.tab])}"></iframe>`;
      const fr = body.querySelector('iframe'); S.frame = {pid: p.id, el: fr};
      // The report is served from this app's origin, so the app can open it on a tab and keep the theme in step.
      fr.onload = e => { try { themeOn(e.target.contentDocument); e.target.contentDocument.body.classList.add('embed'); e.target.contentDocument.querySelector(`#tabs [data-t="${want}"]`)?.click(); } catch (err) {} };

async function renderExplain(bar, p) {
  // The batch control from the design's Explanations header: "Explain 98 unexplained · est. 6 min · $0.00".
  const s = S.state.settings, prov = S.state.providers.find(x => x.name === s.provider) || {};
  const job = S.jobs[p.id];
  bar.innerHTML = `<span class="working"><span class="pulse"></span>Working out what to explain…</span>`;
  let plan;
  try { plan = await api(`/api/projects/${p.id}/plan?depth=3&limit=40`); } catch (e) { bar.innerHTML = note('err', esc(e.message)); return; }
  const cloud = prov.local === false || (prov.local === null && !/localhost|127\.0\.0\.1/.test(s.base_url || ''));
  const ready = s.model && (!prov.needs_key || prov.key);
  const num = v => (+v || 0).toLocaleString();
  const mins = Math.max(1, Math.round(plan.nodes * 6 / 60));
  const cost = !s.model ? '' : !cloud ? 'free, local' : prov.allowance ? 'free allowance' : `about ${num(plan.input_tokens)} tokens in, ${num(plan.output_tokens)} out`;
  const running = job && job.status === 'running';
  bar.innerHTML = `${icon('sparkle')}<div class="t"><b>${plan.nodes ? `Explain ${num(plan.nodes)} unexplained` : 'Everything on the main paths is explained'}</b>${plan.nodes ? ` · est. ${mins} min · ${esc(cost || 'choose a model in Settings')}` : ''}<div class="d">${esc(plan.note || '')} ${s.model ? `Model <b>${esc(s.provider)}/${esc(s.model)}</b>${cloud ? ' — the code of these functions is sent to ' + esc(prov.allowance ? 'Claude Haiku through the free allowance' : s.provider) + '.' : ' — stays on this computer.'}` : 'No model chosen yet.'} <a href="#" id="toset">Settings</a></div></div>
    ${running ? `<span class="working"><span class="pulse"></span>Explaining…</span><button class="btn sm" id="showlog">Log</button>` : plan.nodes ? `<button class="btn primary" id="go" ${!ready ? 'disabled' : ''}>${icon('sparkle')}Explain ${num(plan.nodes)} functions</button>` : ''}
    ${job && job.status === 'error' ? note('err', esc(job.error)) : ''}<pre class="log xlog" id="log-${p.id}" ${running ? '' : 'hidden'}>${esc((job && job.log || []).join('\n'))}</pre>`;
  bar.querySelector('#toset').onclick = e => { e.preventDefault(); go('settings'); };
  const g = bar.querySelector('#go'); if (g) g.onclick = async () => {
    try { const j = await api(`/api/projects/${p.id}/explain`, {method: 'POST', body: {depth: 3, limit: 40}}); watch(j.id, p.id); renderExplain(bar, p); }
    catch (e) { alert(e.message); }
  };
  const sl = bar.querySelector('#showlog'); if (sl) sl.onclick = () => { const l = bar.querySelector('.xlog'); l.hidden = !l.hidden; };
}

      : pr.local === false ? note('warn', pr.allowance
          ? `Free allowance: no key needed. Explanations go through Lantern's gateway to Claude Haiku; the gateway counts usage and stores no code. ${esc(pr.notice || '')} Add your own Anthropic key below to remove the limit.`
          : `Cloud model: when you ask for explanations, the code of each explained function is sent to ${esc(name)}. Lantern never sees your code or key. ${esc(pr.notice || '')}`)

  el.addEventListener('click', async e => {

      <div id="provinfo"></div>
      <label for="model">Model name</label><input type="text" id="model" value="${esc(s.model)}" placeholder="the provider's model id, e.g. from its model list" spellcheck="false">
      <div id="urlrow"><label for="url">Base URL (optional)</label><input type="text" id="url" value="${esc(s.base_url)}" spellcheck="false"></div>
      <div id="keyrow"><label for="key">API key</label><input type="password" id="key" autocomplete="off" placeholder="paste to set or replace">
        <label class="check"><input type="checkbox" id="remember"><span>Remember on this computer (saved in ~/.lantern/keys.json, readable only by you). Otherwise kept in memory until Lantern stops.</span></label>
        <button class="btn sm" id="forget" type="button">Forget saved key</button></div></div>
    <div class="card group" id="privcard"><h2>Privacy</h2><div class="hint">Applies to reports written from now on.</div>
      <label class="choice"><input type="radio" name="priv" value="full" ${s.privacy !== 'structure' ? 'checked' : ''}><span><b>Full</b>Reports include each function's source, for the code panel.</span></label>
      <label class="choice"><input type="radio" name="priv" value="structure" ${s.privacy === 'structure' ? 'checked' : ''}><span><b>Structure only</b>Reports leave source code out (safer to share).</span></label>
      <div class="row" style="margin-top:18px"><button class="btn primary" id="save">Save</button><span id="saved" class="small muted"></span></div></div>
    <div class="card group"><h2>Anonymous usage counts</h2><div class="hint">Off unless you turn it on. When on, Lantern sends at most once a day: a random install id, its version, your operating system name, and how many times each feature was used (for example "analyze: 3, explain: 1"). Never project names, files, code, findings or keys. It helps show which parts of Lantern people actually use.</div>

  const save = async (extra = {}) => {

// Settings → Analysis packs (design 10d): built-in packs, then project and user packs, each with an on/off switch.
// A change applies on the next check; projects analyzed before it show "Re-check to apply" (GET /api/state `stale`).
async function drawPacks(box) {
  if (!box) return;
  let d;
  try { d = await api('/api/packs?all=1'); } catch (e) { box.innerHTML = note('err', esc(e.message)); return; }
  const where = {builtin: 'Built in', project: 'From a project', user: 'From your packs folder'};
  const card = x => `<div class="pack ${x.enabled ? '' : 'off'}"><div class="pk"><b>${esc(x.name[0].toUpperCase() + x.name.slice(1))}</b> <span class="small muted">v${esc(x.version)} · ${esc(where[x.source] || x.source)}</span>
      ${x.about ? `<div class="hint">${esc(x.about)}</div>` : ''}
      <div class="meta">${esc(x.rules)} rule${x.rules === 1 ? '' : 's'} · ${esc(x.entry_patterns)} entry pattern${x.entry_patterns === 1 ? '' : 's'} · ${esc(x.path)}</div>
      ${x.source === 'builtin' ? '' : '<div class="hint">Findings from this pack are labelled heuristic.</div>'}</div>
    <button class="switch" role="switch" aria-checked="${x.enabled ? 'true' : 'false'}" aria-label="${esc((x.enabled ? 'Turn off ' : 'Turn on ') + x.name)}" data-pack="${esc(x.name)}"></button></div>`;
  const builtin = d.packs.filter(x => x.source === 'builtin'), mine = d.packs.filter(x => x.source !== 'builtin');
  box.innerHTML = `<label>Built in</label>${builtin.map(card).join('') || '<div class="hint">None in this build.</div>'}
    <label>Project and user packs</label>${mine.map(card).join('') || `<div class="packempty"><b>No project or user packs yet.</b> Add a pack file to <code>lantern-packs/*.json</code> inside a project (used for that project) or <code>~/.lantern/packs/*.json</code> (used for every project). <code>lantern packs</code> checks them; the format is in docs/packs.md.</div>`}
    <div id="packmsg" class="hint">Turning a pack on or off applies on the next check of each project.</div>`;
  box.querySelectorAll('[data-pack]').forEach(b => b.onclick = async () => {
    const on = b.getAttribute('aria-checked') !== 'true';
    b.disabled = true;
    try {
      await api('/api/packs', {method: 'POST', body: {name: b.dataset.pack, enabled: on}});
      await drawPacks(box);
      const m = box.querySelector('#packmsg'); if (m) m.innerHTML = `${esc(b.dataset.pack)} turned ${on ? 'on' : 'off'}. Projects checked before this show <b>Re-check to apply</b>.`;
      try { S.state = await api('/api/state'); } catch (e) {}
    } catch (e) { b.disabled = false; const m = box.querySelector('#packmsg'); if (m) m.textContent = e.message; }
  });
}

const FAQ = [
  ['Safety', 'Does my code leave my computer?', 'No, unless you turn on explanations or Ask Lantern with a cloud model. Analysis (the map, findings, readiness, the Evidence Report) runs here. A GitHub link is cloned onto this computer, not a server. With a local model (Ollama, LM Studio) nothing leaves either. Lantern tells you once, before the first time code would be sent.'],
  ['Safety', 'Does Lantern run my app or my tests?', 'It reads your code; it never runs your app. Tests run only if you ask (“Watch my tests run”), with the command shown first, inside a sandbox: a Docker container or a read-only temp copy, with the network off and your environment variables left out.'],
  ['Safety', 'What does the free allowance store?', 'A hash of your sign-in token and request counts. No code, no prompts, no email address. Each account gets one token; signing in again rotates it.'],
  ['Findings', 'What makes a finding critical?', 'Two yes answers: a page or route leads to that line (reachable), and the line uses something the visitor sent (input). Reachable but no input is high; not reachable stays low even when the scanner says high.'],
  ['Findings', 'What does “reachable” mean?', 'Lantern found a path from a place a visitor can start (a page, a route, a command) to the function that holds the finding. The path is drawn on the finding so you can follow it.'],
  ['Findings', 'What is “accept risk with a reason”?', 'When you have decided a finding is fine (a fixed list, admin-only, a test fixture), write why. The reason is committed in <code>lantern-accepted.json</code> and shown in the Evidence Report; it is never silent.'],
  ['Findings', 'Why are some findings labelled heuristic?', 'Those come from pattern checks that can misfire (missing login check, CORS, rate limit). They say so, never count as hard failures, and ask you to look before acting.'],
  ['Atlas', 'What do the line styles mean?', 'Teal: seen running under your tests. Solid: confirmed by reading the code. Dashed: likely (about 90% right across our benchmark). Dotted: possible. What Lantern could not follow is counted on the About page, never guessed.'],
  ['Atlas', 'What is a hop?', 'One step along a path: a click handler, a function call, an HTTP request from the browser to a route, a call into a library. “Seven hops” means seven such steps from the page to the flagged line.'],
  ['Atlas', 'Why is a function missing from the map?', 'Either nothing reachable calls it (it is counted as hidden in the Graph view), or the call went through something Lantern cannot follow yet: hook results, framework dispatch, dynamic names. The About page lists what was unresolved.'],
  ['Readiness', 'How is the score made?', 'Ten weighted areas (security findings, secrets, input handling, dependencies, tests, observability, packaging, CI, resilience, documentation). Every point has a written reason. Checks that do not apply are skipped, not counted against you.'],
  ['Readiness', 'What is a hard failure?', 'A critical finding a visitor can reach that uses their input. Those cap the grade until fixed; nothing else does.'],
  ['Readiness', 'Will Lantern overwrite my files?', 'Never. Starter files (Dockerfile, CI, .env.example, SECURITY.md) are written only when you press Write, and only where no file exists.'],
  ['Setup', 'How do I add an app?', 'My projects → Browse… to its folder, or paste a GitHub link, then Check my app. Python, TypeScript/JavaScript, Go, Rust and Java apps work today.'],
  ['Setup', 'How do explanations work, and what do they cost?', 'A model writes each function three ways and Lantern checks every phrase against your code. Sign in for a free allowance (about 300 explanations), use your own key, or run a local model for free. The Explanations tab shows the estimate before you press Explain.'],
  ['Setup', 'How do I use Lantern from Claude Code, Cursor or ChatGPT?', 'Settings → Connections shows the one-line setup. The assistant can read findings, paths and readiness and re-check a fix; it can never accept or close a finding.'],
  ['Setup', 'Where are my results stored?', 'In a <code>.lantern</code> folder inside the analyzed project (report, evidence, baseline) and <code>~/.lantern</code> for settings and keys (keys only if you tick “remember”).'],
];
const CLI_REF = [
  ['# open the app for a project', 'lantern serve path/to/app', 'lantern serve https://github.com/you/app'],
  ['# check without the app (CI, scripts)', 'lantern analyze . --fail-on high', 'lantern analyze . --trace -- pytest -q'],
  ['# record a decision, prove a fix', 'lantern accept . FINDING_ID --reason "…"', 'lantern verify . --report evidence.html'],
  ['# explanations and learning', 'lantern explain . --model ollama/llama3.2', 'lantern learn notes-api ~/notes-api', 'lantern starter . --write dockerfile ci'],
  ['# free allowance, connectors', 'lantern login --github', 'lantern mcp --setup'],
];
function renderHelp(el) {
  const H = S.help || (S.help = {q: '', group: 'All', cli: false, open: null});
  const groups = ['All', ...new Set(FAQ.map(f => f[0]))];
  const q = H.q.toLowerCase();
  const list = FAQ.map((f, i) => [i, ...f]).filter(([, g, qq, a]) => (H.group === 'All' || g === H.group) && (!q || (qq + ' ' + a).toLowerCase().includes(q)));
  el.innerHTML = `<main style="max-width:820px"><section class="hero" style="text-align:center"><h1>How can we help?</h1><p class="lede" style="margin:0 auto">Ship your vibe-coded app like a senior engineer built it. Build with vibes. Ship with confidence.</p></section>
    <div class="dropzone" style="margin-bottom:14px">${icon('search')}<input type="text" id="hq" placeholder="Search questions, like “does my code leave my computer”" value="${esc(H.q)}" autocomplete="off"><button class="btn primary" id="hgo">Search</button></div>
    <div class="row" style="margin-bottom:16px">${groups.map(g => `<button class="fchip ${!H.cli && H.group === g ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}<span class="spacer"></span><button class="fchip ${H.cli ? 'on' : ''}" id="hcli">${icon('bolt')}Command line</button></div>
    ${H.cli ? `<div class="card"><h2>Everything the app does, from a terminal</h2><pre class="cli">${CLI_REF.map(([c, ...cmds]) => `<span class="c">${esc(c)}</span>\n${cmds.map(esc).join('\n')}`).join('\n\n')}</pre>
        <div class="hint">Every command prints what it will read before it starts. Add <code>--help</code> to any of them for the full list.</div></div>
      <div class="card" style="margin-top:14px"><h2>Keyboard</h2><div class="keys"><kbd>/</kbd><span>Search functions (Atlas)</span><kbd>?</kbd><span>Open help</span><kbd>1–6</kbd><span>Switch project tab</span><kbd>⇧ D</kbd><span>Toggle appearance</span></div>
        <div class="hint" style="margin-top:10px"><b>Something wrong?</b> <code>python -m pytest -q</code> in a checkout runs every automated check; <code>lantern analyze . --fail-on medium</code> is the self-audit.</div></div>`
      : `<div class="faq">${list.map(([i, g, qq, a]) => `<div class="qa ${H.open === i ? 'open' : ''}" data-i="${i}"><div class="qh"><span class="g">${esc(g)}</span><span class="q">${esc(qq)}</span><span class="pm">${H.open === i ? '−' : '+'}</span></div>${H.open === i ? `<p>${a}</p>` : ''}</div>`).join('') || '<div class="empty">No question matches. Ask Lantern (bottom right) in your own words.</div>'}</div>`}
    <p class="foot">Still stuck? Press the lantern button bottom-right and ask in your own words. New to all this? <a href="#" id="tolearn2">Learn</a> has a practice app with a step-by-step guide.</p></main>`;
  const hq = el.querySelector('#hq'); hq.oninput = () => { H.q = hq.value; H.cli = false; renderHelp(el); const z = document.getElementById('hq'); z.focus(); z.setSelectionRange(z.value.length, z.value.length); };
  el.querySelector('#hgo').onclick = () => { H.q = hq.value; renderHelp(el); };
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { H.group = b.dataset.g; H.cli = false; renderHelp(el); });
  el.querySelector('#hcli').onclick = () => { H.cli = !H.cli; renderHelp(el); };
  el.querySelectorAll('.qa').forEach(d => d.onclick = () => { const i = +d.dataset.i; H.open = H.open === i ? null : i; renderHelp(el); });
  const tl = el.querySelector('#tolearn2'); if (tl) tl.onclick = e => { e.preventDefault(); go('learn'); };
}

// The logo, the Simple/Advanced switch and the appearance button live in the global header, and move into the project
// bar on project screens (one header row, as designed). They are moved, not copied, so their listeners stay.
function dock(inProject) {
  const top = document.querySelector('header.top'), brand = document.getElementById('home'), nav = document.getElementById('nav');
  const vm = document.getElementById('viewmode'), th = document.getElementById('theme');
  const a = inProject && document.querySelector('.sub [data-dock="brand"]'), b = inProject && document.querySelector('.sub [data-dock="end"]');
  if (a && b) { a.replaceWith(brand); b.replaceWith(vm, th); return; }
  if (brand.parentElement !== top) { top.insertBefore(brand, nav); top.append(vm, th); }
}
function render() {
  const el = document.getElementById('view');
  if (!S.state) { el.innerHTML = '<div class="empty">Loading…</div>'; return; }
  setBackdrop(); drawViewMode(); renderAsk();
  dock(false);
  document.body.classList.toggle('inproj', S.view === 'project');
  if (S.view === 'project') { el.className = ''; return renderProject(el); }
  if (S.view === 'settings') return renderSettings(el);
  if (S.view === 'help') return renderHelp(el);
  if (S.view === 'learn') return renderLearn(el);
  renderHome(el);
}
refresh().catch(e => { document.getElementById('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
