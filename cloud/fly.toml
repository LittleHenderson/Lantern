# Lantern cloud service on Fly.io. Deploy from the REPOSITORY ROOT (the image includes the analysis engine):
#   fly deploy . --config cloud/fly.toml --dockerfile cloud/Dockerfile --depot=false
# Step by step, including the one-time setup: docs/deploy.md, "Cloud service on Fly.io".

app = 'lantern-cloud'
primary_region = 'sjc'

[env]
  LANTERN_GATEWAY_URL = 'https://lantern-gateway.fly.dev/v1'
  LANTERN_PUBLIC_URL = 'https://lantern-cloud.fly.dev'
  LANTERN_CLOUD_RUNS_PER_DAY = '10'
  LANTERN_CLOUD_CONCURRENT_JOBS = '2'
  LANTERN_CLONE_MAX_MB = '200'
  LANTERN_CLOUD_JOB_SECONDS = '600'
  # 0 = results are kept until the person deletes them (owner's decision, 2026-11-03)
  LANTERN_CLOUD_RETENTION_DAYS = '0'
  # Sleep when unused: after 10 minutes with no visitor and no run, the service stops itself and Fly bills
  # (almost) nothing until the next visitor wakes it, which takes a few seconds.
  LANTERN_CLOUD_IDLE_MINUTES = '10'

[[mounts]]
  source = 'lantern_cloud_data'
  destination = '/home/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Fly's own idle stop is off because it could cut a run short; the service stops itself instead, only when no
  # run is going (LANTERN_CLOUD_IDLE_MINUTES). A visitor's request starts it again.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/health'

# A clean stop (the idle sleep) leaves the machine stopped; a crash restarts it.
[[restart]]
  policy = 'on-failure'
  retries = 5

[[vm]]
  # 1 GB covers typical apps. A very large repository (Django-sized) may need 2 GB: `fly scale memory 2048`.
  size = 'shared-cpu-1x'
  memory = '1gb'
