[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-cloud"
version = "0.1.0"
description = "Lantern cloud mode: sign in, paste a repository link, get your report in the browser."
requires-python = ">=3.11"
# The analysis engine (the `lantern` package at the repository root) is installed beside this one; see Dockerfile.
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "PyJWT[crypto]>=2.8"]

[tool.setuptools.packages.find]
include = ["lantern_cloud*"]

[tool.setuptools.package-data]
lantern_cloud = ["site/*"]
