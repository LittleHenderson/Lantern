<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2" id="themecolor">
<meta name="description" content="Paste a link to your app's repository. Lantern maps every path a visitor can take, finds what to fix, and grades it.">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!--__APP_FONTS__-->
<title>Lantern</title>
<style>
/* The Lantern app's own stylesheet (lantern/viewer/app.html), placed here by lantern_cloud/site.py. */
/*__APP_STYLE__*/
</style>
<style>
/* Website additions: only what the app has no class for, made from the same tokens. */
.privacy{max-width:720px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.privacy .choice{margin:0;background:var(--surface);box-shadow:var(--shadow-1)}
.privacy .choice:has(input:checked){background:color-mix(in srgb, var(--accent-soft) 60%, var(--surface))}
.agree{max-width:720px;margin:4px auto 0}
.acct{display:flex;align-items:center;gap:6px}
.acct .who{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--font);cursor:pointer}
.acct .who:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.acct .av{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font:700 12px var(--font);text-transform:uppercase}
.signbtns{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.signbtns .btn{height:46px;border-radius:13px;font-size:15px;justify-content:flex-start;padding:0 16px}
.signbtns .btn svg{width:20px;height:20px;flex:none}
.signbtns .btn span{flex:1;text-align:center;margin-right:20px}
.sheet p{margin:10px 0 0;font-size:14px;line-height:1.6}
.sheet .foot{margin-top:16px;font-size:12.5px;color:var(--muted)}
.progress{max-width:760px}
.progress .card{padding:22px 24px}
.progress .head{display:flex;align-items:flex-start;gap:14px}
.progress .head h1{font-size:26px;margin:0 0 6px;overflow-wrap:anywhere}
.progress .indeterminate{margin:18px 0 6px}
.progress pre.log{margin-top:16px;max-height:300px}
.runmeta{display:flex;gap:16px;flex-wrap:wrap;font:12.5px var(--font);color:var(--muted);margin-top:14px}
.runmeta span{display:inline-flex;align-items:center;gap:6px}.runmeta .ic{width:14px;height:14px}
.app .when{font:12.5px var(--font);color:var(--muted);white-space:nowrap}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
.tag.shared{font:600 10px var(--font);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);border:0;margin-left:6px;vertical-align:middle}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff} .btn.danger:hover{filter:brightness(.95);background:var(--critical)}
.sheet .field{margin-top:14px}.sheet .field input[type=text]{font:13px var(--mono)}
@media (max-width:760px){.privacy{grid-template-columns:1fr}.acct .who .nm{display:none}.acct .who{padding:0 4px}}
</style>
</head>
<body data-mode="simple">
<div id="bg" aria-hidden="true"></div>
<header class="top">
  <button class="brand" id="home" aria-label="Lantern home" title="My runs"><!--__APP_BRAND__--></button>
  <nav id="nav" class="nav" aria-label="Main">
    <button data-v="home" class="on"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.6"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.6"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.6"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.6"/></svg><span>My runs</span></button>
    <button data-v="help"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.5M10 14h.01"/></svg><span>Help</span></button>
  </nav>
  <div class="seg" id="viewmode" title="Simple: plain sentences and one next action. Advanced: every table and panel."><button data-m="simple">Simple</button><button data-m="advanced">Advanced</button></div>
  <button class="iconbtn" id="theme" aria-label="Switch appearance"></button>
  <div class="acct" id="acct"></div>
</header>
<div id="view"></div>
<div id="sheet"></div>
<script>
const VERSION = '__VERSION__';
/*__APP_JS__*/

// ---------------------------------------------------------------- website
// Everything below talks to this service's JSON API (same origin). Every value from it goes through esc() before it
// reaches HTML; ids go into URLs through encodeURIComponent. The sign-in token lives in an HttpOnly cookie that this
// script cannot read; every request that changes something carries X-Lantern-Site, which other sites cannot send.
const api = async (path, opts = {}) => {
  const r = await fetch(path, {method: opts.method || 'GET', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-Lantern-Site': '1'}, body: opts.body ? JSON.stringify(opts.body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((d.error && d.error.message) || 'Lantern did not answer. Try again in a moment.'); e.status = r.status; e.type = d.error && d.error.type; throw e; }
  return d;
};
const S = {view: 'home', me: undefined, runs: null, run: null, tab: 'findings', links: {}, privacy: 'structure', agreed: false, link: '', pending: null, health: null, help: {open: null}};
const ACTIVE = ['queued', 'running'];
const STEPS = [['clone', 'Copy the repository', 'Into a sealed box. Nothing in it is run or installed.'],
               ['audit', 'Check dependency versions', 'Against public security advisories.'],
               ['analyze', 'Map the code and run the checks', 'Every page, route and function a visitor can reach.'],
               ['save', 'Save your results', 'The copy of your code is deleted; only the results stay.']];
const GH = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';
const GO = '<svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>';

document.getElementById('theme').onclick = () => setTheme(THEMES[(THEMES.indexOf(THEME) + 1) % 3]);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
applyTheme();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// ---- Simple / Advanced: kept in this browser; the report (same origin) reads the same key
function viewMode() { try { return localStorage.getItem('lantern.simple') === '0' ? 'advanced' : 'simple'; } catch (e) { return 'simple'; } }
function drawViewMode() {
  const m = innerWidth <= 760 ? 'simple' : viewMode();
  for (const b of document.querySelectorAll('#viewmode button')) b.classList.toggle('on', b.dataset.m === m);
  document.body.dataset.mode = m;
  try { const f = document.querySelector('#pbody iframe'); if (f && f.contentWindow.setSimple) f.contentWindow.setSimple(m === 'simple'); } catch (e) {}
}
document.getElementById('viewmode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  try { localStorage.setItem('lantern.simple', b.dataset.m === 'simple' ? '1' : '0'); } catch (err) {}
  drawViewMode(); render();
};
function simple() { return document.body.dataset.mode !== 'advanced'; }
function setBackdrop() {
  const bg = document.getElementById('bg');
  bg.className = S.view === 'run' ? 'quiet' : '';
  for (const g of bg.querySelectorAll('.graphs')) g.style.display = S.view === 'run' ? 'none' : '';
}

// ---- small helpers
function repoName(link) {
  try { const p = new URL(link).pathname.replace(/^\/+|\/+$/g, '').replace(/\.git$/, '').split('/'); return p.slice(0, 2).join('/') || link; }
  catch (e) { return String(link || ''); }
}
function ago(t) {
  const s = (Date.now() - Date.parse(t)) / 1000; if (!(s >= 0)) return '';
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`; return new Date(t).toLocaleDateString();
}
function lastLine(r) { const l = String(r.log_tail || '').trim().split('\n').pop(); return l || r.stage || 'Waiting for a free worker…'; }
function sentence(sum) {
  // The app's one plain sentence per app, from the run's counts (design 3b).
  if (!sum || sum.score == null) return 'Checked.';
  const c = sum.counts || {}, smaller = (c.high || 0) + (c.medium || 0);
  let s;
  if (c.critical) s = `<b class="bad">${esc(c.critical)} serious problem${c.critical > 1 ? 's' : ''}</b>${smaller ? `, and ${esc(smaller)} smaller one${smaller > 1 ? 's' : ''}` : ''}`;
  else { const bits = []; if (c.high) bits.push(`${c.high} high`); if (c.medium) bits.push(`${c.medium} medium`); s = bits.length ? `No serious problems. <b>${esc(bits.join(' and '))}</b> to look at` : 'No open problems found'; }
  return `${s}. Readiness ${esc(sum.score)} of 100.`;
}
const PRIV = {structure: 'Map and findings only', full: 'With code snippets'};

// ---- account
async function loadMe() {
  try { S.me = await api('/v1/me'); }
  catch (e) { S.me = e.status === 401 ? null : S.me || null; if (e.status !== 401) S.meErr = e.message; }
}
async function loadRuns() { if (!S.me) { S.runs = null; return; } try { S.runs = (await api('/v1/runs')).runs; } catch (e) { if (e.status === 401) { S.me = null; S.runs = null; } } }
function drawAcct() {
  const a = document.getElementById('acct');
  if (S.me === undefined) { a.innerHTML = ''; return; }
  if (!S.me) { a.innerHTML = `<button class="btn primary sm" id="signin">Sign in</button>`; a.querySelector('#signin').onclick = () => signInSheet(); return; }
  const name = String(S.me.label || '').split(':').pop() || 'You';
  a.innerHTML = `<button class="who" id="who" title="Your account"><span class="av">${esc(name.slice(0, 1))}</span><span class="nm">${esc(name)}</span></button>`;
  a.querySelector('#who').onclick = accountSheet;
}
function sheet(html) {
  const w = document.getElementById('sheet');
  if (!html) { w.innerHTML = ''; return null; }
  w.innerHTML = `<div class="sheetwrap"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const wrap = w.firstElementChild;
  wrap.onclick = e => { if (e.target === wrap || e.target.closest('[data-close]')) closeSheet(); };
  return wrap.firstElementChild;
}
function closeSheet() { S.signing = null; sheet(null); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('sheet').innerHTML) closeSheet(); });

async function signInSheet(reason) {
  const el = sheet(`<div class="sh"><h2>Sign in to check apps from a link</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p>${esc(reason || 'Your runs are tied to your account, so only you can open them.')} Lantern keeps your account name and nothing else: no email, no password.</p>
    <div class="signbtns" id="signbtns"><div class="working"><span class="pulse"></span>Loading…</div></div>
    <div id="signmsg"></div><div class="foot">${icon('lock')} You sign in on GitHub or Google directly. Lantern never sees your password.</div>`);
  let ps = [];
  try { ps = (await api('/v1/signin/providers')).providers; } catch (e) { el.querySelector('#signbtns').innerHTML = note('err', esc(e.message)); return; }
  const btns = el.querySelector('#signbtns');
  if (!ps.length) { btns.innerHTML = note('warn', 'Sign-in is not switched on for this server yet.'); return; }
  btns.innerHTML = ps.map(p => `<button class="btn ${p === 'github' ? 'primary' : ''}" data-p="${esc(p)}">${p === 'github' ? GH : GO}<span>Continue with ${p === 'github' ? 'GitHub' : 'Google'}</span></button>`).join('');
  btns.querySelectorAll('[data-p]').forEach(b => b.onclick = () => startSignIn(b.dataset.p, el));
}
async function startSignIn(provider, el) {
  // Open the tab first (inside the click), then point it at the sign-in page: phones block tabs opened later.
  const w = window.open('', '_blank');
  const msg = el.querySelector('#signmsg');
  try {
    const r = await api('/v1/signin/start', {method: 'POST', body: {provider}});
    if (w) { w.opener = null; w.location.href = r.url; } else location.href = r.url;
  } catch (e) { if (w) w.close(); msg.innerHTML = note('err', esc(e.message)); return; }
  el.querySelector('#signbtns').innerHTML = `<div class="working"><span class="pulse"></span>Finish signing in on the ${provider === 'github' ? 'GitHub' : 'Google'} tab. This page notices by itself.</div><div class="indeterminate"></div>`;
  const token = {}; S.signing = token; const until = Date.now() + 10 * 60 * 1000;
  const poll = async () => {
    if (S.signing !== token) return;
    if (Date.now() > until) { msg.innerHTML = note('warn', 'That took too long. Close this and sign in again.'); return; }
    try {
      const r = await api('/v1/signin/poll', {method: 'POST'});
      if (r.signed_in) { S.signing = null; closeSheet(); await afterSignIn(); return; }
    } catch (e) { if (e.status !== 503) { msg.innerHTML = note('err', esc(e.message)); return; } }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 1500);
}
async function afterSignIn() {
  await loadMe(); await loadRuns(); render();
  if (S.pending) { const p = S.pending; S.pending = null; startRun(p.link, p.privacy, p.agreed); }
}
async function accountSheet() {
  const me = S.me, name = String(me.label || '').split(':').pop(), via = {github: 'GitHub', google: 'Google', token: 'a Lantern token'}[me.account] || me.account;
  const el = sheet(`<div class="sh"><h2>${esc(name)}</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p>Signed in with ${esc(via)}. You have used <b>${esc(me.runs_today)}</b> of today's ${esc(me.limits.runs_per_day)} checks.</p>
    <p class="muted small">Your results are private to this account and stay until you delete them. Nothing is shared unless you click Share on a run.</p>
    <div class="row" style="margin-top:18px"><button class="btn quiet" id="delme">${icon('trash')}Delete my account</button><span class="spacer"></span><button class="btn" data-close>Close</button><button class="btn primary" id="signout">Sign out</button></div>`);
  el.querySelector('#delme').onclick = deleteMeSheet;
  el.querySelector('#signout').onclick = async () => { try { await api('/v1/signout', {method: 'POST'}); } catch (e) {} S.me = null; S.runs = null; S.links = {}; closeSheet(); go('home'); };
}

// ---- share, delete
const SHARE_IC = '<svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.8-2.8a3 3 0 0 0-4.2-4.2l-1 1M11.5 8.5a3 3 0 0 0-4.2 0l-2.8 2.8a3 3 0 0 0 4.2 4.2l1-1"/></svg>';
function patchRun(r) { S.runs = (S.runs || []).map(x => x.id === r.id ? {...x, ...r} : x); if (S.run && S.run.id === r.id) S.run = {...S.run, ...r}; }
async function shareSheet(r) {
  const draw = (st, msg) => {
    const el = sheet(`<div class="sh"><h2>${st.shared ? 'Anyone with this link can open the report' : 'Share this report?'}</h2><button class="x" data-close aria-label="Close">×</button></div>
      ${st.shared ? `<div class="field" style="margin-top:16px">${SHARE_IC}<input type="text" id="shareurl" value="${esc(st.url)}" readonly aria-label="Share link"><button class="btn sm" id="copy">${icon('copy')}Copy</button></div>
          <p class="muted small">The link opens the report, the evidence page and the badge, read-only. It works until you stop sharing; then it shows "This link is off".</p>`
        : `<p>Lantern makes a link that opens this report, its evidence page and its badge, for anyone who has it. Nobody needs to sign in. You can stop sharing at any time.</p>
          ${note('warn', 'Findings can include passwords or keys Lantern found in your code (partly hidden), and where your app is weakest. Share with people you trust, or fix those first.')}
          <p class="muted small">${r.privacy === 'full' ? 'This run kept short code snippets, so the report shows them.' : 'This run kept no code: the report names files and lines only.'}</p>`}
      <div id="sharemsg">${msg || ''}</div>
      <div class="row" style="margin-top:18px">${st.shared ? '<button class="btn quiet" id="unshare">Stop sharing</button>' : ''}<span class="spacer"></span><button class="btn" data-close>${st.shared ? 'Done' : 'Cancel'}</button>${st.shared ? '' : `<button class="btn primary" id="doshare">${SHARE_IC}Create link</button>`}</div>`);
    const set = async (on) => {
      try { const n = await api(`/v1/runs/${encodeURIComponent(r.id)}/share`, {method: on ? 'POST' : 'DELETE'}); r.shared = n.shared; patchRun({id: r.id, shared: n.shared}); draw(n, on ? '' : note('ok', 'Sharing is off. The old link no longer opens anything.')); const b = document.querySelector('#share span'); if (b) b.textContent = n.shared ? 'Shared' : 'Share'; }
      catch (e) { el.querySelector('#sharemsg').innerHTML = note('err', esc(e.message)); }
    };
    const d = el.querySelector('#doshare'); if (d) d.onclick = () => set(true);
    const u = el.querySelector('#unshare'); if (u) u.onclick = () => set(false);
    const c = el.querySelector('#copy'); if (c) c.onclick = async () => {
      const i = el.querySelector('#shareurl'); i.select();
      try { await navigator.clipboard.writeText(i.value); c.innerHTML = icon('check') + 'Copied'; } catch (e) { c.innerHTML = 'Press Ctrl+C'; }
    };
  };
  sheet(`<div class="working"><span class="pulse"></span>Loading…</div>`);
  try { draw(await api(`/v1/runs/${encodeURIComponent(r.id)}/share`)); } catch (e) { sheet(`<div class="sh"><h2>Share</h2><button class="x" data-close aria-label="Close">×</button></div>${note('err', esc(e.message))}`); }
}
function deleteSheet(r) {
  const el = sheet(`<div class="sh"><h2>Delete ${esc(repoName(r.link))}?</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p>This deletes the run, its report and its results from Lantern's server${r.shared ? ', and turns its share link off' : ''}. It can't be undone. Your repository is not touched.</p>
    <div id="delmsg"></div>
    <div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn danger" id="dodel">${icon('trash')}Delete</button></div>`);
  el.querySelector('#dodel').onclick = async () => {
    try {
      await api('/v1/runs/' + encodeURIComponent(r.id), {method: 'DELETE'});
      S.runs = (S.runs || []).filter(x => x.id !== r.id); delete S.links[r.id]; if (S.run && S.run.id === r.id) S.run = null; S.frame = null;
      closeSheet(); if (S.view === 'run') go('home'); else render();
    } catch (e) { el.querySelector('#delmsg').innerHTML = note('err', esc(e.message)); }
  };
}
function deleteMeSheet() {
  const n = (S.runs || []).length;
  const el = sheet(`<div class="sh"><h2>Delete your Lantern account?</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p>This deletes everything Lantern's cloud keeps about you: <b>${esc(n)} run${n === 1 ? '' : 's'}</b>, their reports and results, every share link, and your account name. It can't be undone.</p>
    <p class="muted small">Your GitHub or Google account is not touched. Signing in again later starts a fresh, empty account here.</p>
    <label class="check"><input type="checkbox" id="sure"><span>Yes, delete my account and all my results</span></label>
    <div id="delmsg"></div>
    <div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn danger" id="dodel" disabled>${icon('trash')}Delete everything</button></div>`);
  const sure = el.querySelector('#sure'), go2 = el.querySelector('#dodel');
  sure.onchange = () => { go2.disabled = !sure.checked; };
  go2.onclick = async () => {
    try { await api('/v1/me', {method: 'DELETE'}); S.me = null; S.runs = null; S.links = {}; S.run = null; closeSheet(); go('home'); render(); }
    catch (e) { el.querySelector('#delmsg').innerHTML = note('err', esc(e.message)); }
  };
}

// ---- starting a run
async function startRun(link, privacy, agreed) {
  const err = document.getElementById('adderr');
  if (!S.me) { S.pending = {link, privacy, agreed}; return signInSheet('Sign in, and Lantern checks this link straight after.'); }
  try {
    const r = await api('/v1/repos', {method: 'POST', body: {link, privacy, stored_snippets_ok: privacy === 'full' && agreed === true}});
    S.link = ''; S.run = r; S.runs = [r, ...(S.runs || []).filter(x => x.id !== r.id)];
    location.hash = '#/run/' + encodeURIComponent(r.id);
  } catch (e) {
    if (e.status === 401) { S.me = null; S.pending = {link, privacy, agreed}; drawAcct(); return signInSheet('Your sign-in has expired. Sign in again, and Lantern checks this link straight after.'); }
    if (err) err.innerHTML = note(e.status === 429 ? 'warn' : 'err', esc(e.message));
  }
}
function addBox() {
  const full = S.privacy === 'full';

      <label class="choice"><input type="radio" name="priv" value="full" ${full ? 'checked' : ''}><span><b>Include code snippets</b>The report shows the lines it talks about. Those short snippets are kept with your results.</span></label></div>
    ${full ? `<div class="agree"><label class="check"><input type="checkbox" id="agreed" ${S.agreed ? 'checked' : ''}><span>I agree that short snippets of this repository's code are stored on Lantern's server with my results, until I delete them.</span></label></div>` : ''}

function addControls(el) {
  const input = el.querySelector('#link');
  if (input) {
    input.oninput = () => { S.link = input.value; };
    input.onkeydown = e => { if (e.key === 'Enter') el.querySelector('#add').click(); };
    el.querySelectorAll('input[name=priv]').forEach(r => r.onchange = () => { S.privacy = r.value; render(); });
    const ag = el.querySelector('#agreed'); if (ag) ag.onchange = () => { S.agreed = ag.checked; };
    el.querySelector('#add').onclick = () => {
      const link = input.value.trim(), err = el.querySelector('#adderr');
      if (!link) { input.focus(); return; }
      if (!/^https:\/\//i.test(link) && !/^git@/.test(link)) { err.innerHTML = note('warn', 'Paste the https link of a public repository, such as https://github.com/owner/name.'); return; }
      if (S.privacy === 'full' && !S.agreed) { err.innerHTML = note('warn', 'Tick the box to agree to keeping snippets, or choose <b>Map and findings only</b>.'); return; }
      err.innerHTML = ''; startRun(link, S.privacy, S.agreed);
    };
  }
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab || 'findings'; location.hash = '#/run/' + encodeURIComponent(b.dataset.open); });
  el.querySelectorAll('[data-again]').forEach(b => b.onclick = () => {
    // Again, with the same privacy the person chose (and agreed to) for this repository last time.
    const r = (S.runs || []).find(x => x.id === b.dataset.again) || (S.run && S.run.id === b.dataset.again ? S.run : null); if (!r) return;
    startRun(r.link, r.privacy, r.privacy === 'full');
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const r = (S.runs || []).find(x => x.id === b.dataset.del) || (S.run && S.run.id === b.dataset.del ? S.run : null); if (r) deleteSheet(r); });
  el.querySelectorAll('[data-signin]').forEach(b => b.onclick = e => { e.preventDefault(); signInSheet(); });
}

// ---- one run: live progress, then the report
const RUN_TABS = {atlas: 'map', findings: 'findings', prot: 'prot', ready: 'ready'};
async function viewLinks(r) {
  const have = S.links[r.id];
  if (have && have.until > Date.now() + 60000) return have;
  const v = await api(`/v1/runs/${encodeURIComponent(r.id)}/view`, {method: 'POST'});
  const rel = u => { try { const x = new URL(u, location.href); return x.origin === location.origin ? x.pathname + x.search : null; } catch (e) { return null; } };
  return (S.links[r.id] = {report: rel(v.report), evidence: rel(v.evidence), until: Date.now() + v.expires_in * 1000});
}
function subBar(r, tabs) {
  const s = r.summary || {}, c = s.counts || {}, nf = (c.critical || 0) + (c.high || 0) + (c.medium || 0), sm = simple();
  const W = sm ? {atlas: 'Paths', findings: 'What to fix', prot: 'What protects you', ready: 'Ready to ship?', evidence: 'Report'}
               : {atlas: 'Atlas', findings: 'Findings', prot: 'Protections', ready: 'Readiness', evidence: 'Evidence'};
  const tab = t => `<button data-t="${t}" class="${S.tab === t ? 'on' : ''}">${W[t]}${t === 'findings' && nf ? `<span class="n ${c.critical ? 'crit' : ''}">${esc(nf)}</span>` : ''}</button>`;
  return `<div class="sub"><button class="back" id="back" aria-label="Back to my runs">${icon('back')}</button><span class="title">${esc(repoName(r.link))}</span>
    ${r.status === 'done' && s.grade ? `<span class="gchip ${tone(s.grade)}" title="Readiness ${esc(s.score)}/100">${esc(s.grade)}${sm ? '' : ' · ' + esc(s.score)}</span>` : ''}
    ${tabs ? `<div class="tabs" role="tablist">${['atlas', 'findings', 'prot', 'ready', 'evidence'].map(tab).join('')}</div>` : ''}
    <span class="spacer"></span>${tabs ? `<button class="btn sm" id="share">${SHARE_IC}<span>${r.shared ? 'Shared' : 'Share'}</span></button><a class="btn ghost sm newtab" id="newtab" target="_blank" rel="noopener" href="#">${icon('open')}<span>Open in new tab</span></a><button class="btn quiet sm" data-del="${esc(r.id)}" title="Delete this run and its results" aria-label="Delete this run">${icon('trash')}</button>` : ''}</div>`;
}
async function renderRun(el, id) {
  let r = S.run && S.run.id === id ? S.run : null;
  if (!r) {
    el.innerHTML = '<main><div class="empty">Loading…</div></main>';
    try { r = S.run = await api('/v1/runs/' + encodeURIComponent(id)); }
    catch (e) { el.innerHTML = `<main style="max-width:760px">${note('err', esc(e.status === 401 ? 'Sign in to open your runs.' : e.message))}<p><a href="#/">Back to my runs</a></p></main>`; if (e.status === 401) signInSheet(); return; }
    if (S.view !== 'run' || S.runId !== id) return;
  }
  if (r.status === 'done') return renderReport(el, r);
  renderProgress(el, r);
}
function renderProgress(el, r) {
  const run = ACTIVE.includes(r.status), at = STEPS.findIndex(s => s[0] === r.step);
  const steps = STEPS.map(([k, t, d], i) => {
    const cls = !run ? (r.status === 'done' || i < at ? 'done' : '') : i < at ? 'done' : i === at ? 'now' : '';
    return `<div class="st ${cls}"><span class="dot">${cls === 'done' ? icon('check') : ''}</span><div><b>${esc(t)}</b>${esc(d)}</div></div>`;
  }).join('');
  el.innerHTML = `${subBar(r, false)}<main class="progress"><div class="card">
    <div class="head"><div style="flex:1;min-width:0"><span class="eyebrow">${run ? (r.status === 'queued' ? 'Waiting for a free worker' : 'Checking now') : r.status === 'blocked' ? 'Stopped by a safety rule' : 'This check stopped'}</span>
      <h1>${esc(repoName(r.link))}</h1><p class="lede">${run ? 'This usually takes about a minute. You can leave this page; the check keeps going and appears in My runs.' : esc(r.error || 'The check did not finish.')}</p></div>${ring(null)}</div>
    ${run ? '<div class="indeterminate"></div>' : ''}
    <div class="running-steps">${steps}</div>
    <pre class="log" id="runlog">${esc(r.log_tail || '')}</pre>
    <div class="runmeta"><span>${icon('lock')}${esc(PRIV[r.privacy] || r.privacy)}</span><span>${icon('cloud')}${esc(r.host)}</span><span>${icon('clock')}Started ${esc(ago(r.started || r.created))}</span></div>
    ${run ? '' : `<div class="row" style="margin-top:18px"><button class="btn primary" data-again="${esc(r.id)}">Try again</button><a class="btn ghost" href="#/">Back to my runs</a></div>`}
  </div></main>`;
  el.querySelector('#back').onclick = () => go('home');
  addControls(el);
  if (run) follow(r.id);
}
function follow(id) {
  if (S.stream && S.stream.id === id) return;
  stopFollow();
  const es = new EventSource('/v1/runs/' + encodeURIComponent(id) + '/stream');
  S.stream = {id, es};
  let first = true;
  es.addEventListener('log', e => {
    const log = document.getElementById('runlog'); if (!log || S.runId !== id) return;
    if (first) { log.textContent = ''; first = false; }
    let line = ''; try { line = JSON.parse(e.data); } catch (x) { return; }
    log.textContent += (log.textContent ? '\n' : '') + line; log.scrollTop = log.scrollHeight;
    if (/^· /.test(line)) api('/v1/runs/' + encodeURIComponent(id)).then(r => { if (S.runId === id && ACTIVE.includes(r.status)) { S.run = r; const keep = log.textContent; renderProgress(document.getElementById('view'), r); const l2 = document.getElementById('runlog'); if (l2) { l2.textContent = keep; l2.scrollTop = l2.scrollHeight; } } }).catch(() => {});
  });
  es.addEventListener('end', e => {
    stopFollow();
    let r = null; try { r = JSON.parse(e.data); } catch (x) {}
    if (r && r.id === id) { S.run = r; S.runs = (S.runs || []).map(x => x.id === id ? r : x); loadMe().then(drawAcct); if (S.runId === id) render(); }
  });
  es.onerror = () => { /* the browser reconnects by itself; a finished run answers with its end event */ };
}
function stopFollow() { if (S.stream) { S.stream.es.close(); S.stream = null; } }
async function renderReport(el, r) {
  if (!['atlas', 'findings', 'prot', 'ready', 'evidence'].includes(S.tab)) S.tab = 'findings';
  const old = S.frame && S.frame.rid === r.id ? S.frame.el : null;
  el.innerHTML = `${subBar(r, true)}<div id="pbody"></div>`;
  el.querySelector('#back').onclick = () => go('home');
  el.querySelector('#share').onclick = () => shareSheet(r);
  addControls(el);
  el.querySelectorAll('.sub [data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderReport(el, r); });
  const body = el.querySelector('#pbody');
  let links;
  try { links = await viewLinks(r); } catch (e) { body.innerHTML = `<main>${note('err', esc(e.message))}</main>`; return; }
  if (S.runId !== r.id) return;
  const nt = el.querySelector('#newtab'); if (nt) nt.href = S.tab === 'evidence' ? links.evidence : links.report;
  if (S.tab === 'evidence') {
    body.innerHTML = `<iframe title="Evidence Report"></iframe>`;
    const f = body.querySelector('iframe'); f.onload = () => { try { themeOn(f.contentDocument); } catch (err) {} }; f.src = links.evidence;
    return;
  }
  const want = RUN_TABS[S.tab];
  if (old && old.contentDocument && old.contentDocument.querySelector('#tabs')) {
    // Same run: keep the loaded report and switch its tab, so the map's selection and zoom survive (as in the app).
    body.appendChild(old); try { old.contentDocument.querySelector(`#tabs [data-t="${want}"]`)?.click(); } catch (err) {}
    return;
  }
  body.innerHTML = `<iframe title="Report"></iframe>`;
  const fr = body.querySelector('iframe'); S.frame = {rid: r.id, el: fr};
  fr.onload = () => { try { const d = fr.contentDocument; themeOn(d); d.body.classList.add('embed'); d.querySelector(`#tabs [data-t="${RUN_TABS[S.tab] || 'findings'}"]`)?.click(); } catch (err) {} };
  fr.src = links.report;
}

// ---- routing
function go(view) { location.hash = view === 'help' ? '#/help' : '#/'; }
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
document.getElementById('home').onclick = () => go('home');
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const m = /^run\/([A-Za-z0-9_-]{1,40})$/.exec(h);
  const prev = S.runId;
  S.view = m ? 'run' : h === 'help' ? 'help' : 'home';
  S.runId = m ? m[1] : null;
