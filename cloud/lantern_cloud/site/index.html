<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2" id="themecolor">
<meta name="description" content="Paste a link to your app's repository. Lantern maps every path a visitor can take, finds what to fix, and grades it.">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">

<title>Lantern</title>
<style>
/* The Lantern app's own stylesheet (lantern/viewer/app.html), placed here by lantern_cloud/site.py. */
/*__APP_STYLE__*/
</style>
<style>
/* Website additions: only what the app has no class for, made from the same tokens. */
.people{display:grid;gap:8px;max-width:720px}
.person{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.person .av{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font:700 13px var(--font);text-transform:uppercase;flex:none}
.person .nm{font:600 15px var(--font);color:var(--ink);overflow-wrap:anywhere}
.layers{display:grid;gap:8px;margin-top:14px}
.layer{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.layer input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.layer b{display:block;font:600 15px var(--font);color:var(--ink)}
.layer span{font-size:13.5px;color:var(--muted)}
.sheet .onb .picks{max-width:none}
/* Where the findings are: the four stack stops (the report's stack strip), one cell each with its count and word.
   The run table gets one more column for it; the columns the app hides on narrower screens shift by one. */
.ptable .r{grid-template-columns:180px 140px 132px 40px 40px 40px 44px 244px 52px 84px minmax(150px,1fr)}
@media (min-width:1181px){.ptable .r{min-width:1180px}}
@media (max-width:1180px){.ptable .r{grid-template-columns:180px 132px 40px 40px 40px 44px 244px 112px minmax(150px,1fr)}.ptable .r > :nth-child(2),.ptable .r > :nth-child(9){display:none}.ptable .r > :nth-child(8){display:block}}
@media (max-width:1000px){.ptable .r{grid-template-columns:minmax(140px,1fr) 120px 40px 40px 40px 44px 244px minmax(150px,auto)}.ptable .r > :nth-child(10){display:none}.ptable .r > :nth-child(9){display:none}}
.where{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.where .lw{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;border-radius:6px;background:var(--surface-2);color:var(--faint);font:500 10.5px/1.15 var(--font);white-space:nowrap;cursor:help}
.where .lw b{font:600 13px/1.2 var(--font);font-variant-numeric:tabular-nums}
.where .lw.has{color:var(--ink-2)} .where .lw.has b{color:var(--ink)}
.where .lw.t-critical{background:var(--critical-soft);color:var(--crit-ink)} .where .lw.t-critical b{color:var(--crit-ink)}
.where .lw.t-high{background:var(--serious-soft)} .where .lw.t-medium{background:var(--warning-soft)}
.ptable .r.h .whead{display:flex;gap:6px;align-items:center} .ptable .r.h .whead i{font-style:normal;color:var(--faint)}
.app .where{margin:2px 0 10px}
.app .wherecap{font:600 11px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.privacy{max-width:720px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.privacy .choice{margin:0;background:var(--surface);box-shadow:var(--shadow-1)}
.privacy .choice:has(input:checked){background:color-mix(in srgb, var(--accent-soft) 60%, var(--surface))}
.agree{max-width:720px;margin:4px auto 0}
.acct{display:flex;align-items:center;gap:6px}
.acct .who{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--font);cursor:pointer}
.acct .who:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.acct .av{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font:700 12px var(--font);text-transform:uppercase}
.signbtns{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.signbtns .btn{height:46px;border-radius:13px;font-size:15px;justify-content:flex-start;padding:0 16px}
.signbtns .btn svg{width:20px;height:20px;flex:none}
.signbtns .btn span{flex:1;text-align:center;margin-right:20px}
.sheet p{margin:10px 0 0;font-size:14px;line-height:1.6}
.sheet .foot{margin-top:16px;font-size:12.5px;color:var(--muted)}
.progress{max-width:760px}
.progress .card{padding:22px 24px}
.progress .head{display:flex;align-items:flex-start;gap:14px}
.progress .head h1{font-size:26px;margin:0 0 6px;overflow-wrap:anywhere}
.progress .indeterminate{margin:18px 0 6px}
.progress pre.log{margin-top:16px;max-height:300px}
.runmeta{display:flex;gap:16px;flex-wrap:wrap;font:12.5px var(--font);color:var(--muted);margin-top:14px}
.runmeta span{display:inline-flex;align-items:center;gap:6px}.runmeta .ic{width:14px;height:14px}
.app .when{font:12.5px var(--font);color:var(--muted);white-space:nowrap}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
.tag.shared{font:600 10px var(--font);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);border:0;margin-left:6px;vertical-align:middle}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff} .btn.danger:hover{filter:brightness(.95);background:var(--critical)}
.sheet .field{margin-top:14px}.sheet .field input[type=text]{font:13px var(--mono)}
#xtoast{position:fixed;left:20px;bottom:20px;z-index:55;max-width:min(440px,calc(100vw - 110px))}
#xtoast .toastin .indeterminate{margin-top:8px}
#xtoast .toastin .ln{font:11.5px var(--mono);color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet ul.sendlist{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.6}.sheet ul.sendlist li{margin-top:6px}
.sub #explain[disabled]{opacity:.75;cursor:default}
@media (max-width:760px){#xtoast{left:12px;bottom:84px;max-width:calc(100vw - 24px)}.sub #explain span,.sub #share span{display:none}}
.dropzone.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ghrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;max-width:720px;margin:12px auto 0;font:13px var(--font);color:var(--muted)}
.ghrow .btn svg,#connectgh svg{width:15px;height:15px;flex:none}.ghrow .btn .ic{width:13px;height:13px;opacity:.6}
.samples{margin-top:40px}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sample{display:flex;flex-direction:column;border-radius:18px}
.sample .k{font:600 11.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sample h3{font:600 16.5px/1.3 var(--font);margin:0 0 4px}
.sample .stack{font:12px var(--mono);color:var(--muted);margin-bottom:10px}
.sample p{margin:0 0 14px;font:13.5px/1.55 var(--font);color:var(--ink-2);flex:1}
.sample .btn{align-self:flex-start}
@media (max-width:1000px){.sgrid{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.privacy{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr}.acct .who .nm{display:none}.acct .who{padding:0 4px}}
/* The 20-second intro (the landing page's, from site/intro): plays on every visit to the home page; a link to a run,
   to Help, or ?intro=0 skips it. While it shows, the page under it does not paint or take focus. */
#intro{position:fixed;inset:0;z-index:90;background:#0E0E10;transition:opacity .9s ease,visibility .9s}
#intro.fading{opacity:0}#intro.hidden{opacity:0;visibility:hidden}
#intro:not(.hidden):not(.fading) ~ *{visibility:hidden}
#stage{position:absolute;inset:0}
#skipzone{position:absolute;left:0;right:0;top:0;bottom:44px;z-index:2;cursor:pointer}
#introbar{position:absolute;top:18px;right:20px;z-index:3;display:flex;gap:8px;align-items:center}
.pillbtn{height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(14,14,16,.6);color:#BEBEC3;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font:500 13px var(--font);white-space:nowrap;backdrop-filter:blur(6px)}
.pillbtn:hover{color:#F3F3F1;border-color:rgba(255,255,255,.35)}
.pillbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#introend{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px clamp(48px,10vh,96px);text-align:center;gap:18px;opacity:0;transition:opacity .6s ease .2s;pointer-events:none}
#introend.on{opacity:1;pointer-events:auto}
#introend[hidden]{display:none}
#introend .end-tag{margin:0;font:500 clamp(17px,1.6vw,22px)/1.4 var(--font);color:#BEBEC3}
#introend .end-ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#introend .cta{height:54px;padding:0 26px;border-radius:14px;border:0;cursor:pointer;font:600 16px var(--font);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;background:#F3F3F1;color:#0E0E10;box-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(255,170,60,.35)}
#introend .cta.alt{background:transparent;color:#F3F3F1;border:1px solid rgba(255,255,255,.22);box-shadow:none}
#introend .end-fine{margin:0;font:13px var(--font);color:#8C8C92}
@media (max-width:520px){#introend .end-ctas{flex-direction:column;align-items:stretch;width:100%;max-width:320px}#introbar{top:12px;right:12px}}
.dropzone.hi{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
</style>
</head>
<body data-mode="simple">
<div id="intro" class="" aria-label="Intro">
  <div id="stage"></div>
  <div id="skipzone" title="Click anywhere to skip"></div>
  <div id="introbar">
    <button class="pillbtn" id="soundbtn" title="Unmute (subtle tones)"><svg viewBox="0 0 20 20"><path d="M3 8v4h3l4 3V5L6 8z"/><path id="snd-on" d="M13 7.5a3.5 3.5 0 0 1 0 5M15 5a7 7 0 0 1 0 10" style="display:none"/><path id="snd-off" d="M13 8l4 4M17 8l-4 4"/></svg><span id="soundlabel">Sound off</span></button>
    <button class="pillbtn" id="skipbtn">Skip intro</button>
  </div>
  <div id="introend" hidden>
    <p class="end-tag">Build with vibes. Ship with confidence.</p>
    <div class="end-ctas">
      <button class="cta" id="end-start">Add your app</button>
      <button class="cta alt" id="end-sample">Try a sample app first</button>
    </div>
    <p class="end-fine">Checked in a sealed box. Your copy is deleted when the check ends.</p>
  </div>
</div>
<script>
// A link to a run, Help or Settings, or ?intro=0, goes straight to the page: hide the overlay before anything paints.
{ const h = location.hash.replace(/^#\/?/, ''); if (h || new URLSearchParams(location.search).get('intro') === '0') { const i = document.getElementById('intro'); i.style.transition = 'none'; i.className = 'hidden'; } }
</script>
<div id="bg" aria-hidden="true"></div>
<header class="top">
  <button class="brand" id="home" aria-label="Lantern home" title="Lantern home"><!--__APP_BRAND__--></button>
  <nav id="nav" class="nav" aria-label="Main">
    <button data-v="home" class="on" aria-label="My runs"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5.5" height="5.5" rx="1.6"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.6"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.6"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.6"/></svg><span>My runs</span></button>
    <button data-v="team" id="navteam" aria-label="Team" hidden><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/><circle cx="14" cy="7.8" r="2.2"/><path d="M13.6 11.8c1.9.1 3.3 1.4 3.9 3.6"/></svg><span>Team</span></button>
    <button data-v="help" aria-label="Help"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.5M10 14h.01"/></svg><span>Help</span></button>
    <button data-v="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg><span>Settings</span></button>
  </nav>
  <div class="seg" id="viewmode" title="Simple: plain sentences and one next action. Advanced: every table and panel."><button data-m="simple">Simple</button><button data-m="advanced">Advanced</button></div>
  <button class="iconbtn" id="theme" aria-label="Switch appearance"></button>
  <div class="acct" id="acct"></div>
</header>
<div id="view"></div>
<div id="xtoast" aria-live="polite"></div>
<div id="ask"></div>
<div id="sheet"></div>
<script>
const VERSION = '__VERSION__';
/*__APP_JS__*/

// ---------------------------------------------------------------- website
// Everything below talks to this service's JSON API (same origin). Every value from it goes through esc() before it
// reaches HTML; ids go into URLs through encodeURIComponent. The sign-in token lives in an HttpOnly cookie that this
// script cannot read; every request that changes something carries X-Lantern-Site, which other sites cannot send.
const api = async (path, opts = {}) => {
  const r = await fetch(path, {method: opts.method || 'GET', credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-Lantern-Site': '1'}, body: opts.body ? JSON.stringify(opts.body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error((d.error && d.error.message) || 'Lantern did not answer. Try again in a moment.'); e.status = r.status; e.type = d.error && d.error.type; throw e; }
  return d;
};
const S = {view: 'home', addMsg: null, starting: null, me: undefined, runs: null, run: null, tab: 'findings', links: {}, privacy: savedPrivacy(), agreed: false, link: '', pending: null, health: null, help: {open: null}, samples: []};
// What a new check keeps, chosen in Settings and kept in this browser (snippets still need the tick on each check).
function savedPrivacy() { try { return localStorage.getItem('lantern.privacy') === 'full' ? 'full' : 'structure'; } catch (e) { return 'structure'; } }
const SAMPLE = 'lantern:sample/';   // a run's link for one of Lantern's built-in sample apps
const UPLOAD = 'lantern:upload/';   // a run's link for an app uploaded from the person's computer (a label, not a path)
const ACTIVE = ['queued', 'running'];
const STEPS = [['clone', 'Copy the repository', 'Into a sealed box. Nothing in it is run or installed.'],
               ['audit', 'Check dependency versions', 'Against public security advisories.'],
               ['analyze', 'Map the code and run the checks', 'Every page, route and function a visitor can reach.'],
               ['save', 'Save your results', 'The copy of your code is deleted; only the results stay.']];
const PLAIN_STEPS = {clone: ['Make a private copy', 'Into a sealed box. Nothing in it is run or installed.'],
                     unpack: ['Open what you uploaded', 'Into a sealed box. Nothing in it is run or installed.'],
                     audit: ['Check the parts your app borrows', 'Outside code your app uses, against known security problems.'],
                     analyze: ['Map your app and look for problems', 'Every page and path a visitor can reach.'],
                     save: ['Save your results', 'The copy is deleted; only the results stay.']};
// A small Why? button (directive: user first): the detail behind a line opens in place, on demand.
const why = (inner, label = 'Why?') => inner ? `<details class="why"><summary>${esc(label)}</summary><div class="whybody">${inner}</div></details>` : '';
const GH = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';
const GO = '<svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>';

document.getElementById('theme').onclick = () => { setTheme(THEMES[(THEMES.indexOf(THEME) + 1) % 3]); if (S.view === 'settings') render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
applyTheme();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// ---- Simple / Advanced: kept in this browser; the report (same origin) reads the same key
function viewMode() { try { return localStorage.getItem('lantern.simple') === '0' ? 'advanced' : 'simple'; } catch (e) { return 'simple'; } }
function drawViewMode() {
  const m = innerWidth <= 760 ? 'simple' : viewMode();
  for (const b of document.querySelectorAll('#viewmode button')) b.classList.toggle('on', b.dataset.m === m);
  document.body.dataset.mode = m;
  try { const f = document.querySelector('#pbody iframe'); if (f && f.contentWindow.setSimple) f.contentWindow.setSimple(m === 'simple'); } catch (e) {}
}
document.getElementById('viewmode').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  try { localStorage.setItem('lantern.simple', b.dataset.m === 'simple' ? '1' : '0'); } catch (err) {}
  drawViewMode(); render();
};
function simple() { return document.body.dataset.mode !== 'advanced'; }
function setBackdrop() {
  const bg = document.getElementById('bg');
  bg.className = S.view === 'run' ? 'quiet' : '';
  for (const g of bg.querySelectorAll('.graphs')) g.style.display = S.view === 'run' ? 'none' : '';
}

// ---- small helpers
function sampleTitle(id) { const x = (S.samples || []).find(v => v.id === id); return x && x.title ? String(x.title) : id; }
function repoName(link) {
  if (String(link || '').startsWith(SAMPLE)) return 'Sample: ' + sampleTitle(String(link).slice(SAMPLE.length));
  if (String(link || '').startsWith(UPLOAD)) return String(link).slice(UPLOAD.length) || 'Uploaded app';
  try { const p = new URL(link).pathname.replace(/^\/+|\/+$/g, '').replace(/\.git$/, '').split('/'); return p.slice(0, 2).join('/') || link; }
  catch (e) { return String(link || ''); }
}
function ago(t) {
  const s = (Date.now() - Date.parse(t)) / 1000; if (!(s >= 0)) return '';
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`; return new Date(t).toLocaleDateString();
}
// "1:05" since an ISO time; the ticker below rewrites every [data-since] each second, so a check in progress always
// shows something changing on screen, even with animations off.
function elapsed(t) { const s = Math.max(0, Math.floor((Date.now() - Date.parse(t)) / 1000)); return isFinite(s) ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : ''; }
const since = (t, label) => t ? `<span class="elapsed" data-since="${esc(t)}" data-label="${esc(label)}">${esc(label)} ${esc(elapsed(t))}</span>` : '';
setInterval(() => document.querySelectorAll('[data-since]').forEach(e => { e.textContent = `${e.dataset.label} ${elapsed(e.dataset.since)}`; }), 1000);
function lastLine(r) { const l = String(r.log_tail || '').trim().split('\n').pop(); return l || r.stage || 'Waiting for a free worker…'; }
// The four parts of the stack, as the report names them (lanes.py; Screen and App for phone apps).
const LANE_KEYS = ['browser', 'frontend', 'server', 'data'];
function laneWords(phone) { return phone ? {browser: 'Screen', frontend: 'App', server: 'Server', data: 'Data'} : {browser: 'Browser', frontend: 'Frontend', server: 'Server', data: 'Data'}; }
function laneMeaning(phone) {
  return phone ? {browser: 'what the person sees and taps on their phone', frontend: 'the rest of the app, running on the phone', server: 'code on a machine you pay for, not the phone', data: 'the database, files, messages and outside services'}
    : {browser: 'what the visitor sees and clicks', frontend: 'your pages and screens, the code that builds them', server: 'code on a machine you pay for, not the visitor’s', data: 'the database, files, shell commands and outside services'};
}
// One cell per part with the number of open findings there, tinted by the worst one (the word is always beside it).
function whereStrip(sum) {

      if (S.privacy === 'full' && !S.agreed) { upMsg('warn', 'Tick the box to agree to keeping snippets, or choose <b>Map and findings only</b>.'); return; }

function follow(id) {

  es.addEventListener('log', e => {
    const log = document.getElementById('runlog'); if (!log || S.runId !== id) return;
    if (first) { log.textContent = ''; first = false; }
    let line = ''; try { line = JSON.parse(e.data); } catch (x) { return; }
    log.textContent += (log.textContent ? '\n' : '') + line; log.scrollTop = log.scrollHeight;
    if (/^· /.test(line)) api('/v1/runs/' + encodeURIComponent(id)).then(r => { if (S.runId === id && ACTIVE.includes(r.status)) { S.run = r; const keep = log.textContent; renderProgress(document.getElementById('view'), r); const l2 = document.getElementById('runlog'); if (l2) { l2.textContent = keep; l2.scrollTop = l2.scrollHeight; } } }).catch(() => {});
  });

    let r = null; try { r = JSON.parse(e.data); } catch (x) {}
    if (r && r.id === id) { S.run = r; S.runs = (S.runs || []).map(x => x.id === id ? r : x); loadMe().then(drawAcct); if (S.runId === id) render(); }

}
function stopFollow() { if (S.stream) { S.stream.es.close(); S.stream = null; } }

// ---- words from a model: consent first, then Explain (a job on the server) and Ask Lantern (an answer now)
// Nothing goes to a model before the person has read where it goes and agreed; the server checks that too (412).
const AI = {state: null, watching: {}};

}

}

function fmtAsk(t) { return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([0-9a-f]{12})\]/g, '<code>$1</code>'); }

// A screenshot's text is read by Lantern's server (Pillow + Tesseract, in memory, never kept); only the text comes
// back, shown here, and it reaches the model only inside a question the person sends.
async function askAttach(file) {
  if (file.size > 8 * 1024 * 1024) { ASK.shot = {name: file.name, info: 'too large: 8 MB at most', text: ''}; return renderAsk(); }
  ASK.shot = {name: file.name, info: 'reading the text…', text: ''}; renderAsk();
  try {
    const fd = new FormData(); fd.append('file', file);
    const res = await fetch('/v1/ask/screenshot', {method: 'POST', body: fd, credentials: 'same-origin', headers: {'X-Lantern-Site': '1'}});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) ASK.shot = {name: file.name, info: (j.error && j.error.message) || 'could not read the image', text: ''};
    else if (typeof j.text !== 'string') ASK.shot = {name: file.name, info: `${j.width || '?'}×${j.height || '?'} · ${j.reason || 'text not read'}`, text: ''};
    else ASK.shot = {name: file.name, info: `${j.width}×${j.height} · read by Lantern, not kept · ${j.lines} line${j.lines === 1 ? '' : 's'} of text found`, text: j.text};
  } catch (err) { ASK.shot = {name: file.name, info: 'could not read the image', text: ''}; }
  renderAsk();
}

const FAQ = [
  ['Privacy', 'What happens to my code?', 'Lantern copies the repository, or the files you upload, into a sealed box on its server, reads it without installing or running anything, and deletes the copy when the check ends. What stays is the result: the map, the findings and the grade. With <b>Map and findings only</b> no code is kept at all; with <b>Include code snippets</b> the short lines the report talks about are kept too.'],
  ['Privacy', 'Who can see my results?', 'Only you, while you are signed in. Each report opens through a link that works for an hour and only for your account. Nothing is shared unless you click <b>Share</b> on a run; that makes a link anyone holding it can open, and <b>Stop sharing</b> turns it off again.'],
  ['Privacy', 'What exactly is stored, and for how long?', 'Your account id from GitHub or Google and its public name (never your email), when you agreed to send code to a model (if you did), and for each check: the link, the privacy choice, the status, the times, the commit and the counts, plus the result files (the map, the findings, the grade, the evidence page; short code lines only if you chose <b>Include code snippets</b>). Results stay until you delete them. The sign-in token lives on your computer or in a browser cookie; the gateway keeps only a fingerprint of it and a count of requests per day, each deleted 90 days after its last use. Logs of a check show stages and errors, never file contents, and are kept with the run. There is no advertising, no tracking script, and nothing is sold or shared.'],
  ['Privacy', 'What are the limits, and when do they reset?', 'Each account can run 50 checks a day, one at a time, and everyone together 1,000 a day; explanations through the free allowance have their own daily and lifetime limits. Every limit resets at midnight UTC, and the message you see says how long that is from now (for example “in 5 h 20 min”). The number of checks left today is under your name, top right.'],
  ['Privacy', 'How do I delete my results?', 'The bin icon on a run deletes that run, its report and its share link. To delete everything, open <b>Settings</b> (or press your name, top right), then <b>Delete my account</b>. Your GitHub or Google account is not touched.'],
  ['Using it', 'Which links work?', 'The https link of a public repository on GitHub, GitLab, Bitbucket, Codeberg and other public code hosts, like <code>https://github.com/owner/name</code>. A link to a branch (<code>/tree/branch</code>) checks that branch.'],
  ['Using it', 'How long does a check take, and how many can I run?', 'Usually about a minute, up to a few minutes for a very large app. Each account can run 50 checks a day and one at a time; the number left today is under your name, top right.'],
  ['Using it', 'Does Lantern run my app or my tests?', 'No. In the cloud Lantern only reads the code. To watch your tests run, use the Lantern app on your own computer: <code>pip install lantern</code> then <code>lantern serve</code>.'],
  ['Results', 'What do the grade and the colours mean?', 'The grade (A to F) and the readiness number come from ten checks a senior engineer would make before launch. Red means a serious problem, orange and yellow smaller ones, green means it passed. Every colour sits next to a word, so you never have to guess.'],
  ['Results', 'What does “Explain in plain words” do with my code?', 'It asks a language model to describe what each function on your app’s main paths does, in everyday words, with every phrase tied to a real line or name in your code (a phrase that is not is thrown away). For that, Lantern copies the repository again for a moment, sends the code of up to 40 functions to the model through your free allowance, and deletes the copy. It asks you first, says exactly where the code goes, and you can turn it off in Settings. Ask Lantern sends your question and the check’s results, not your code. A screenshot you add is read by Lantern for its text and never kept; only that text goes with your question.'],
  ['Using it', 'Does it read phone apps?', 'Yes. Android (Java or Kotlin), iPhone (Swift), Flutter, React Native and .NET MAUI apps get an <b>On the phone</b> card with the screens, the links other apps can open, and every permission with a plain-words meaning and whether the code uses it, plus phone-specific checks (a link that reaches a database query, a secret in plain storage, cleartext traffic). An app with a server side gets both in one map.'],
  ['Terms', 'What are the terms of use?', 'One page in plain words: <a href="https://github.com/LittleHenderson/Lantern/blob/main/docs/terms.md" target="_blank" rel="noopener">docs/terms.md</a>. In short: check code you own or may read, do not multiply accounts, your code copy is deleted when the check ends, your results stay until you delete them, nothing goes to a model unless you ask and agree, and the service is a preview with no warranty. The Lantern software itself is MIT-licensed.'],
  ['Results', 'Can I trust what it says?', 'Every finding comes from a deterministic check, with the file, the line, and how a visitor reaches it. Lantern shows how sure it is about each connection, and never lets an AI create or dismiss a finding.'],
];

    <div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="dorename">Save</button></div>`);
  el.querySelector('#dorename').onclick = async () => {
    try { await api(`/v1/workspaces/${encodeURIComponent(w.id)}`, {method: 'PATCH', body: {name: el.querySelector('#newname').value}}); await loadTeams(); closeSheet(); render(); }
    catch (e) { el.querySelector('#rmsg').innerHTML = note('err', esc(e.message)); }
  };
}
function closeTeamSheet(w) {
  confirmSheet(`Close ${w.name}?`, 'Everyone leaves it, unused invite links stop working, and every report in it goes back to being its owner’s alone. No report is deleted.', 'Close workspace', async () => {
    await api('/v1/workspaces/' + encodeURIComponent(w.id), {method: 'DELETE'}); await loadTeams(); location.hash = '#/team'; });
}
async function renderJoin(el) {
  const code = S.joinCode;
  if (!code) { el.innerHTML = `<main style="max-width:640px">${note('warn', 'This invite link is incomplete. Ask for a new one.')}</main>`; return; }
  let i;
  try { i = await api('/v1/invites/peek', {method: 'POST', body: {code}}); }
  catch (e) { el.innerHTML = `<main class="simplehome onb"><h1>This invite doesn’t work any more</h1><p class="lede">${esc(e.message)}</p><div class="go"><a class="btn primary" href="#/">Go to Lantern</a></div></main>`; return; }
  if (S.view !== 'join') return;
  el.innerHTML = `<main class="simplehome onb"><h1>Join ${esc(i.name)}</h1>
    <p class="lede">You’ll see the reports its people put there, and you can add yours. Nobody sees your other runs.</p>
    <div class="go"><button class="btn primary big" id="dojoin">${S.me ? 'Join' : 'Sign in to join'}</button></div><div id="joinmsg"></div>
    ${why('<p style="margin:0">This link works once. When you join, it stops working for anyone else. You can leave at any time from the Team page.</p>', 'What does joining do?')}</main>`;
  const go2 = async () => {
    try { const w = await api('/v1/invites/accept', {method: 'POST', body: {code}}); S.joinCode = null; await loadTeams(); location.replace('#/team/' + encodeURIComponent(w.id)); }
    catch (e) { el.querySelector('#joinmsg').innerHTML = note('err', esc(e.message)); }
  };
  el.querySelector('#dojoin').onclick = () => { if (S.me) return go2(); S.pendingJoin = true; signInSheet('Sign in, and you join straight after.'); };
  if (S.me && S.pendingJoin) { S.pendingJoin = false; go2(); }
}

// ---- settings: the website's own choices (kept in this browser) and the account's (kept on the server)
function renderSettings(el) {
  const me = S.me, mode = viewMode(), phone = innerWidth <= 760;
  const name = me ? String(me.label || '').split(':').pop() : '', via = me ? ({github: 'GitHub', google: 'Google', token: 'a Lantern token'}[me.account] || me.account) : '';
  const themeBtn = (t, ic, label) => `<button data-theme="${t}" class="${THEME === t ? 'on' : ''}">${icon(ic)}${label}</button>`;
  const priv = S.privacy;
  el.innerHTML = `<main style="max-width:760px"><section class="hero"><h1>Settings</h1><p class="lede">How Lantern looks, what it keeps from your checks, and your account.</p></section>
    <div class="card group"><h2>Appearance</h2>
      <div class="row" style="justify-content:space-between"><div><b>Theme</b><div class="hint" style="margin-top:2px">System follows your device's light or dark setting.</div></div><div class="seg" id="themeseg">${themeBtn('light', 'sun', 'Light')}${themeBtn('dark', 'moon', 'Dark')}${themeBtn('auto', 'auto', 'System')}</div></div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><div><b>How much to show</b><div class="hint" style="margin-top:2px">${phone ? 'Phones always use Simple. Advanced is for bigger screens.' : 'Simple: plain sentences and one next step. Advanced: every table and panel.'}</div></div><div class="seg" id="modeseg">${['simple', 'advanced'].map(v => `<button data-m="${v}" class="${mode === v ? 'on' : ''}" ${phone && v === 'advanced' ? 'disabled' : ''}>${v === 'simple' ? 'Simple' : 'Advanced'}</button>`).join('')}</div></div></div>
    <div class="card group"><h2>What a new check keeps</h2><div class="hint">Your copy of the code is always deleted when a check ends. This is what stays with the results.</div>
      <label class="choice ${priv === 'structure' ? 'on' : ''}"><input type="radio" name="defpriv" value="structure" ${priv === 'structure' ? 'checked' : ''}><span><b>Map and findings only <span class="tag priv">Private</span></b>No code is kept. The report names files and lines.</span></label>
      <label class="choice ${priv === 'full' ? 'on' : ''}"><input type="radio" name="defpriv" value="full" ${priv === 'full' ? 'checked' : ''}><span><b>With code snippets</b>The short lines the report talks about are kept too, so you can read them in the report. You still tick a box to agree on each check.</span></label>
      <div id="privmsg" class="hint"></div></div>
    <div class="card group"><h2>Plain-words explanations</h2><div id="aiset">${me ? '<div class="hint">Looking…</div>' : '<div class="hint">Sign in to use Explain in plain words and Ask Lantern.</div>'}</div></div>
    <div class="card group"><h2>Account</h2>${me
      ? `<div class="alsorow"><div><b>${esc(name)}</b><div class="hint">Signed in with ${esc(via)}. ${esc(me.runs_today)} of today's ${esc(me.limits.runs_per_day)} checks used; the count starts again at midnight UTC.</div></div><button class="btn" id="setsignout">Sign out</button></div>
        <div class="alsorow"><div><b>Delete my account</b><div class="hint">Deletes every run, report and share link Lantern keeps for you. Your GitHub or Google account is not touched.</div></div><button class="btn danger" id="setdelme">${icon('trash')}Delete</button></div>`
      : `<div class="alsorow"><div><b>Not signed in</b><div class="hint">Sign in with GitHub or Google to run checks and keep your results.</div></div><button class="btn primary" id="setsignin">Sign in</button></div>`}</div>
    <div class="card group"><h2>Also</h2>
      <div class="alsorow"><div><b>The welcome</b><div class="hint">The short film that plays when you open Lantern.</div></div><button class="btn" id="setintro">Play it</button></div>
      <div class="alsorow"><div><b>Questions and privacy</b><div class="hint">What happens to your code, who can see results, limits.</div></div><button class="btn" id="sethelp">Help</button></div>
      <div class="alsorow"><div><b>Terms of use</b><div class="hint">One page in plain words.</div></div><a class="btn" href="https://github.com/LittleHenderson/Lantern/blob/main/docs/terms.md" target="_blank" rel="noopener">Open</a></div></div>
    <p class="foot">Lantern ${esc(VERSION)} · Appearance, view and the default above are kept in this browser; your account and results are kept on Lantern's server.</p></main>`;
  el.querySelectorAll('#themeseg button').forEach(b => b.onclick = () => { setTheme(b.dataset.theme); el.querySelectorAll('#themeseg button').forEach(x => x.classList.toggle('on', x === b)); });
  el.querySelectorAll('#modeseg button').forEach(b => b.onclick = () => { try { localStorage.setItem('lantern.simple', b.dataset.m === 'simple' ? '1' : '0'); } catch (e) {} drawViewMode(); render(); });
  el.querySelectorAll('input[name=defpriv]').forEach(r => r.onchange = () => {
    S.privacy = r.value; S.agreed = false;
    try { localStorage.setItem('lantern.privacy', r.value); } catch (e) {}
    el.querySelectorAll('.choice').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
    el.querySelector('#privmsg').textContent = r.value === 'full' ? 'Saved. New checks start with code snippets selected.' : 'Saved. New checks keep no code.';
  });
  el.querySelector('#setintro').onclick = () => { if (window.replayIntro) window.replayIntro(); };
  el.querySelector('#sethelp').onclick = () => go('help');
  if (!me) { el.querySelector('#setsignin').onclick = () => signInSheet(); return; }
  el.querySelector('#setsignout').onclick = signOut;
  el.querySelector('#setdelme').onclick = deleteMeSheet;
  aiState(true).then(st => {
    const box = el.querySelector('#aiset'); if (!box || S.view !== 'settings') return;
    if (!st) { box.innerHTML = note('warn', 'Lantern could not reach the free allowance just now. Try again in a minute.'); return; }
    box.innerHTML = `<div class="alsorow"><div><b>${st.consent ? 'On' : 'Off'}</b><div class="hint">${st.consent
      ? `Explain in plain words and Ask Lantern can send your work to a language model, paid from your free allowance. ${leftLine(st)}`
      : 'Lantern has not sent anything to a model for you. Turning this on shows exactly what is sent and where, first.'}</div></div><button class="btn ${st.consent ? '' : 'primary'}" id="aitoggle">${st.consent ? 'Turn off' : 'Turn on'}</button></div><div id="aimsg"></div>`;
    box.querySelector('#aitoggle').onclick = async () => {
      if (!st.consent) return consentSheet(st, () => { if (S.view === 'settings') render(); });
      try { AI.state = {...st, ...(await api('/v1/ai/consent', {method: 'POST', body: {agree: false}}))}; render(); }
      catch (e) { box.querySelector('#aimsg').innerHTML = note('err', esc(e.message)); }
    };
  });
}

// ---- routing
function go(view) { location.hash = view === 'help' ? '#/help' : view === 'settings' ? '#/settings' : view === 'team' ? '#/team' : '#/'; }
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
// The logo is "Lantern home": from any other screen it goes to My runs; on My runs it plays the welcome again
// (Skip, a click or Escape ends it), the same as opening the site fresh.
document.getElementById('home').onclick = () => {
  if (S.view !== 'home') return go('home');
  if (window.replayIntro) window.replayIntro(); else { scrollTo(0, 0); if (S.me) loadRuns().then(render); }
};
function route() {
  let h = location.hash.replace(/^#\/?/, '');
  const j = /^join\/([A-Za-z0-9_-]{20,64})$/.exec(h);
  if (j) { S.joinCode = j[1]; history.replaceState(null, '', '#/join'); h = 'join'; }   // the invite's secret leaves the address bar and history
  const m = /^run\/([A-Za-z0-9_-]{1,40})$/.exec(h), t = /^team\/([A-Za-z0-9_-]{1,40})$/.exec(h);
  const prev = S.runId;
  S.teamId = t ? t[1] : null;
  S.view = m ? 'run' : t ? 'team' : h === 'team' ? 'teams' : h === 'join' ? 'join' : h === 'help' || h === 'settings' ? h : 'home';
  S.runId = m ? m[1] : null;
  if (S.runId !== prev) { S.frame = null; if (!S.runId || (S.run && S.run.id !== S.runId)) S.run = null; }
  if (S.view !== 'run') stopFollow();
  for (const b of document.querySelectorAll('#nav button')) b.classList.toggle('on', b.dataset.v === (S.view === 'run' ? 'home' : S.view === 'teams' || S.view === 'team' ? 'team' : S.view));
  render(); scrollTo(0, 0);
  if (S.view === 'home' && S.me) loadRuns().then(() => { if (S.view === 'home') render(); });
}
// One header row on a run's screens, as in the app: the logo, Simple/Advanced, appearance and account buttons move
// (not copied, so their listeners stay) from the global header into the run's bar, and back on every other screen.
function dock(inRun) {
  const top = document.querySelector('header.top'), brand = document.getElementById('home'), nav = document.getElementById('nav');
  const a = inRun && document.querySelector('.sub [data-dock="brand"]'), b = inRun && document.querySelector('.sub [data-dock="end"]');
  const rest = ['viewmode', 'theme', 'acct'].map(i => document.getElementById(i));
  document.body.classList.toggle('inproj', !!(a && b));
  if (a && b) { a.replaceWith(brand); b.replaceWith(...rest); return; }
  if (brand.parentElement !== top) { top.insertBefore(brand, nav); top.append(...rest); }
}
function render() {
  const el = document.getElementById('view');
  dock(false);
  setBackdrop(); drawViewMode(); drawAcct(); renderAsk();
  document.getElementById('navteam').hidden = !(S.me && (!simple() || (S.teams || []).length));
  if (S.view === 'run') return renderRun(el, S.runId);
  if (S.view === 'help') return renderHelp(el);
  if (S.view === 'teams') return renderTeams(el);
  if (S.view === 'team') return renderTeam(el, S.teamId);
  if (S.view === 'join') return renderJoin(el);
  if (S.view === 'settings') return renderSettings(el);
  renderHome(el);
}
// While a run on the list is going, refresh the list every few seconds (the run page streams its own log).
setInterval(() => {
  if (S.view === 'home' && S.me && (S.runs || []).some(r => ACTIVE.includes(r.status)) && !document.hidden)
    loadRuns().then(() => { if (S.view === 'home' && !document.activeElement?.matches('input')) render(); });
}, 3000);
addEventListener('hashchange', () => { S.addMsg = null; route(); });
addEventListener('resize', () => { const m = document.body.dataset.mode; drawViewMode(); if (document.body.dataset.mode !== m) render(); });
(async () => { await Promise.all([loadMe(), loadSamples()]); await Promise.all([loadRuns(), loadTeams()]); route(); })();
</script>

window.OM_SCENES = [{"name":"Dark","dur":3},{"name":"Click","dur":5},{"name":"Lit","dur":5},{"name":"Ready","dur":5},{"name":"Tagline","dur":2}];
window.TWEAK_DEFAULTS = {"motionEditor": false, "captions": true};
</script>
<script src="/intro-runtime.js"></script>
<script src="/intro.js"></script>
<script>
// The intro: the landing page's 20 seconds, on every visit to the home page (Skip, a click or Escape jumps to its end
// card). Nothing is remembered. If the scripts above did not load, the overlay hides and the page shows.
(function () {
  const intro = document.getElementById('intro'), end = document.getElementById('introend'), skipzone = document.getElementById('skipzone');
  let state = intro.classList.contains('hidden') ? 'hidden' : 'playing', sound = false, root = null;
  const control = { current: null };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mount() {
    if (!window.LanternIntro || !window.ReactDOM || !window.React) return false;
    if (!root) root = ReactDOM.createRoot(document.getElementById('stage'));
    root.render(React.createElement(window.LanternIntro, { sound, control, onDone: showEnd }));
    return true;
  }
  function resetEnd() { end.classList.remove('on'); end.hidden = true; skipzone.hidden = false; }
  function play() {
    resetEnd();
    if (!mount()) { state = 'hidden'; intro.className = 'hidden'; return; }
    state = 'playing'; intro.style.transition = ''; intro.className = '';
    if (control.current) control.current.restart();
  }
  function showEnd() {
    if (state !== 'playing') return;
    state = 'ended'; skipzone.hidden = true; end.hidden = false;
    requestAnimationFrame(() => { end.classList.add('on'); document.getElementById('end-start').focus({ preventScroll: true }); });
  }
  function skip() {
    if (state !== 'playing') return;
    if (control.current && control.current.seekToEnd) control.current.seekToEnd(); else showEnd();
  }
  function finish() {
    if (state !== 'playing' && state !== 'ended') return;
    state = 'fading'; intro.className = 'fading';
    setTimeout(() => { if (state === 'fading') { state = 'hidden'; intro.className = 'hidden'; resetEnd(); } }, 950);
  }
  // Land on the home page's link box (with a short accent ring) or on the sample apps.
  function land(where) {
    if (location.hash.replace(/^#\/?/, '')) location.hash = '#/';
    setTimeout(() => {
      const t = where === 'samples' ? document.querySelector('.samples') : document.querySelector('.dropzone');
      if (!t) return;
      t.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
      const inp = document.getElementById('link');
      if (where !== 'samples' && inp) inp.focus({ preventScroll: true });
      t.classList.add('hi'); setTimeout(() => t.classList.remove('hi'), 1200);
    }, 60);
  }
  skipzone.onclick = skip;
  document.getElementById('skipbtn').onclick = () => { if (state === 'ended') finish(); else skip(); };
  document.getElementById('end-start').onclick = () => { finish(); land('box'); };
  document.getElementById('end-sample').onclick = () => { finish(); land('samples'); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state === 'playing') { e.preventDefault(); skip(); }
    else if ((e.key === 'Enter' || e.key === ' ') && state === 'ended' && !(e.target.closest && e.target.closest('#introbar, #end-sample'))) {
      e.preventDefault(); finish(); land('box');
    }
  });
  document.getElementById('soundbtn').onclick = () => {
    sound = !sound;
    document.getElementById('snd-on').style.display = sound ? '' : 'none';
    document.getElementById('snd-off').style.display = sound ? 'none' : '';
    document.getElementById('soundlabel').textContent = sound ? 'Sound on' : 'Sound off';
    document.getElementById('soundbtn').title = sound ? 'Mute' : 'Unmute (subtle tones)';
    if (state === 'playing') mount();
  };
  window.replayIntro = () => { scrollTo(0, 0); play(); };
  if (state === 'playing') play();
})();
</script>
