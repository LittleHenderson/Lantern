[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.0.1"
description = "Map every call path in a Python and/or JS/TS repo, front end to back end, explain it in three lenses, and audit it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
scan = ["bandit>=1.7", "pip-audit>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
lantern = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
