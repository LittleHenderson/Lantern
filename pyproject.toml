[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.10.0"
license = "MIT"
description = "Map every call path in a full-stack app (Python + TypeScript/JavaScript), explain it in three lenses, and audit it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23,!=0.26.0",   # 0.26.0 frees a node's line number while it is in use (rows past 256): segfault
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-kotlin>=1.1",
  "tree-sitter-swift>=0.7",
  "tree-sitter-dart>=0.1",
  "tree-sitter-c-sharp>=0.23",
  "tree-sitter-php>=0.23",
  "tree-sitter-ruby>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
]

[project.urls]
Homepage = "https://littlehenderson.github.io/Lantern/"
Issues = "https://github.com/LittleHenderson/Lantern/issues"
Source = "https://github.com/LittleHenderson/Lantern"

[project.optional-dependencies]
scan = ["bandit>=1.7", "pip-audit>=2.7"]
ocr = ["Pillow>=10"]   # screenshot reading; the Tesseract program itself comes from the OS (see docs/try-lantern.md)
# dev: what the tests need, the libraries of the two services (gateway/, cloud/) included. CI installs it and sets
# LANTERN_TESTS_COMPLETE=required, so a test that is skipped there for a missing library fails the run.
dev = ["pytest>=8", "Pillow>=10", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "PyJWT[crypto]>=2.8"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
lantern = ["viewer/*.html", "viewer/*.js", "viewer/*.svg", "viewer/*.webmanifest", "starters/**/*.tmpl", "packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 130
extend-exclude = ["tests/fixtures", "lantern/starters", "site"]

[tool.ruff.lint]
# Mistakes that are not bugs yet: undefined and unused names, wrong imports, likely-bug patterns (B).
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905", "E731", "E741"]   # zip(strict=) needs 3.10 semantics everywhere; one-letter names and lambdas are fine here
