[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern"
version = "0.1.0"
description = "Map every call path in a full-stack app (Python + TypeScript/JavaScript), explain it in three lenses, and audit it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
]

[project.optional-dependencies]
scan = ["bandit>=1.7", "pip-audit>=2.7"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
lantern = "lantern.cli:main"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
lantern = ["viewer/*.html", "viewer/*.js", "viewer/*.svg", "viewer/*.webmanifest", "starters/**/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
